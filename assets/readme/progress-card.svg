<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="180" viewBox="0 0 1200 180" role="img" aria-labelledby="title desc">
  <title id="title">SwirEngine progress — 100.0%</title>
  <desc id="desc">SwirEngine 2.0 — Release-Quality Python-First Game Production. Status COMPLETE. Verified 10 / 10 milestones. Source: ROADMAP_2_0.md. Release/PyPI frozen until SwirEngine 2.0.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#02050A"/>
      <stop offset="1" stop-color="#07111C"/>
    </linearGradient>
    <linearGradient id="progressGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0088FF"/>
      <stop offset="1" stop-color="#62E5FF"/>
    </linearGradient>
    <filter id="softGlow" x="-10%" y="-80%" width="120%" height="260%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#62E5FF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <clipPath id="trackClip"><rect x="50" y="125" width="1100" height="18" rx="9"/></clipPath>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; }
      .label { fill: #62E5FF; font-size: 13px; font-weight: 700; letter-spacing: 2px; }
      .project { fill: #F4FAFF; font-size: 28px; font-weight: 700; }
      .scope { fill: #8DA8B8; font-size: 17px; }
      .meta { fill: #F4FAFF; font-size: 14px; font-weight: 600; }
      .release { fill: #8DA8B8; font-size: 12px; }
    </style>
  </defs>
  <rect x="1" y="1" width="1198" height="178" rx="18" fill="url(#panel)" stroke="#0088FF" stroke-opacity="0.42"/>
  <rect x="1" y="1" width="1198" height="178" rx="18" fill="url(#grid)"/>
  <text x="50" y="28" class="label">SWIR PROJECT · VERIFIED ROADMAP PROGRESS</text>
  <text x="50" y="54" class="project">SwirEngine</text>
  <text x="50" y="68" class="scope">SwirEngine 2.0 — Release-Quality Python-First Game Production</text>
  <text x="1150" y="38" text-anchor="end" class="project">100.0%</text>
  <text x="1150" y="65" text-anchor="end" class="meta">COMPLETE · 10 / 10 milestones</text>
  <rect x="50" y="125" width="1100" height="18" rx="9" fill="#07111C" stroke="#0088FF" stroke-opacity="0.45"/>
  <rect x="50" y="125" width="1100.000000" height="18" rx="9" fill="url(#progressGradient)" filter="url(#softGlow)" clip-path="url(#trackClip)" />
  <text x="50" y="165" class="release">Release/PyPI frozen until SwirEngine 2.0</text>
  <text x="1150" y="165" text-anchor="end" class="release">Source: ROADMAP_2_0.md</text>
</svg>
