name: Physics 2.0 repair

on:
  push:
    branches:
      - "feat/1.4-physics-2"
    paths:
      - ".github/workflows/physics2-repair.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/1.4-physics-2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Apply focused Physics 2.0 repair
        shell: python
        run: |
          from pathlib import Path

          dynamics_path = Path("src/swirengine/physics/dynamics3d.py")
          dynamics = dynamics_path.read_text(encoding="utf-8")
          old_impulse = '''        if inv_a > 0.0:
              a.velocity.x -= ix * inv_a
              a.velocity.y -= iy * inv_a
              a.velocity.z -= iz * inv_a
              a.wake()
          if inv_b > 0.0:
              b.velocity.x += ix * inv_b
              b.velocity.y += iy * inv_b
              b.velocity.z += iz * inv_b
              b.wake()
          '''
          new_impulse = '''        if inv_a > 0.0:
              a.velocity.x -= ix * inv_a
              a.velocity.y -= iy * inv_a
              a.velocity.z -= iz * inv_a
          if inv_b > 0.0:
              b.velocity.x += ix * inv_b
              b.velocity.y += iy * inv_b
              b.velocity.z += iz * inv_b
          '''
          if dynamics.count(old_impulse) != 1:
              raise SystemExit("expected one contact impulse wake block")
          dynamics = dynamics.replace(old_impulse, new_impulse)
          dynamics_path.write_text(dynamics, encoding="utf-8")

          tests_path = Path("tests/test_physics2_1_4.py")
          tests = tests_path.read_text(encoding="utf-8")
          old_signature = '''    size: float = 1.0,
              body_type: str = "dynamic",
              friction: float = 0.5,
              restitution: float = 0.0,
              continuous: bool = False,
          ) -> PhysicsBody3D:
              target = Target3D(Vec3(x, y, z))
              collider = BoxCollider3D(target, width=size, height=size, depth=size)
          '''
          new_signature = '''    size: float = 1.0,
              width: float | None = None,
              height: float | None = None,
              depth: float | None = None,
              body_type: str = "dynamic",
              friction: float = 0.5,
              restitution: float = 0.0,
              continuous: bool = False,
          ) -> PhysicsBody3D:
              target = Target3D(Vec3(x, y, z))
              collider = BoxCollider3D(
                  target,
                  width=size if width is None else width,
                  height=size if height is None else height,
                  depth=size if depth is None else depth,
              )
          '''
          if tests.count(old_signature) != 1:
              raise SystemExit("expected one box_body helper signature")
          tests = tests.replace(old_signature, new_signature)

          old_floor = '''    floor_body = box_body(0.0, -0.5, 0.0, size=20.0, body_type="static", friction=friction)
          '''
          new_floor = '''    floor_body = box_body(
              0.0,
              -0.5,
              0.0,
              width=20.0,
              height=1.0,
              depth=20.0,
              body_type="static",
              friction=friction,
          )
          '''
          if tests.count(old_floor) != 1:
              raise SystemExit("expected one friction floor fixture")
          tests = tests.replace(old_floor, new_floor)

          old_sleep_floor = '''    scene.add(box_body(0.0, -0.5, 0.0, size=20.0, body_type="static"))
          '''
          new_sleep_floor = '''    scene.add(
              box_body(
                  0.0,
                  -0.5,
                  0.0,
                  width=20.0,
                  height=1.0,
                  depth=20.0,
                  body_type="static",
              )
          )
          '''
          if tests.count(old_sleep_floor) != 1:
              raise SystemExit("expected one sleeping floor fixture")
          tests = tests.replace(old_sleep_floor, new_sleep_floor)
          tests_path.write_text(tests, encoding="utf-8")
      - name: Verify patch shape
        run: git diff --check && git diff -- src/swirengine/physics/dynamics3d.py tests/test_physics2_1_4.py
      - name: Commit focused repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/swirengine/physics/dynamics3d.py tests/test_physics2_1_4.py
          git commit -m "fix(physics): stabilize friction floor and body sleeping"
          git push origin HEAD:feat/1.4-physics-2
