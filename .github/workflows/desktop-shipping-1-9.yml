name: Desktop Shipping 1.9

on:
  push:
    branches:
      - main
      - "feat/1.9-desktop-shipping-matrix"
    paths:
      - "src/swirengine/desktop_shipping19.py"
      - "tests/test_shipping_1_9.py"
      - "tests/test_exporting.py"
      - "tools/benchmark_desktop_shipping_1_9.py"
      - "tools/verify_clean_desktop_shipping_1_9.py"
      - "docs/desktop-shipping-1.9.md"
      - "ROADMAP_1_9.md"
      - "assets/readme/progress-card.svg"
      - "assets/readme/progress-mini.svg"
      - "tools/generate_progress_svg.py"
      - ".github/workflows/desktop-shipping-1-9.yml"
  pull_request:
    paths:
      - "src/swirengine/desktop_shipping19.py"
      - "tests/test_shipping_1_9.py"
      - "tests/test_exporting.py"
      - "tools/benchmark_desktop_shipping_1_9.py"
      - "tools/verify_clean_desktop_shipping_1_9.py"
      - "docs/desktop-shipping-1.9.md"
      - "ROADMAP_1_9.md"
      - "assets/readme/progress-card.svg"
      - "assets/readme/progress-mini.svg"
      - "tools/generate_progress_svg.py"
      - ".github/workflows/desktop-shipping-1-9.yml"

permissions:
  contents: read

concurrency:
  group: desktop-shipping-1-9-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  contract-python:
    name: Contract Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install CPython 3.14 native build prerequisites
        if: matrix.python-version == '3.14'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run desktop shipping contracts and exporter regressions
        run: >-
          python -m pytest -q
          tests/test_shipping_1_9.py
          tests/test_exporting.py
      - name: Lock existing input/UI/settings shipping contract
        run: python -m pytest -q tests/test_input_ui_settings_1_9.py
      - name: Check progress assets
        if: matrix.python-version == '3.13'
        run: python tools/generate_progress_svg.py --check
      - name: Run deterministic planning workload
        if: matrix.python-version == '3.13'
        run: python tools/benchmark_desktop_shipping_1_9.py --cycles 500 --ceiling 5.0
      - name: Ruff
        if: matrix.python-version == '3.13'
        run: >-
          python -m ruff check
          src/swirengine/desktop_shipping19.py
          tests/test_shipping_1_9.py
          tools/benchmark_desktop_shipping_1_9.py
          tools/verify_clean_desktop_shipping_1_9.py
      - name: Compile
        run: >-
          python -m compileall -q
          src/swirengine/desktop_shipping19.py
          tests/test_shipping_1_9.py
          tools/benchmark_desktop_shipping_1_9.py
          tools/verify_clean_desktop_shipping_1_9.py

  native-shipping-matrix:
    name: Native ${{ matrix.os }} / Python 3.13
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install test and build dependencies
        run: python -m pip install --upgrade pip build pyinstaller ".[dev]"
      - name: Run desktop shipping contracts and exporter regressions
        run: python -m pytest -q tests/test_shipping_1_9.py tests/test_exporting.py
      - name: Build source wheel
        run: python -m build --wheel --outdir wheelhouse
      - name: Verify clean wheel install, host-native build, manifest and runtime
        run: python tools/verify_clean_desktop_shipping_1_9.py --wheelhouse wheelhouse
