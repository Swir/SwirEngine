name: Desktop Shipping 1.9

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: desktop-shipping-1-9-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  native-shipping-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test and build dependencies
        run: python -m pip install --upgrade pip build pyinstaller ".[dev]"
      - name: Run desktop shipping contracts and exporter regressions
        run: python -m pytest tests/test_shipping_1_9.py tests/test_exporting.py
      - name: Check progress assets
        run: python tools/generate_progress_svg.py --check
      - name: Lint and compile shipping implementation
        run: >-
          python -m ruff check
          src/swirengine/shipping19.py
          tests/test_shipping_1_9.py
          tools/benchmark_desktop_shipping_1_9.py
          tools/verify_clean_desktop_shipping_1_9.py
      - name: Compile shipping implementation
        run: >-
          python -m compileall -q
          src/swirengine/shipping19.py
          tests/test_shipping_1_9.py
          tools/benchmark_desktop_shipping_1_9.py
          tools/verify_clean_desktop_shipping_1_9.py
      - name: Run deterministic planning workload
        run: python tools/benchmark_desktop_shipping_1_9.py --cycles 500 --ceiling 5.0
      - name: Build source wheel
        run: python -m build --wheel --outdir wheelhouse
      - name: Verify clean wheel install, host-native build, manifest and runtime
        run: python tools/verify_clean_desktop_shipping_1_9.py --wheelhouse wheelhouse
