name: GPU Instancing 1.3 Validation

on:
  pull_request:
    paths:
      - "src/swirengine/graphics/instancing.py"
      - "src/swirengine/graphics/shadow_renderer.py"
      - "src/swirengine/graphics/stats.py"
      - "src/swirengine/__init__.py"
      - "tests/test_instancing.py"
      - "examples/demo_gpu_instancing.py"
      - "tools/benchmark_gpu_instancing.py"
      - "tools/verify_gpu_instancing_opengl.py"
      - ".github/workflows/gpu-instancing-1-3.yml"
  push:
    branches: ["main"]
    paths:
      - "src/swirengine/graphics/instancing.py"
      - "src/swirengine/graphics/shadow_renderer.py"
      - "src/swirengine/graphics/stats.py"
      - "src/swirengine/__init__.py"
      - "tests/test_instancing.py"
      - "tools/verify_gpu_instancing_opengl.py"
      - ".github/workflows/gpu-instancing-1-3.yml"

permissions:
  contents: read

jobs:
  cpu-contract:
    name: Instancing CPU contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest tests/test_instancing.py
      - run: ruff check src/swirengine/graphics/instancing.py tests/test_instancing.py examples/demo_gpu_instancing.py tools/benchmark_gpu_instancing.py tools/verify_gpu_instancing_opengl.py
      - run: python -m compileall -q src/swirengine/graphics/instancing.py examples/demo_gpu_instancing.py tools/benchmark_gpu_instancing.py tools/verify_gpu_instancing_opengl.py
      - run: python tools/benchmark_gpu_instancing.py

  opengl-smoke:
    name: Real OpenGL instancing smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Install software OpenGL/Xvfb runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libgl-dev libegl-dev
      - name: Compile and execute real instanced draw path
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a python tools/verify_gpu_instancing_opengl.py
