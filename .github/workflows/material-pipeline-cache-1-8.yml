name: Material Pipeline Cache 1.8

on:
  push:
    branches: ["feat/1.8-material-pipeline-cache"]
    paths:
      - "src/swirengine/render_submission18.py"
      - "tests/test_render_submission_1_8.py"
      - "tests/test_render_submission_hardening_1_8.py"
      - "tools/benchmark_render_submission_1_8.py"
      - "examples/demo_render_submission_1_8.py"
      - "docs/MATERIAL_SUBMISSION_PIPELINE_CACHE_1_8.md"
      - "ROADMAP_1_8.md"
      - "CHANGELOG.d/1.8-material-pipeline-cache.md"
      - ".github/workflows/material-pipeline-cache-1-8.yml"
  pull_request:
    paths:
      - "src/swirengine/render_submission18.py"
      - "tests/test_render_submission_1_8.py"
      - "tests/test_render_submission_hardening_1_8.py"
      - "tools/benchmark_render_submission_1_8.py"
      - "examples/demo_render_submission_1_8.py"
      - "docs/MATERIAL_SUBMISSION_PIPELINE_CACHE_1_8.md"
      - "ROADMAP_1_8.md"
      - "CHANGELOG.d/1.8-material-pipeline-cache.md"
      - ".github/workflows/material-pipeline-cache-1-8.yml"
  workflow_dispatch:

concurrency:
  group: material-pipeline-cache-1-8-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  material-pipeline:
    name: Material pipeline / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install CPython 3.14 native build prerequisites
        if: matrix.python-version == '3.14'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run material submission and renderer regressions
        run: >-
          pytest
          tests/test_render_submission_1_8.py
          tests/test_render_submission_hardening_1_8.py
          tests/test_render_uploads_1_8.py
          tests/test_render_resources_1_8.py
          tests/test_render_graph_1_8.py
          tests/test_accelerated_renderer2_1_4.py

      - name: Lint material pipeline surfaces
        run: >-
          ruff check
          src/swirengine/render_submission18.py
          tests/test_render_submission_1_8.py
          tests/test_render_submission_hardening_1_8.py
          tools/benchmark_render_submission_1_8.py
          examples/demo_render_submission_1_8.py

      - name: Compile material pipeline surfaces
        run: >-
          python -m compileall -q
          src/swirengine/render_submission18.py
          tests/test_render_submission_1_8.py
          tests/test_render_submission_hardening_1_8.py
          tools/benchmark_render_submission_1_8.py
          examples/demo_render_submission_1_8.py

      - name: Run deterministic material submission workload
        if: matrix.python-version == '3.13'
        run: python tools/benchmark_render_submission_1_8.py

      - name: Run creator demo
        run: python examples/demo_render_submission_1_8.py
