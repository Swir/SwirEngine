name: Development Session 1.9

on:
  push:
    branches: ["feat/1.9-development-session"]
    paths:
      - "src/swirengine/project19.py"
      - "src/swirengine/development19.py"
      - "src/swirengine/cli.py"
      - "tests/test_development_session_1_9.py"
      - "tests/test_project_manifest_1_9.py"
      - "tests/test_cli.py"
      - "tools/benchmark_development_session_1_9.py"
      - "docs/DEVELOPMENT_SESSION_1_9.md"
      - "ROADMAP_1_9.md"
      - "CHANGELOG.d/1.9-development-session.md"
      - ".github/workflows/development-session-1-9.yml"
  pull_request:
    paths:
      - "src/swirengine/project19.py"
      - "src/swirengine/development19.py"
      - "src/swirengine/cli.py"
      - "tests/test_development_session_1_9.py"
      - "tests/test_project_manifest_1_9.py"
      - "tests/test_cli.py"
      - "tools/benchmark_development_session_1_9.py"
      - "docs/DEVELOPMENT_SESSION_1_9.md"
      - "ROADMAP_1_9.md"
      - "CHANGELOG.d/1.9-development-session.md"
      - ".github/workflows/development-session-1-9.yml"
  workflow_dispatch:

concurrency:
  group: development-session-1-9-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  development-session:
    name: Development Session / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install CPython 3.14 native build prerequisites
        if: matrix.python-version == '3.14'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run development-session and project regressions
        run: >-
          pytest
          tests/test_development_session_1_9.py
          tests/test_project_manifest_1_9.py
          tests/test_cli.py
          tests/test_exporting.py

      - name: Lint development-session surfaces
        run: >-
          ruff check
          src/swirengine/project19.py
          src/swirengine/development19.py
          src/swirengine/cli.py
          tests/test_development_session_1_9.py
          tools/benchmark_development_session_1_9.py

      - name: Compile development-session surfaces
        run: >-
          python -m compileall -q
          src/swirengine/project19.py
          src/swirengine/development19.py
          src/swirengine/cli.py
          tests/test_development_session_1_9.py
          tools/benchmark_development_session_1_9.py

      - name: Run deterministic development-session workload
        if: matrix.python-version == '3.13'
        run: python tools/benchmark_development_session_1_9.py
