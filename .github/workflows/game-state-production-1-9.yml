name: Game State Production 1.9

on:
  push:
    branches:
      - main
      - "feat/1.9-game-state-production"
    paths:
      - "src/swirengine/game_state19.py"
      - "src/swirengine/storage.py"
      - "src/swirengine/storage15.py"
      - "src/swirengine/background_save17.py"
      - "src/swirengine/shipping19.py"
      - "tests/test_game_state_production_1_9.py"
      - "examples/demo_game_state_production_1_9.py"
      - "tools/benchmark_game_state_production_1_9.py"
      - "docs/GAME_STATE_PRODUCTION_1_9.md"
      - "ROADMAP_1_9.md"
      - "assets/readme/progress-card.svg"
      - "assets/readme/progress-mini.svg"
      - "tools/generate_progress_svg.py"
      - ".github/workflows/game-state-production-1-9.yml"
  pull_request:
    paths:
      - "src/swirengine/game_state19.py"
      - "src/swirengine/storage.py"
      - "src/swirengine/storage15.py"
      - "src/swirengine/background_save17.py"
      - "src/swirengine/shipping19.py"
      - "tests/test_game_state_production_1_9.py"
      - "examples/demo_game_state_production_1_9.py"
      - "tools/benchmark_game_state_production_1_9.py"
      - "docs/GAME_STATE_PRODUCTION_1_9.md"
      - "ROADMAP_1_9.md"
      - "assets/readme/progress-card.svg"
      - "assets/readme/progress-mini.svg"
      - "tools/generate_progress_svg.py"
      - ".github/workflows/game-state-production-1-9.yml"

permissions:
  contents: read

jobs:
  game-state-production:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install CPython 3.14 native build prerequisites
        if: matrix.python-version == '3.14'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Focused production game-state tests
        run: pytest -q tests/test_game_state_production_1_9.py

      - name: Stable save/profile regressions
        run: |
          pytest -q tests/test_storage.py tests/test_save_profile_2_1_5.py \
            tests/test_background_save_1_7.py

      - name: Creator production save flow
        run: python examples/demo_game_state_production_1_9.py

      - name: Bounded save workload
        if: matrix.python-version == '3.13'
        run: python tools/benchmark_game_state_production_1_9.py

      - name: Ruff
        if: matrix.python-version == '3.13'
        run: |
          ruff check src/swirengine/game_state19.py \
            tests/test_game_state_production_1_9.py \
            examples/demo_game_state_production_1_9.py \
            tools/benchmark_game_state_production_1_9.py

      - name: Compile
        run: |
          python -m compileall -q src/swirengine/game_state19.py \
            tests/test_game_state_production_1_9.py \
            examples/demo_game_state_production_1_9.py \
            tools/benchmark_game_state_production_1_9.py
