name: Render Graph 1.8

on:
  push:
    branches: ["feat/1.8-render-graph"]
    paths:
      - "src/swirengine/render_graph18.py"
      - "tests/test_render_graph_1_8.py"
      - "tools/benchmark_render_graph_1_8.py"
      - "examples/demo_render_graph_1_8.py"
      - "docs/RENDER_GRAPH_1_8.md"
      - "ROADMAP_1_8.md"
      - "CHANGELOG.d/1.8-render-graph.md"
      - ".github/workflows/render-graph-1-8.yml"
  pull_request:
    paths:
      - "src/swirengine/render_graph18.py"
      - "tests/test_render_graph_1_8.py"
      - "tools/benchmark_render_graph_1_8.py"
      - "examples/demo_render_graph_1_8.py"
      - "docs/RENDER_GRAPH_1_8.md"
      - "ROADMAP_1_8.md"
      - "CHANGELOG.d/1.8-render-graph.md"
      - ".github/workflows/render-graph-1-8.yml"
  workflow_dispatch:

concurrency:
  group: render-graph-1-8-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  render-graph:
    name: Render Graph / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install CPython 3.14 native build prerequisites
        if: matrix.python-version == '3.14'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run render-graph and stable renderer regressions
        run: >-
          pytest
          tests/test_render_graph_1_8.py
          tests/test_accelerated_renderer2_1_4.py

      - name: Lint render-graph surfaces
        run: >-
          ruff check
          src/swirengine/render_graph18.py
          tests/test_render_graph_1_8.py
          tools/benchmark_render_graph_1_8.py
          examples/demo_render_graph_1_8.py

      - name: Compile render-graph surfaces
        run: >-
          python -m compileall -q
          src/swirengine/render_graph18.py
          tests/test_render_graph_1_8.py
          tools/benchmark_render_graph_1_8.py
          examples/demo_render_graph_1_8.py

      - name: Run deterministic render-graph workload
        if: matrix.python-version == '3.13'
        run: python tools/benchmark_render_graph_1_8.py

      - name: Run creator demo
        run: python examples/demo_render_graph_1_8.py
