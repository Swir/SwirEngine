name: Final Release Gate 2.0

on:
  push:
    branches: [main]
    paths:
      - "ROADMAP_2_0.md"
      - "README.md"
      - "CHANGELOG.md"
      - "RELEASE_NOTES_2_0.md"
      - "pyproject.toml"
      - "src/swirengine/**"
      - "examples/**"
      - "demo_projects/**"
      - "tools/verify_2_0_release_candidate.py"
      - "tools/verify_2_0_public_api.py"
      - "tools/verify_platform_matrix_2_0.py"
      - "tools/verify_clean_wheel_2_0.py"
      - "tools/verify_real_game_shipping_2_0.py"
      - "tools/verify_packaging_shipping_2_0.py"
      - "tools/verify_performance_evidence_2_0.py"
      - "tools/verify_release_safety_2_0.py"
      - "tests/test_release_gate_2_0.py"
      - "docs/RELEASE_GATE_2_0.md"
      - ".github/workflows/final-release-gate-2.0.yml"
      - ".github/workflows/release-2.0.yml"
      - ".github/workflows/tag-2-0.yml"
  pull_request:
    paths:
      - "ROADMAP_2_0.md"
      - "README.md"
      - "CHANGELOG.md"
      - "RELEASE_NOTES_2_0.md"
      - "pyproject.toml"
      - "src/swirengine/**"
      - "examples/**"
      - "demo_projects/**"
      - "tools/verify_2_0_release_candidate.py"
      - "tools/verify_2_0_public_api.py"
      - "tools/verify_platform_matrix_2_0.py"
      - "tools/verify_clean_wheel_2_0.py"
      - "tools/verify_real_game_shipping_2_0.py"
      - "tools/verify_packaging_shipping_2_0.py"
      - "tools/verify_performance_evidence_2_0.py"
      - "tools/verify_release_safety_2_0.py"
      - "tests/test_release_gate_2_0.py"
      - "docs/RELEASE_GATE_2_0.md"
      - ".github/workflows/final-release-gate-2.0.yml"
      - ".github/workflows/release-2.0.yml"
      - ".github/workflows/tag-2-0.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: final-release-gate-2.0-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  contract-and-regressions:
    name: Final contract + repository regressions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install release verification tooling
        run: python -m pip install --upgrade pip build twine ".[dev]"
      - name: Verify 2.0 preflight/final contract
        shell: bash
        run: |
          if grep -q -- '- [x] **10. SwirEngine 2.0 Final Release Gate & Public Verification**' ROADMAP_2_0.md; then
            python tools/verify_2_0_release_candidate.py --require-final
          else
            python tools/verify_2_0_release_candidate.py
          fi
      - name: Verify public API and migration floor
        run: python tools/verify_2_0_public_api.py
      - name: Verify representative real-game shipping
        run: python tools/verify_real_game_shipping_2_0.py
      - name: Verify performance evidence contracts
        run: python tools/verify_performance_evidence_2_0.py --validate-only
      - name: Verify export/build integrity and release safety
        run: python tools/verify_release_safety_2_0.py
      - name: Run full repository tests
        run: python -m pytest -q
      - name: Strict Ruff gate
        run: python -m ruff check src tests examples demo_projects tools
      - name: Compile Python surfaces
        run: python -m compileall -q src tests examples demo_projects tools
      - name: Build exact-source wheel and sdist
        run: python -m build --wheel --sdist --outdir dist
      - name: Validate distribution metadata
        run: python -m twine check dist/*
      - name: Verify exact-source packaging and isolated installs
        run: >-
          python tools/verify_packaging_shipping_2_0.py
          --dist-dir dist
          --expected-system Linux
          --expected-python 3.13

  support-matrix:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Linux CPython 3.14 native build prerequisites
        if: runner.os == 'Linux' && matrix.python-version == '3.14'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libgl-dev libegl-dev
      - name: Install build tooling
        run: python -m pip install --upgrade pip setuptools wheel build
      - name: Build Windows CPython 3.14 renderer-native dependencies
        if: runner.os == 'Windows' && matrix.python-version == '3.14'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force native-wheels | Out-Null
          python -m pip wheel --no-deps --no-binary=:all: moderngl==5.12.0 -w native-wheels
          python -m pip wheel --no-deps --no-binary=:all: glcontext==3.0.0 -w native-wheels
          $native = Get-ChildItem native-wheels\*.whl | ForEach-Object { $_.FullName }
          python -m pip install $native
      - name: Install source development package
        run: python -m pip install -e ".[dev]"
      - name: Run compatibility-focused tests
        run: >-
          python -m pytest -q
          tests/test_release_contract.py
          tests/test_public_api_2_0.py
          tests/test_platform_matrix_2_0.py
          tests/test_release_gate_2_0.py
      - name: Probe installed source runtime
        run: >-
          python tools/verify_platform_matrix_2_0.py
          --expected-system "${{ runner.os }}"
          --expected-python "${{ matrix.python-version }}"
      - name: Build standard wheel
        if: runner.os != 'Windows' || matrix.python-version != '3.14'
        run: python -m build --wheel --outdir dist
      - name: Build Windows CPython 3.14 vendored wheel
        if: runner.os == 'Windows' && matrix.python-version == '3.14'
        shell: pwsh
        run: |
          python -m build --wheel --outdir dist-base
          $base = (Get-ChildItem dist-base\swirengine-*.whl).FullName
          $moderngl = (Get-ChildItem native-wheels\moderngl-*.whl).FullName
          $glcontext = (Get-ChildItem native-wheels\glcontext-*.whl).FullName
          python tools/build_vendored_wheel.py --base $base --vendor $moderngl --vendor $glcontext --tag cp314-cp314-win_amd64 --output-dir dist
      - name: Verify clean wheel install and runtime
        if: runner.os != 'Windows' || matrix.python-version != '3.14'
        run: >-
          python tools/verify_clean_wheel_2_0.py
          --wheel-dir dist
          --expected-system "${{ runner.os }}"
          --expected-python "${{ matrix.python-version }}"
      - name: Verify clean Windows CPython 3.14 vendored wheel
        if: runner.os == 'Windows' && matrix.python-version == '3.14'
        run: >-
          python tools/verify_clean_wheel_2_0.py
          --wheel-dir dist
          --expected-system Windows
          --expected-python 3.14
          --require-vendored-native

  native-shipping:
    name: Native shipping / ${{ matrix.os }} / Python 3.13
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install packaging tools
        run: python -m pip install --upgrade pip build twine ".[dev]"
      - name: Build exact-source distributions
        run: python -m build --wheel --sdist --outdir dist
      - name: Validate exact-source distributions and isolated installs
        run: >-
          python tools/verify_packaging_shipping_2_0.py
          --dist-dir dist
          --expected-system "${{ runner.os }}"
          --expected-python 3.13
      - name: Build and execute host-native packaged game
        run: python tools/verify_clean_desktop_shipping_1_9.py --wheelhouse dist

  real-opengl-smoke:
    name: Real Linux OpenGL 2D/3D smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install source and software OpenGL runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libgl-dev libegl-dev
      - name: Boot 2D integration fixture through real renderer
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          MESA_GL_VERSION_OVERRIDE: "3.3"
          SWIR_GAME_DEMO_SMOKE_FRAMES: "24"
        run: xvfb-run -a python examples/2d_game_demo/run_game.py
      - name: Boot 3D integration fixture through real renderer
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          MESA_GL_VERSION_OVERRIDE: "3.3"
          SWIR_GAME_DEMO_SMOKE_FRAMES: "24"
        run: xvfb-run -a python examples/3d_game_demo/run_game.py
