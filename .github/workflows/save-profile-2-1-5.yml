name: Save Profile 2 1.5 Validation

on:
  push:
    branches:
      - feat/1.5-save-profile-2
  pull_request:
    paths:
      - "src/swirengine/storage15.py"
      - "tests/test_save_profile_2_1_5.py"
      - "tools/benchmark_save_profile_2_1_5.py"
      - "examples/demo_save_profile_2_1_5.py"
      - "docs/SAVE_PROFILE_2_1_5.md"
      - "ROADMAP_1_5.md"
      - ".github/workflows/save-profile-2-1-5.yml"

jobs:
  save-profile-contract:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - name: Install CPython 3.14 native build prerequisites
        if: matrix.python-version == '3.14'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev
      - run: python -m pip install -e ".[dev]"
      - name: Save Profile 2 tests
        run: pytest tests/test_save_profile_2_1_5.py
      - name: Strict Ruff gate
        run: >-
          ruff check
          src/swirengine/storage15.py
          tests/test_save_profile_2_1_5.py
          tools/benchmark_save_profile_2_1_5.py
          examples/demo_save_profile_2_1_5.py
      - name: Compile Save Profile 2 files
        run: >-
          python -m compileall -q
          src/swirengine/storage15.py
          tests/test_save_profile_2_1_5.py
          tools/benchmark_save_profile_2_1_5.py
          examples/demo_save_profile_2_1_5.py
      - name: Save Profile 2 filesystem workload
        if: matrix.python-version == '3.13'
        run: python tools/benchmark_save_profile_2_1_5.py
      - name: Save Profile 2 demo
        run: python examples/demo_save_profile_2_1_5.py
