name: Content Build 1.9

on:
  push:
    branches:
      - main
      - "feat/1.9-content-build-graph"
    paths:
      - "src/swirengine/content_build19.py"
      - "src/swirengine/exporting.py"
      - "src/swirengine/asset_pipeline.py"
      - "src/swirengine/asset_streaming.py"
      - "tests/test_content_build_1_9.py"
      - "tests/test_content_build_export_1_9.py"
      - "tests/test_exporting.py"
      - "examples/demo_content_build_1_9.py"
      - "tools/benchmark_content_build_1_9.py"
      - "docs/CONTENT_BUILD_1_9.md"
      - "ROADMAP_1_9.md"
      - "assets/readme/progress-card.svg"
      - "assets/readme/progress-mini.svg"
      - "tools/generate_progress_svg.py"
      - ".github/workflows/content-build-1-9.yml"
  pull_request:
    paths:
      - "src/swirengine/content_build19.py"
      - "src/swirengine/exporting.py"
      - "src/swirengine/asset_pipeline.py"
      - "src/swirengine/asset_streaming.py"
      - "tests/test_content_build_1_9.py"
      - "tests/test_content_build_export_1_9.py"
      - "tests/test_exporting.py"
      - "examples/demo_content_build_1_9.py"
      - "tools/benchmark_content_build_1_9.py"
      - "docs/CONTENT_BUILD_1_9.md"
      - "ROADMAP_1_9.md"
      - "assets/readme/progress-card.svg"
      - "assets/readme/progress-mini.svg"
      - "tools/generate_progress_svg.py"
      - ".github/workflows/content-build-1-9.yml"

permissions:
  contents: read

jobs:
  content-build:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install CPython 3.14 native build prerequisites
        if: matrix.python-version == '3.14'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Focused content build tests
        run: >-
          pytest -q
          tests/test_content_build_1_9.py
          tests/test_content_build_export_1_9.py
          tests/test_exporting.py

      - name: Creator content build flow
        run: python examples/demo_content_build_1_9.py

      - name: Bounded dependency-planning workload
        if: matrix.python-version == '3.13'
        run: python tools/benchmark_content_build_1_9.py --nodes 256 --iterations 2500 --max-seconds 8

      - name: Ruff
        if: matrix.python-version == '3.13'
        run: |
          ruff check src/swirengine/content_build19.py \
            src/swirengine/exporting.py \
            tests/test_content_build_1_9.py \
            tests/test_content_build_export_1_9.py \
            examples/demo_content_build_1_9.py \
            tools/benchmark_content_build_1_9.py

      - name: Compile
        run: |
          python -m compileall -q src/swirengine/content_build19.py \
            src/swirengine/exporting.py \
            tests/test_content_build_1_9.py \
            tests/test_content_build_export_1_9.py \
            examples/demo_content_build_1_9.py \
            tools/benchmark_content_build_1_9.py
