name: Background Jobs 1.7

on:
  push:
    branches: ["feat/1.7-background-jobs"]
    paths:
      - "src/swirengine/jobs17.py"
      - "tests/test_background_jobs_1_7.py"
      - "tests/test_background_jobs_1_7_validation.py"
      - "tools/benchmark_background_jobs_1_7.py"
      - "examples/demo_background_jobs_1_7.py"
      - "docs/BACKGROUND_JOBS_1_7.md"
      - "ROADMAP_1_7.md"
      - "CHANGELOG.d/1.7-background-jobs.md"
      - ".github/workflows/background-jobs-1-7.yml"
  pull_request:
    paths:
      - "src/swirengine/jobs17.py"
      - "tests/test_background_jobs_1_7.py"
      - "tests/test_background_jobs_1_7_validation.py"
      - "tools/benchmark_background_jobs_1_7.py"
      - "examples/demo_background_jobs_1_7.py"
      - "docs/BACKGROUND_JOBS_1_7.md"
      - "ROADMAP_1_7.md"
      - "CHANGELOG.d/1.7-background-jobs.md"
      - ".github/workflows/background-jobs-1-7.yml"
  workflow_dispatch:

concurrency:
  group: background-jobs-1-7-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  background-jobs:
    name: Background Jobs / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install CPython 3.14 native build prerequisites
        if: matrix.python-version == '3.14'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run focused background-job contracts
        run: pytest tests/test_background_jobs_1_7.py tests/test_background_jobs_1_7_validation.py

      - name: Lint background-job surfaces
        run: >-
          ruff check
          src/swirengine/jobs17.py
          tests/test_background_jobs_1_7.py
          tests/test_background_jobs_1_7_validation.py
          tools/benchmark_background_jobs_1_7.py
          examples/demo_background_jobs_1_7.py

      - name: Compile creator-facing background-job surfaces
        run: >-
          python -m compileall -q
          src/swirengine/jobs17.py
          tests/test_background_jobs_1_7.py
          tests/test_background_jobs_1_7_validation.py
          tools/benchmark_background_jobs_1_7.py
          examples/demo_background_jobs_1_7.py

      - name: Run scheduler workload benchmark
        if: matrix.python-version == '3.13'
        run: python tools/benchmark_background_jobs_1_7.py

      - name: Run creator demo
        run: python examples/demo_background_jobs_1_7.py
