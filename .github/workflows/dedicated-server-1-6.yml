name: Dedicated Server 1.6

on:
  pull_request:
    paths:
      - "src/swirengine/server16.py"
      - "tests/test_dedicated_server_1_6.py"
      - "tests/test_networking.py"
      - "tests/test_multiplayer_2_1_4.py"
      - "tests/test_multiplayer_replication_1_6.py"
      - "tests/test_prediction_reconciliation_1_6.py"
      - "tests/test_session_lifecycle_1_6.py"
      - "tests/test_transport_qos_1_6.py"
      - "tools/benchmark_dedicated_server_1_6.py"
      - "tools/smoke_dedicated_server_1_6.py"
      - "examples/demo_dedicated_server_1_6.py"
      - "docs/DEDICATED_SERVER_RUNTIME_1_6.md"
      - "ROADMAP_1_6.md"
      - ".github/workflows/dedicated-server-1-6.yml"
  workflow_dispatch:

concurrency:
  group: dedicated-server-1-6-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dedicated-server:
    name: Dedicated server / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install CPython 3.14 native build prerequisites
        if: matrix.python-version == '3.14'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run dedicated-server and locked multiplayer contracts
        run: >-
          pytest
          tests/test_dedicated_server_1_6.py
          tests/test_networking.py
          tests/test_multiplayer_2_1_4.py
          tests/test_multiplayer_replication_1_6.py
          tests/test_prediction_reconciliation_1_6.py
          tests/test_session_lifecycle_1_6.py
          tests/test_transport_qos_1_6.py

      - name: Lint dedicated-server surface
        run: >-
          ruff check
          src/swirengine/server16.py
          tests/test_dedicated_server_1_6.py
          tools/benchmark_dedicated_server_1_6.py
          tools/smoke_dedicated_server_1_6.py
          examples/demo_dedicated_server_1_6.py

      - name: Compile creator-facing server surfaces
        run: >-
          python -m compileall -q
          src/swirengine/server16.py
          tests/test_dedicated_server_1_6.py
          tools/benchmark_dedicated_server_1_6.py
          tools/smoke_dedicated_server_1_6.py
          examples/demo_dedicated_server_1_6.py

      - name: Run deterministic dedicated-server workload
        if: matrix.python-version == '3.13'
        run: python tools/benchmark_dedicated_server_1_6.py

      - name: Run dedicated-server creator demo
        run: python examples/demo_dedicated_server_1_6.py

  linux-wheel-smoke:
    name: Linux clean-wheel headless smoke
    runs-on: ubuntu-latest
    needs: dedicated-server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip wheel . --no-deps --wheel-dir dist

      - name: Install wheel in clean virtual environment
        run: |
          python -m venv /tmp/swirengine-server-smoke
          /tmp/swirengine-server-smoke/bin/python -m pip install --upgrade pip
          /tmp/swirengine-server-smoke/bin/python -m pip install dist/swirengine-*.whl

      - name: Run installed-wheel smoke without display variables
        run: >-
          env -u DISPLAY -u WAYLAND_DISPLAY
          /tmp/swirengine-server-smoke/bin/python
          tools/smoke_dedicated_server_1_6.py
