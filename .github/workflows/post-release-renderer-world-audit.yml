name: Post-Release Renderer World Audit

on:
  push:
    branches:
      - main
    paths:
      - "src/swirengine/render_resources18.py"
      - "src/swirengine/shader_cache17.py"
      - "src/swirengine/terrain.py"
      - "src/swirengine/large_world.py"
      - "src/swirengine/scene_visibility.py"
      - "src/swirengine/visibility18.py"
      - "src/swirengine/world_streaming15.py"
      - "src/swirengine/world_streaming_easy15.py"
      - "tests/test_post_release_renderer_world_2_0.py"
      - "tests/test_render_resources_1_8.py"
      - "tests/test_render_resources_hardening_1_8.py"
      - "tests/test_shader_cache_1_7.py"
      - "tests/test_terrain_world_lod.py"
      - "tests/test_large_world.py"
      - "tests/test_large_world_provider_cache.py"
      - "tests/test_visibility_lod_1_8.py"
      - "tests/test_visibility_lod_hardening_1_8.py"
      - "tests/test_world_streaming_2_1_5.py"
      - "tools/audit_renderer_world_2_0.py"
      - "docs/SWIRENGINE_2_0_RENDERER_WORLD_AUDIT.md"
      - ".github/workflows/post-release-renderer-world-audit.yml"
  pull_request:
    paths:
      - "src/swirengine/render_resources18.py"
      - "src/swirengine/shader_cache17.py"
      - "src/swirengine/terrain.py"
      - "src/swirengine/large_world.py"
      - "src/swirengine/scene_visibility.py"
      - "src/swirengine/visibility18.py"
      - "src/swirengine/world_streaming15.py"
      - "src/swirengine/world_streaming_easy15.py"
      - "tests/test_post_release_renderer_world_2_0.py"
      - "tests/test_render_resources_1_8.py"
      - "tests/test_render_resources_hardening_1_8.py"
      - "tests/test_shader_cache_1_7.py"
      - "tests/test_terrain_world_lod.py"
      - "tests/test_large_world.py"
      - "tests/test_large_world_provider_cache.py"
      - "tests/test_visibility_lod_1_8.py"
      - "tests/test_visibility_lod_hardening_1_8.py"
      - "tests/test_world_streaming_2_1_5.py"
      - "tools/audit_renderer_world_2_0.py"
      - "docs/SWIRENGINE_2_0_RENDERER_WORLD_AUDIT.md"
      - ".github/workflows/post-release-renderer-world-audit.yml"
  workflow_dispatch:

concurrency:
  group: post-release-renderer-world-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  evidence:
    name: Domain 6 evidence / Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - name: Install CPython 3.14 native build prerequisites
        if: matrix.python-version == '3.14'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev
      - run: python -m pip install -e ".[dev]"
      - name: Run integrated renderer/assets/world evidence suite
        run: |
          pytest \
            tests/test_post_release_renderer_world_2_0.py \
            tests/test_render_resources_1_8.py \
            tests/test_render_resources_hardening_1_8.py \
            tests/test_shader_cache_1_7.py \
            tests/test_terrain_world_lod.py \
            tests/test_large_world.py \
            tests/test_large_world_provider_cache.py \
            tests/test_visibility_lod_1_8.py \
            tests/test_visibility_lod_hardening_1_8.py \
            tests/test_world_streaming_2_1_5.py
      - name: Run deterministic production workload
        run: python tools/audit_renderer_world_2_0.py
      - name: Strict audit-surface lint
        if: matrix.python-version == '3.13'
        run: ruff check tools/audit_renderer_world_2_0.py tests/test_post_release_renderer_world_2_0.py
      - name: Compile audit surfaces
        if: matrix.python-version == '3.13'
        run: python -m compileall -q tools/audit_renderer_world_2_0.py tests/test_post_release_renderer_world_2_0.py
