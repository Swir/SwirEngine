name: SwirEngine 2.2 Release Readiness

on:
  pull_request:
    branches: [main]
    paths:
      - "README.md"
      - "ROADMAP_2_2.md"
      - "pyproject.toml"
      - "docs/MIGRATING_TO_2_2.md"
      - "docs/RELEASE_GATE_2_2.md"
      - ".github/release-gates/2.2-required-workflows.json"
      - ".github/workflows/publication-gate-2.2.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/release-readiness-2.2.yml"
      - "tools/verify_2_2_release_readiness.py"
      - "tools/verify_required_workflows_2_2.py"
      - "tools/verify_distribution_audit_data_2_2.py"
      - "tools/verify_clean_wheel_2_0.py"
      - "tools/verify_publication_chain_2_2.py"
      - "tools/verify_candidate_merge_2_2.py"
      - "tools/verify_sdist_identity_2_2.py"
      - "tools/release_evidence_2_2.py"
      - "tools/reconcile_release_2_2.py"
      - "tools/build_vendored_wheel.py"
      - "tests/test_release_readiness_2_2.py"
      - "tests/test_required_workflows_2_2.py"
      - "tests/test_distribution_audit_data_2_2.py"
      - "tests/test_clean_wheel_2_0.py"
      - "tests/test_publication_chain_2_2.py"
      - "tests/test_candidate_merge_2_2.py"
      - "tests/test_sdist_identity_2_2.py"
      - "tests/test_release_evidence_2_2.py"
      - "tests/test_reconcile_release_2_2.py"
      - "tests/test_release_workflow_2_2.py"
      - "src/**"
      - "examples/**"
      - "demo_projects/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  preflight-contract:
    name: Exact-source Phase A contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SOURCE_SHA }}
          persist-credentials: false
      - name: Verify exact checkout identity
        shell: pwsh
        run: |
          $actual = git rev-parse HEAD
          if ($actual -ne $env:EXPECTED_SOURCE_SHA) {
            throw "checkout mismatch: expected $env:EXPECTED_SOURCE_SHA, got $actual"
          }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install preflight tooling
        run: >-
          python -m pip install --upgrade pip
          "pytest>=8,<10"
          "ruff>=0.16,<0.17"
          "build>=1.2,<2"
      - name: Verify named required-workflow manifest
        run: python tools/verify_required_workflows_2_2.py
      - name: Verify 2.2 Phase A readiness
        run: python tools/verify_2_2_release_readiness.py
      - name: Verify distribution audit-data policy
        run: python tools/verify_distribution_audit_data_2_2.py
      - name: Verify deterministic active progress
        run: python tools/generate_progress_svg.py --check
      - name: Run focused Phase A regressions
        run: >-
          python -m pytest -q
          tests/test_release_readiness_2_2.py
          tests/test_required_workflows_2_2.py
          tests/test_distribution_audit_data_2_2.py
          tests/test_clean_wheel_2_0.py
          tests/test_publication_chain_2_2.py
          tests/test_candidate_merge_2_2.py
          tests/test_sdist_identity_2_2.py
          tests/test_release_evidence_2_2.py
          tests/test_reconcile_release_2_2.py
          tests/test_release_workflow_2_2.py
      - name: Lint Phase A verifier and tests
        run: >-
          python -m ruff check
          tools/verify_2_2_release_readiness.py
          tools/verify_required_workflows_2_2.py
          tools/verify_distribution_audit_data_2_2.py
          tools/verify_clean_wheel_2_0.py
          tools/verify_publication_chain_2_2.py
          tools/verify_candidate_merge_2_2.py
          tools/verify_sdist_identity_2_2.py
          tools/release_evidence_2_2.py
          tools/reconcile_release_2_2.py
          tests/test_release_readiness_2_2.py
          tests/test_required_workflows_2_2.py
          tests/test_distribution_audit_data_2_2.py
          tests/test_clean_wheel_2_0.py
          tests/test_publication_chain_2_2.py
          tests/test_candidate_merge_2_2.py
          tests/test_sdist_identity_2_2.py
          tests/test_release_evidence_2_2.py
          tests/test_reconcile_release_2_2.py
          tests/test_release_workflow_2_2.py
      - name: Compile Phase A verifier and tests
        run: >-
          python -m compileall -q
          tools/verify_2_2_release_readiness.py
          tools/verify_required_workflows_2_2.py
          tools/verify_distribution_audit_data_2_2.py
          tools/verify_clean_wheel_2_0.py
          tools/verify_publication_chain_2_2.py
          tools/verify_candidate_merge_2_2.py
          tools/verify_sdist_identity_2_2.py
          tools/release_evidence_2_2.py
          tools/reconcile_release_2_2.py
          tests/test_release_readiness_2_2.py
          tests/test_required_workflows_2_2.py
          tests/test_distribution_audit_data_2_2.py
          tests/test_clean_wheel_2_0.py
          tests/test_publication_chain_2_2.py
          tests/test_candidate_merge_2_2.py
          tests/test_sdist_identity_2_2.py
          tests/test_release_evidence_2_2.py
          tests/test_reconcile_release_2_2.py
          tests/test_release_workflow_2_2.py
      - name: Build exact-source wheel and sdist
        run: python -m build
      - name: Inspect exact-source distributions
        run: python tools/verify_distribution_audit_data_2_2.py --dist-dir dist
      - name: Preserve non-publishing Phase A artifacts
        uses: actions/upload-artifact@v4
        with:
          name: swirengine-2.2-phase-a-source-${{ github.run_id }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  clean-install-matrix:
    name: Stable wheel ${{ matrix.os }} / CPython ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SOURCE_SHA }}
          persist-credentials: false
      - name: Verify exact checkout identity
        shell: pwsh
        run: |
          $actual = git rev-parse HEAD
          if ($actual -ne $env:EXPECTED_SOURCE_SHA) {
            throw "checkout mismatch: expected $env:EXPECTED_SOURCE_SHA, got $actual"
          }
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Linux CPython 3.14 native build prerequisites
        if: runner.os == 'Linux' && matrix.python-version == '3.14'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libgl-dev libegl-dev
      - name: Install exact-source build tooling
        run: python -m pip install --upgrade pip setuptools wheel "build>=1.2,<2"
      - name: Build Windows CPython 3.14 renderer-native dependencies
        if: runner.os == 'Windows' && matrix.python-version == '3.14'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force native-wheels | Out-Null
          python -m pip wheel --no-deps --no-binary=:all: moderngl==5.12.0 -w native-wheels
          python -m pip wheel --no-deps --no-binary=:all: glcontext==3.0.0 -w native-wheels
          $native = Get-ChildItem native-wheels\*.whl | ForEach-Object { $_.FullName }
          python -m pip install $native
      - name: Build standard exact-source wheel
        if: runner.os != 'Windows' || matrix.python-version != '3.14'
        run: python -m build --wheel --outdir dist
      - name: Build Windows CPython 3.14 vendored exact-source wheel
        if: runner.os == 'Windows' && matrix.python-version == '3.14'
        shell: pwsh
        run: |
          python -m build --wheel --outdir dist-base
          $base = (Get-ChildItem dist-base\swirengine-*.whl).FullName
          $moderngl = (Get-ChildItem native-wheels\moderngl-*.whl).FullName
          $glcontext = (Get-ChildItem native-wheels\glcontext-*.whl).FullName
          python tools/build_vendored_wheel.py --base $base --vendor $moderngl --vendor $glcontext --tag cp314-cp314-win_amd64 --output-dir dist
      - name: Verify stable exact wheel in a clean environment
        if: runner.os != 'Windows' || matrix.python-version != '3.14'
        run: >-
          python tools/verify_clean_wheel_2_0.py
          --wheel-dir dist
          --expected-system "${{ runner.os }}"
          --expected-python "${{ matrix.python-version }}"
          --expected-version 2.1.0
          --verify-cli21
      - name: Verify Windows CPython 3.14 vendored wheel in a clean environment
        if: runner.os == 'Windows' && matrix.python-version == '3.14'
        run: >-
          python tools/verify_clean_wheel_2_0.py
          --wheel-dir dist
          --expected-system Windows
          --expected-python 3.14
          --expected-version 2.1.0
          --require-vendored-native
          --verify-cli21
