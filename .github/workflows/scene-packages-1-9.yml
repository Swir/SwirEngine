name: Scene Packages 1.9

on:
  push:
    branches:
      - main
      - "feat/1.9-scene-level-packages"
    paths:
      - "src/swirengine/scene_packages19.py"
      - "tests/test_scene_packages_1_9.py"
      - "tests/test_serialization.py"
      - "tests/test_project_manifest_1_9.py"
      - "examples/demo_scene_packages_1_9.py"
      - "tools/benchmark_scene_packages_1_9.py"
      - "docs/SCENE_PACKAGES_1_9.md"
      - "ROADMAP_1_9.md"
      - "assets/readme/progress-card.svg"
      - "assets/readme/progress-mini.svg"
      - "tools/generate_progress_svg.py"
      - ".github/workflows/scene-packages-1-9.yml"
  pull_request:
    paths:
      - "src/swirengine/scene_packages19.py"
      - "tests/test_scene_packages_1_9.py"
      - "tests/test_serialization.py"
      - "tests/test_project_manifest_1_9.py"
      - "examples/demo_scene_packages_1_9.py"
      - "tools/benchmark_scene_packages_1_9.py"
      - "docs/SCENE_PACKAGES_1_9.md"
      - "ROADMAP_1_9.md"
      - "assets/readme/progress-card.svg"
      - "assets/readme/progress-mini.svg"
      - "tools/generate_progress_svg.py"
      - ".github/workflows/scene-packages-1-9.yml"

permissions:
  contents: read

jobs:
  scene-packages:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install CPython 3.14 native build prerequisites
        if: matrix.python-version == '3.14'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Focused scene package tests
        run: pytest -q tests/test_scene_packages_1_9.py

      - name: Stable scene and project regressions
        run: pytest -q tests/test_serialization.py tests/test_project_manifest_1_9.py

      - name: Creator scene package flow
        run: python examples/demo_scene_packages_1_9.py

      - name: Bounded package-planning workload
        if: matrix.python-version == '3.13'
        run: python tools/benchmark_scene_packages_1_9.py

      - name: Ruff
        if: matrix.python-version == '3.13'
        run: |
          ruff check src/swirengine/scene_packages19.py \
            tests/test_scene_packages_1_9.py \
            examples/demo_scene_packages_1_9.py \
            tools/benchmark_scene_packages_1_9.py

      - name: Compile
        run: |
          python -m compileall -q src/swirengine/scene_packages19.py \
            tests/test_scene_packages_1_9.py \
            examples/demo_scene_packages_1_9.py \
            tools/benchmark_scene_packages_1_9.py
