name: Post-release 1.2 Verification

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/post-release-1.2-verify.yml"
  workflow_dispatch:

jobs:
  public-pypi:
    name: Public PyPI (${{ matrix.os }} / Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify public PyPI metadata and install published 1.2.0 only
        shell: python
        run: |
          import json
          import subprocess
          import sys
          import urllib.request

          version = "1.2.0"
          with urllib.request.urlopen(f"https://pypi.org/pypi/swirengine/{version}/json", timeout=30) as response:
              metadata = json.load(response)
          assert metadata["info"]["version"] == version
          requires = {part.strip() for part in metadata["info"]["requires_python"].split(",")}
          assert requires == {">=3.10", "<3.15"}, metadata["info"]["requires_python"]
          subprocess.check_call([sys.executable, "-m", "pip", "install", "--upgrade", "pip"])
          subprocess.check_call([
              sys.executable,
              "-m",
              "pip",
              "install",
              "--no-cache-dir",
              "--index-url",
              "https://pypi.org/simple",
              f"swirengine=={version}",
          ])
      - name: Verify published import, version and core API
        shell: python
        run: |
          import swirengine
          assert swirengine.__version__ == "1.2.0"
          for name in ("Game", "Scene", "ECSWorld", "Prefab", "AssetManager", "GameplaySession", "ProjectExporter"):
              assert hasattr(swirengine, name), name
          print(swirengine.__version__, swirengine.__file__)
      - name: Install Linux software OpenGL runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libgl-dev libegl-dev
      - name: Smoke Neon Cube Hunt 3D against public PyPI
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          SWIR_DEMO_SMOKE_FRAMES: "12"
        run: xvfb-run -a python demo_projects/neon_cube_hunt_3d/run_game.py
      - name: Probe Neon Snake 3D against public PyPI on Windows 3.14
        if: runner.os == 'Windows'
        env:
          SWIR_DEMO_RUNTIME_PROBE: "1"
        run: python demo_projects/neon_snake_3d/run_game.py
