name: Create SwirEngine 1.4 Release Tag

on:
  push:
    branches:
      - "release/1.4.0-publish"

jobs:
  verify-tag:
    name: Verify immutable v1.4.0 tag for publication recovery
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: "v1.4.0"
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Enforce complete 1.4 release contract at the immutable tag
        run: python tools/verify_1_4_release_candidate.py --require-complete
      - name: Prove v1.4.0 still points at the final main release commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v1.4.0" --jq '.object.sha')"
          if [ "$tag_sha" != "$main_sha" ]; then
            echo "Immutable release tag no longer matches the final main release commit: main=$main_sha tag=$tag_sha"
            exit 1
          fi
          echo "Verified immutable v1.4.0 tag at $tag_sha."
