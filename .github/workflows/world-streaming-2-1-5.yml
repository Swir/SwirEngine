name: World Streaming 2 1.5 Validation

on:
  pull_request:
    paths:
      - "src/swirengine/world_streaming15.py"
      - "src/swirengine/world_streaming_easy15.py"
      - "tests/test_world_streaming_2_1_5.py"
      - "tools/benchmark_world_streaming_2_1_5.py"
      - "examples/demo_world_streaming_2_1_5.py"
      - "docs/WORLD_STREAMING_2_1_5.md"
      - "ROADMAP_1_5.md"
      - ".github/workflows/world-streaming-2-1-5.yml"
  push:
    branches:
      - "feat/1.5-world-streaming-creator-api"
    paths:
      - "src/swirengine/world_streaming15.py"
      - "src/swirengine/world_streaming_easy15.py"
      - "tests/test_world_streaming_2_1_5.py"
      - "tools/benchmark_world_streaming_2_1_5.py"
      - "examples/demo_world_streaming_2_1_5.py"
      - "docs/WORLD_STREAMING_2_1_5.md"
      - "ROADMAP_1_5.md"
      - ".github/workflows/world-streaming-2-1-5.yml"

permissions:
  contents: read

jobs:
  validate:
    name: World Streaming 2 / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install CPython 3.14 native build prerequisites
        if: matrix.python-version == '3.14'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run World Streaming 2.0 contract tests
        run: pytest tests/test_world_streaming_2_1_5.py

      - name: Lint World Streaming 2.0 surface
        run: >-
          ruff check
          src/swirengine/world_streaming15.py
          src/swirengine/world_streaming_easy15.py
          tests/test_world_streaming_2_1_5.py
          tools/benchmark_world_streaming_2_1_5.py
          examples/demo_world_streaming_2_1_5.py

      - name: Compile World Streaming 2.0 surface
        run: >-
          python -m compileall -q
          src/swirengine/world_streaming15.py
          src/swirengine/world_streaming_easy15.py
          tests/test_world_streaming_2_1_5.py
          tools/benchmark_world_streaming_2_1_5.py
          examples/demo_world_streaming_2_1_5.py

      - name: Enforce World Streaming 2.0 workload budget
        if: matrix.python-version == '3.13'
        run: python tools/benchmark_world_streaming_2_1_5.py

      - name: Run World Streaming 2.0 creator demo
        run: python examples/demo_world_streaming_2_1_5.py
