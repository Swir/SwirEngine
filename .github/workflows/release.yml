# SwirEngine 2.1.0 guarded publication workflow.
# Reuses the historical release.yml identity required by the configured PyPI Trusted Publisher.
name: Release

on:
  push:
    branches:
      - "release/2.1.0-publication"
    paths:
      - ".release/publish-2.1.0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swirengine-2.1.0-publication
  cancel-in-progress: false

env:
  RELEASE_VERSION: 2.1.0
  RELEASE_TAG: v2.1.0
  EXPECTED_PR_WORKFLOWS: "30"

jobs:
  publication-state:
    name: Verify immutable target and public state
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tag_exists: ${{ steps.state.outputs.tag_exists }}
      release_exists: ${{ steps.state.outputs.release_exists }}
      pypi_exists: ${{ steps.state.outputs.pypi_exists }}
    steps:
      - name: Inspect tag, GitHub Release and PyPI state
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          remote_tag="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${RELEASE_TAG}" | awk '{print $1}')"
          if [ -n "$remote_tag" ] && [ "$remote_tag" != "$GITHUB_SHA" ]; then
            echo "Immutable ${RELEASE_TAG} already points to $remote_tag instead of $GITHUB_SHA"
            exit 1
          fi
          if [ -n "$remote_tag" ]; then tag_exists=1; else tag_exists=0; fi

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            release_exists=1
          else
            release_exists=0
          fi

          pypi_status="$(curl --silent --show-error --location --retry 3 --retry-all-errors             --output /tmp/swirengine-pypi.json --write-out '%{http_code}'             "https://pypi.org/pypi/swirengine/${RELEASE_VERSION}/json" || true)"
          case "$pypi_status" in
            200) pypi_exists=1 ;;
            404) pypi_exists=0 ;;
            *)
              echo "Could not establish public PyPI state (HTTP ${pypi_status:-transport-error})."
              exit 1
              ;;
          esac

          echo "tag_exists=$tag_exists" >> "$GITHUB_OUTPUT"
          echo "release_exists=$release_exists" >> "$GITHUB_OUTPUT"
          echo "pypi_exists=$pypi_exists" >> "$GITHUB_OUTPUT"

  wait-pr-matrix:
    name: Require exact-head pull-request matrix
    needs: publication-state
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - name: Wait for the exact publication head to be fully green
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&event=pull_request&per_page=100")"
            count="$(jq '.workflow_runs | length' <<<"$json")"
            incomplete="$(jq '[.workflow_runs[] | select(.status != "completed")] | length' <<<"$json")"
            bad="$(jq '[.workflow_runs[] | select(.status == "completed" and (.conclusion != "success" and .conclusion != "skipped" and .conclusion != "neutral"))] | length' <<<"$json")"
            echo "PR workflows: count=$count incomplete=$incomplete bad=$bad"
            if [ "$bad" -ne 0 ]; then
              jq -r '.workflow_runs[] | select(.status == "completed" and (.conclusion != "success" and .conclusion != "skipped" and .conclusion != "neutral")) | "(.name): (.conclusion) (.html_url)"' <<<"$json"
              exit 1
            fi
            if [ "$count" -ge "$EXPECTED_PR_WORKFLOWS" ] && [ "$incomplete" -eq 0 ]; then
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for the exact-head PR matrix."
          exit 1

  build-release:
    name: Build and verify exact SwirEngine 2.1.0 source
    needs: [publication-state, wait-pr-matrix]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install release validation dependencies
        run: python -m pip install --upgrade pip build twine ".[dev]"
      - name: Enforce publication contract
        run: python tools/verify_2_1_publication.py
      - name: Re-check accepted 2.1 source readiness
        run: python tools/verify_2_1_release_readiness.py
      - name: Run full release tests
        run: python -m pytest -q
      - name: Lint release tree
        run: python -m ruff check src tests examples demo_projects tools
      - name: Compile release tree
        run: python -m compileall -q src tests examples demo_projects tools
      - name: Build exact-source wheel and sdist
        run: python -m build --wheel --sdist --outdir dist
      - name: Validate distribution metadata
        run: python -m twine check dist/*
      - name: Verify portable artifact names
        shell: python
        run: |
          from pathlib import Path
          wheels = list(Path("dist").glob("swirengine-2.1.0-*.whl"))
          sdists = list(Path("dist").glob("swirengine-2.1.0.tar.gz"))
          assert len(wheels) == 1, wheels
          assert len(sdists) == 1, sdists
      - uses: actions/upload-artifact@v4
        with:
          name: swirengine-2.1.0-publication-portable
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  clean-install-matrix:
    name: Clean install ${{ matrix.os }} / CPython ${{ matrix.python-version }}
    needs: [publication-state, wait-pr-matrix]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Linux CPython 3.14 native build prerequisites
        if: runner.os == 'Linux' && matrix.python-version == '3.14'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libgl-dev libegl-dev
      - name: Install candidate build tooling
        run: python -m pip install --upgrade pip setuptools wheel "build>=1.2,<2"
      - name: Build Windows CPython 3.14 renderer-native dependencies
        if: runner.os == 'Windows' && matrix.python-version == '3.14'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force native-wheels | Out-Null
          python -m pip wheel --no-deps --no-binary=:all: moderngl==5.12.0 -w native-wheels
          python -m pip wheel --no-deps --no-binary=:all: glcontext==3.0.0 -w native-wheels
          $native = Get-ChildItem native-wheels\*.whl | ForEach-Object { $_.FullName }
          python -m pip install $native
      - name: Build standard release wheel
        if: runner.os != 'Windows' || matrix.python-version != '3.14'
        run: python -m build --wheel --outdir dist
      - name: Build Windows CPython 3.14 vendored release wheel
        if: runner.os == 'Windows' && matrix.python-version == '3.14'
        shell: pwsh
        run: |
          python -m build --wheel --outdir dist-base
          $base = (Get-ChildItem dist-base\swirengine-2.1.0-*.whl).FullName
          $moderngl = (Get-ChildItem native-wheels\moderngl-*.whl).FullName
          $glcontext = (Get-ChildItem native-wheels\glcontext-*.whl).FullName
          python tools/build_vendored_wheel.py --base $base --vendor $moderngl --vendor $glcontext --tag cp314-cp314-win_amd64 --output-dir dist
      - name: Verify exact wheel in clean environment and CLI
        if: runner.os != 'Windows' || matrix.python-version != '3.14'
        run: >-
          python tools/verify_clean_wheel_2_0.py
          --wheel-dir dist
          --expected-system "${{ runner.os }}"
          --expected-python "${{ matrix.python-version }}"
          --verify-cli21
      - name: Verify Windows CPython 3.14 vendored release wheel and CLI
        if: runner.os == 'Windows' && matrix.python-version == '3.14'
        run: >-
          python tools/verify_clean_wheel_2_0.py
          --wheel-dir dist
          --expected-system Windows
          --expected-python 3.14
          --require-vendored-native
          --verify-cli21
      - name: Preserve Windows CPython 3.14 release wheel
        if: runner.os == 'Windows' && matrix.python-version == '3.14'
        uses: actions/upload-artifact@v4
        with:
          name: swirengine-2.1.0-publication-win-cp314
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7

  release-evidence:
    name: Generate checksums and exact-source provenance
    needs: [build-release, clean-install-matrix]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          name: swirengine-2.1.0-publication-portable
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: swirengine-2.1.0-publication-win-cp314
          path: dist
      - name: Generate deterministic release evidence
        run: >-
          python tools/release_evidence_2_1.py generate
          --dist-dir dist
          --source-sha "${GITHUB_SHA}"
          --require-windows-cp314
      - name: Verify exact-source release evidence
        run: >-
          python tools/release_evidence_2_1.py verify
          --dist-dir dist
          --source-sha "${GITHUB_SHA}"
          --require-windows-cp314
      - uses: actions/upload-artifact@v4
        with:
          name: swirengine-2.1.0-publication-assets
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  ensure-tag:
    name: Create immutable v2.1.0 tag
    needs: [publication-state, release-evidence]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Create tag only when absent
        shell: bash
        run: |
          set -euo pipefail
          remote_tag="$(git ls-remote origin "refs/tags/${RELEASE_TAG}" | awk '{print $1}')"
          if [ -n "$remote_tag" ]; then
            test "$remote_tag" = "$GITHUB_SHA"
            echo "${RELEASE_TAG} already exists at the accepted source."
            exit 0
          fi
          git tag "$RELEASE_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$RELEASE_TAG"

  pypi-publish:
    name: Publish SwirEngine 2.1.0 to PyPI
    needs: [publication-state, release-evidence, ensure-tag]
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: swirengine-2.1.0-publication-assets
          path: release-assets
      - name: Prepare only package distributions for PyPI
        if: needs.publication-state.outputs.pypi_exists != '1'
        shell: bash
        run: |
          mkdir -p dist
          cp release-assets/*.whl dist/
          cp release-assets/*.tar.gz dist/
      - name: Publish package distributions through registered Trusted Publisher
        if: needs.publication-state.outputs.pypi_exists != '1'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
      - name: Preserve an already-published public package
        if: needs.publication-state.outputs.pypi_exists == '1'
        run: echo "PyPI already contains SwirEngine 2.1.0; refusing to upload duplicates."

  github-release:
    name: Create GitHub Release 2.1.0
    needs: [publication-state, release-evidence, ensure-tag, pypi-publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: swirengine-2.1.0-publication-assets
          path: release-assets
      - name: Create verified GitHub Release when absent
        if: needs.publication-state.outputs.release_exists != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$RELEASE_TAG" release-assets/*
          --verify-tag
          --title "SwirEngine 2.1.0"
          --notes-file RELEASE_NOTES_2_1.md
          --repo "$GITHUB_REPOSITORY"
      - name: Preserve an already-created GitHub Release
        if: needs.publication-state.outputs.release_exists == '1'
        run: echo "GitHub Release v2.1.0 already exists; refusing to replace it."

  post-release-public-pypi:
    name: Public PyPI verify / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    needs: [pypi-publish, github-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.14"
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "refs/tags/v2.1.0"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Wait for public PyPI and install only SwirEngine 2.1.0
        shell: python
        run: |
          import json
          import os
          import subprocess
          import sys
          import tempfile
          import time
          import urllib.error
          import urllib.request

          url = "https://pypi.org/pypi/swirengine/2.1.0/json"
          metadata = None
          for attempt in range(30):
              try:
                  with urllib.request.urlopen(url, timeout=20) as response:
                      metadata = json.load(response)
                  break
              except (urllib.error.URLError, urllib.error.HTTPError):
                  if attempt == 29:
                      raise
                  time.sleep(10)
          assert metadata is not None
          assert metadata["info"]["version"] == "2.1.0"
          assert metadata["info"]["requires_python"] == ">=3.10,<3.15"
          subprocess.check_call([sys.executable, "-m", "pip", "install", "--upgrade", "pip"])
          subprocess.check_call([
              sys.executable, "-m", "pip", "install", "--no-cache-dir",
              "--index-url", "https://pypi.org/simple", "swirengine==2.1.0",
          ])
          with tempfile.TemporaryDirectory(prefix="swir-public-2.1-") as temp:
              env = dict(os.environ)
              env.pop("PYTHONPATH", None)
              subprocess.check_call(
                  [sys.executable, "-c",
                   "import swirengine; assert swirengine.__version__ == '2.1.0'; "
                   "assert all(hasattr(swirengine, n) for n in ('Game','Scene','Color','Vec3')); "
                   "print(swirengine.__version__, swirengine.__file__)"],
                  cwd=temp, env=env,
              )

  final-public-state:
    name: Verify public tag, release and package
    needs: [post-release-public-pypi]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Verify immutable tag, GitHub Release and PyPI
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          remote_tag="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${RELEASE_TAG}" | awk '{print $1}')"
          test "$remote_tag" = "$GITHUB_SHA"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          curl --fail --silent --show-error "https://pypi.org/pypi/swirengine/${RELEASE_VERSION}/json" >/dev/null
          echo "SwirEngine ${RELEASE_VERSION} public release verified."
