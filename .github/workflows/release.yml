# PyPI and GitHub release workflow for SwirEngine 1.4.0.
# Publication is tag-only and hard-gated by the complete 10/10 1.4 contract.
name: Release

on:
  push:
    tags:
      - "v1.4.0"

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip build twine
      - name: Install release validation dependencies
        run: python -m pip install -e ".[dev]"
      - name: Enforce complete 1.4 release contract
        run: python tools/verify_1_4_release_candidate.py --require-complete
      - name: Run full release tests
        run: pytest
      - name: Lint release tree
        run: ruff check src tests examples demo_projects tools
      - name: Compile release tree
        run: python -m compileall -q src examples demo_projects tools
      - name: Re-run 1.4 deterministic performance contracts
        run: |
          python tools/benchmark_terrain_world_lod.py
          python tools/benchmark_physics2_1_4.py
          python tools/benchmark_character_controllers_1_4.py
          python tools/benchmark_renderer2_1_4.py --frames 5000
          python tools/benchmark_gpu_particles_1_4.py
          python tools/benchmark_asset_pipeline_1_4.py
          python tools/benchmark_scene_visibility_1_4.py
          python tools/benchmark_editor_authoring_1_4.py
          python tools/benchmark_multiplayer_2_1_4.py
          python tools/benchmark_showcase_1_4.py --rounds 3 --budget-ms 2500
      - name: Run integrated headless release showcase
        env:
          SWIR_1_4_HEADLESS_PROBE: "1"
        run: python demo_projects/neon_frontier_1_4/run_game.py
      - name: Build portable distributions
        run: python -m build
      - name: Validate distribution metadata
        run: python -m twine check dist/*
      - name: Verify tag and package/runtime versions agree
        shell: python
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          import os
          import tomllib
          from pathlib import Path
          import swirengine

          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          expected = f"v{version}"
          actual = os.environ["RELEASE_TAG"]
          if version != "1.4.0" or swirengine.__version__ != version or actual != expected:
              raise SystemExit(
                  f"release identity mismatch: tag={actual!r}, project={version!r}, runtime={swirengine.__version__!r}"
              )
      - uses: actions/upload-artifact@v4
        with:
          name: swirengine-dist
          path: dist/*
          if-no-files-found: error

  runtime-opengl-smoke:
    name: Final real OpenGL 1.4 showcase
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Install software OpenGL/Xvfb runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libgl-dev libegl-dev
      - name: Boot Neon Frontier 1.4 through the real renderer
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          MESA_GL_VERSION_OVERRIDE: "3.3"
          SWIR_1_4_SMOKE_FRAMES: "16"
        run: xvfb-run -a python demo_projects/neon_frontier_1_4/run_game.py
      - name: Boot locked 1.3 regression game
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          SWIR_1_3_SMOKE_FRAMES: "12"
        run: xvfb-run -a python demo_projects/neon_frontier_1_3/run_game.py
      - name: Boot Neon Snake 3D regression game
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          SWIR_DEMO_SMOKE_FRAMES: "12"
        run: xvfb-run -a python demo_projects/neon_snake_3d/run_game.py

  packaged-demo-windows:
    name: Final packaged Windows 1.4 showcase probe
    needs: build-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pyinstaller
      - name: Build Neon Frontier 1.4 one-file executable
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile
          --collect-all glfw --collect-all glcontext
          --name NeonFrontier14 demo_projects/neon_frontier_1_4/run_game.py
      - name: Probe Neon Frontier 1.4 packaged runtime
        shell: pwsh
        env:
          SWIR_DEMO_RUNTIME_PROBE: "1"
        run: |
          & .\dist\NeonFrontier14.exe
          if ($LASTEXITCODE -ne 0) { throw "Neon Frontier 1.4 probe failed: $LASTEXITCODE" }

  build-windows-cp314:
    needs: build-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install native build tooling
        run: python -m pip install --upgrade pip setuptools wheel twine
      - name: Download base SwirEngine distributions
        uses: actions/download-artifact@v4
        with:
          name: swirengine-dist
          path: dist-base
      - name: Build native renderer dependencies
        run: |
          python -m pip wheel --no-deps --no-binary=:all: moderngl==5.12.0 -w native-wheels
          python -m pip wheel --no-deps --no-binary=:all: glcontext==3.0.0 -w native-wheels
      - name: Build CPython 3.14 Windows platform wheel
        shell: pwsh
        run: |
          $base = (Get-ChildItem dist-base\swirengine-1.4.0-py3-none-any.whl).FullName
          $moderngl = (Get-ChildItem native-wheels\moderngl-*.whl).FullName
          $glcontext = (Get-ChildItem native-wheels\glcontext-*.whl).FullName
          python tools/build_vendored_wheel.py --base $base --vendor $moderngl --vendor $glcontext --tag cp314-cp314-win_amd64 --output-dir dist-cp314
      - name: Check CPython 3.14 platform wheel
        run: python -m twine check dist-cp314/*.whl
      - name: Install CPython 3.14 wheel in a clean environment
        shell: pwsh
        run: |
          python -m venv .verify314
          .\.verify314\Scripts\python.exe -m pip install --upgrade pip
          .\.verify314\Scripts\python.exe -m pip install --find-links dist-cp314 "swirengine==1.4.0"
          .\.verify314\Scripts\python.exe -c "import sys, swirengine, moderngl, glcontext; assert sys.version_info[:2] == (3, 14); assert swirengine.__version__ == '1.4.0'; assert '_vendor_native' in moderngl.__file__; assert '_vendor_native' in glcontext.__file__; print(sys.version); print(moderngl.__file__); print(glcontext.__file__)"
      - uses: actions/upload-artifact@v4
        with:
          name: swirengine-dist-cp314
          path: dist-cp314/*.whl
          if-no-files-found: error

  pypi-publish:
    name: Publish SwirEngine 1.4.0 to PyPI
    needs: [build-release, runtime-opengl-smoke, packaged-demo-windows, build-windows-cp314]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download portable distributions
        uses: actions/download-artifact@v4
        with:
          name: swirengine-dist
          path: dist
      - name: Download CPython 3.14 Windows distribution
        uses: actions/download-artifact@v4
        with:
          name: swirengine-dist-cp314
          path: dist
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  github-release:
    name: Create GitHub Release 1.4.0
    needs: [build-release, runtime-opengl-smoke, packaged-demo-windows, build-windows-cp314, pypi-publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Download portable distributions
        uses: actions/download-artifact@v4
        with:
          name: swirengine-dist
          path: dist
      - name: Download CPython 3.14 Windows distribution
        uses: actions/download-artifact@v4
        with:
          name: swirengine-dist-cp314
          path: dist
      - name: Refuse to replace an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v1.4.0" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release v1.4.0 already exists; refusing to replace it."
            exit 1
          fi
      - name: Create verified GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "v1.4.0" dist/*
          --verify-tag
          --title "SwirEngine 1.4.0"
          --notes-file RELEASE_NOTES_1_4.md
          --repo "${{ github.repository }}"

  post-release-public-pypi:
    name: Verify public package (${{ matrix.os }} / Python ${{ matrix.python-version }})
    needs: [pypi-publish, github-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.14"
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Wait for public PyPI and install only SwirEngine 1.4.0
        shell: python
        run: |
          import json
          import subprocess
          import sys
          import time
          import urllib.error
          import urllib.request

          url = "https://pypi.org/pypi/swirengine/1.4.0/json"
          metadata = None
          for attempt in range(18):
              try:
                  with urllib.request.urlopen(url, timeout=20) as response:
                      metadata = json.load(response)
                  break
              except (urllib.error.URLError, urllib.error.HTTPError):
                  if attempt == 17:
                      raise
                  time.sleep(10)
          assert metadata is not None
          assert metadata["info"]["version"] == "1.4.0"
          requires_python = {part.strip() for part in metadata["info"]["requires_python"].split(",")}
          assert requires_python == {">=3.10", "<3.15"}, metadata["info"]["requires_python"]
          subprocess.check_call([sys.executable, "-m", "pip", "install", "--upgrade", "pip"])
          subprocess.check_call([
              sys.executable,
              "-m",
              "pip",
              "install",
              "--no-cache-dir",
              "--index-url",
              "https://pypi.org/simple",
              "swirengine==1.4.0",
          ])
      - name: Verify public 1.4 runtime and namespaces
        shell: python
        run: |
          import swirengine
          import swirengine.editor14
          import swirengine.multiplayer14
          import swirengine.physics2

          assert swirengine.__version__ == "1.4.0"
          for name in ("Game", "Scene", "Renderer2", "GPUParticleEmitter3D", "SceneAccelerationRuntime3D"):
              assert hasattr(swirengine, name), name
          print(swirengine.__version__, swirengine.__file__)
      - name: Install Linux software OpenGL runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libgl-dev libegl-dev
      - name: Smoke Neon Frontier 1.4 against public PyPI
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          MESA_GL_VERSION_OVERRIDE: "3.3"
          SWIR_1_4_SMOKE_FRAMES: "12"
        run: xvfb-run -a python demo_projects/neon_frontier_1_4/run_game.py
      - name: Probe Neon Frontier 1.4 against public PyPI on Windows 3.14
        if: runner.os == 'Windows'
        env:
          SWIR_DEMO_RUNTIME_PROBE: "1"
        run: python demo_projects/neon_frontier_1_4/run_game.py
