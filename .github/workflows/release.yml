# PyPI and GitHub release workflow for SwirEngine.
# Publication is hard-gated by ROADMAP_1_4.md and the final 1.4 verifier.
name: Release

on:
  push:
    branches:
      - "main"
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish-pypi]'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip build twine
      - name: Install release validation dependencies
        run: python -m pip install -e ".[dev]"
      - name: Enforce complete SwirEngine 1.4 release contract
        run: python tools/verify_1_4_release_candidate.py --require-complete
      - name: Run complete regression suite
        run: pytest
      - name: Lint release tree
        run: ruff check src tests examples demo_projects tools
      - name: Compile release tree
        run: python -m compileall -q src examples demo_projects tools
      - name: Re-run stable 1.x performance compatibility gates
        run: |
          python tools/benchmark_static_3d_batch.py --cubes 1000 --rounds 9 --frames 30 --assert-win
          python tools/benchmark_asset_preload.py --assets 16 --delay-ms 10 --workers 4 --assert-win
          python tools/benchmark_gpu_instancing.py
          python tools/benchmark_collision3d.py
          python tools/benchmark_navigation.py
          python tools/benchmark_large_world.py
          python tools/benchmark_shader_pipeline.py
          python tools/benchmark_renderer2d_power.py
          python tools/benchmark_gameplay_framework.py
          python tools/benchmark_editor_systems_1_3.py
      - name: Re-run deterministic 1.4 production performance contracts
        run: |
          python tools/benchmark_terrain_world_lod.py --chunks 32 --chunk-cells 16 --radius 2 --frames 120
          python tools/benchmark_physics2_1_4.py --static-bodies 2000 --frames 120
          python tools/benchmark_character_controllers_1_4.py --frames 600
          python tools/benchmark_renderer2_1_4.py --frames 5000
          python tools/benchmark_gpu_particles_1_4.py
          python tools/benchmark_asset_pipeline_1_4.py --assets 128 --workers 4
          python tools/benchmark_scene_visibility_1_4.py --side 128 --queries 150 --max-leaf-tests 256
          python tools/benchmark_editor_authoring_1_4.py
          python tools/benchmark_multiplayer_2_1_4.py
      - name: Run headless integrated 1.4 production showcase
        run: python demo_projects/showcase_1_4/run_game.py
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: python
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          expected = f"v{version}"
          actual = os.environ["RELEASE_TAG"]
          if actual != expected:
              raise SystemExit(f"release tag {actual!r} does not match package version {expected!r}")
      - uses: actions/upload-artifact@v4
        with:
          name: swirengine-dist
          path: dist/*
          if-no-files-found: error

  runtime-opengl-smoke:
    name: Final real OpenGL 1.4 and compatibility smokes
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Install software OpenGL/Xvfb runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libgl-dev libegl-dev mesa-utils
      - name: Boot integrated SwirEngine 1.4 production showcase
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          MESA_GL_VERSION_OVERRIDE: "3.3"
          SWIR_1_4_SHOWCASE_RENDER: "1"
          SWIR_1_4_SHOWCASE_FRAMES: "12"
        run: xvfb-run -a python demo_projects/showcase_1_4/run_game.py
      - name: Renderer 2.0 final OpenGL smoke
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          MESA_GL_VERSION_OVERRIDE: "3.3"
        run: python tools/smoke_renderer2_gl.py
      - name: GPU VFX final OpenGL smoke
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          MESA_GL_VERSION_OVERRIDE: "3.3"
        run: python tools/smoke_gpu_particles_gl.py
      - name: Scene acceleration Hi-Z final OpenGL smoke
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          MESA_GL_VERSION_OVERRIDE: "3.3"
        run: python tools/smoke_scene_acceleration_gl.py
      - name: Boot integrated Neon Frontier 1.3 compatibility game
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          SWIR_1_3_SMOKE_FRAMES: "12"
        run: xvfb-run -a python demo_projects/neon_frontier_1_3/run_game.py
      - name: Boot Neon Cube Hunt 3D regression game
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          SWIR_DEMO_SMOKE_FRAMES: "12"
        run: xvfb-run -a python demo_projects/neon_cube_hunt_3d/run_game.py
      - name: Boot Neon Snake 3D regression game
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          SWIR_DEMO_SMOKE_FRAMES: "12"
        run: xvfb-run -a python demo_projects/neon_snake_3d/run_game.py

  packaged-demo-windows:
    name: Final packaged Windows 1.4 and compatibility probes
    needs: build-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pyinstaller
      - name: Build SwirEngine 1.4 showcase one-file executable
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile
          --collect-all glfw --collect-all glcontext
          --name SwirEngineShowcase14 demo_projects/showcase_1_4/run_game.py
      - name: Probe SwirEngine 1.4 packaged showcase
        shell: pwsh
        run: |
          & .\dist\SwirEngineShowcase14.exe
          if ($LASTEXITCODE -ne 0) { throw "SwirEngine 1.4 showcase probe failed: $LASTEXITCODE" }
      - name: Build Neon Frontier 1.3 one-file executable
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile
          --collect-all glfw --collect-all glcontext
          --name NeonFrontier13 demo_projects/neon_frontier_1_3/run_game.py
      - name: Probe Neon Frontier 1.3 packaged runtime
        shell: pwsh
        env:
          SWIR_DEMO_RUNTIME_PROBE: "1"
        run: |
          & .\dist\NeonFrontier13.exe
          if ($LASTEXITCODE -ne 0) { throw "Neon Frontier 1.3 probe failed: $LASTEXITCODE" }
      - name: Build Neon Cube Hunt 3D one-file executable
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile
          --collect-all glfw --collect-all glcontext
          --name NeonCubeHunt3D demo_projects/neon_cube_hunt_3d/run_game.py
      - name: Probe Neon Cube Hunt 3D packaged runtime
        shell: pwsh
        env:
          SWIR_DEMO_RUNTIME_PROBE: "1"
        run: |
          & .\dist\NeonCubeHunt3D.exe
          if ($LASTEXITCODE -ne 0) { throw "Neon Cube Hunt 3D probe failed: $LASTEXITCODE" }
      - name: Build Neon Snake 3D one-file executable
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile
          --collect-all glfw --collect-all glcontext
          --name NeonSnake3D demo_projects/neon_snake_3d/run_game.py
      - name: Probe Neon Snake 3D packaged runtime
        shell: pwsh
        env:
          SWIR_DEMO_RUNTIME_PROBE: "1"
        run: |
          & .\dist\NeonSnake3D.exe
          if ($LASTEXITCODE -ne 0) { throw "Neon Snake 3D probe failed: $LASTEXITCODE" }

  build-windows-cp314:
    needs: build-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install native build tooling
        run: python -m pip install --upgrade pip setuptools wheel twine
      - name: Download base SwirEngine distributions
        uses: actions/download-artifact@v4
        with:
          name: swirengine-dist
          path: dist-base
      - name: Build native renderer dependencies
        run: |
          python -m pip wheel --no-deps --no-binary=:all: moderngl==5.12.0 -w native-wheels
          python -m pip wheel --no-deps --no-binary=:all: glcontext==3.0.0 -w native-wheels
      - name: Build CPython 3.14 Windows platform wheel
        shell: pwsh
        run: |
          $base = (Get-ChildItem dist-base\swirengine-*-py3-none-any.whl).FullName
          $moderngl = (Get-ChildItem native-wheels\moderngl-*.whl).FullName
          $glcontext = (Get-ChildItem native-wheels\glcontext-*.whl).FullName
          python tools/build_vendored_wheel.py --base $base --vendor $moderngl --vendor $glcontext --tag cp314-cp314-win_amd64 --output-dir dist-cp314
      - name: Check CPython 3.14 platform wheel
        run: python -m twine check dist-cp314/*.whl
      - name: Install CPython 3.14 wheel in a clean environment
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          python -m venv .verify314
          .\.verify314\Scripts\python.exe -m pip install --upgrade pip
          .\.verify314\Scripts\python.exe -m pip install --find-links dist-cp314 "swirengine==$version"
          .\.verify314\Scripts\python.exe -c "import sys, swirengine, moderngl, glcontext; assert sys.version_info[:2] == (3, 14); assert swirengine.__version__ == '$version'; assert '_vendor_native' in moderngl.__file__; assert '_vendor_native' in glcontext.__file__; print(sys.version); print(moderngl.__file__); print(glcontext.__file__)"
      - uses: actions/upload-artifact@v4
        with:
          name: swirengine-dist-cp314
          path: dist-cp314/*.whl
          if-no-files-found: error

  pypi-publish:
    name: Publish SwirEngine to PyPI
    needs: [build-release, runtime-opengl-smoke, packaged-demo-windows, build-windows-cp314]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download portable distributions
        uses: actions/download-artifact@v4
        with:
          name: swirengine-dist
          path: dist
      - name: Download CPython 3.14 Windows distribution
        uses: actions/download-artifact@v4
        with:
          name: swirengine-dist-cp314
          path: dist
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  github-release:
    name: Create GitHub release
    needs: [build-release, runtime-opengl-smoke, packaged-demo-windows, build-windows-cp314, pypi-publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Download portable distributions
        uses: actions/download-artifact@v4
        with:
          name: swirengine-dist
          path: dist
      - name: Download CPython 3.14 Windows distribution
        uses: actions/download-artifact@v4
        with:
          name: swirengine-dist-cp314
          path: dist
      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
            echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          fi
      - name: Create release with every verified distribution
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to replace a published release."
            exit 1
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            gh release create "$RELEASE_TAG" dist/* --generate-notes --verify-tag --repo "${{ github.repository }}"
          else
            gh release create "$RELEASE_TAG" dist/* --title "SwirEngine ${RELEASE_TAG#v}" --generate-notes --target "$GITHUB_SHA" --repo "${{ github.repository }}"
          fi

  post-release-public-pypi:
    name: Verify published package (${{ matrix.os }} / Python ${{ matrix.python-version }})
    needs: [pypi-publish, github-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.14"
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Wait for public PyPI and install only the published package
        shell: python
        run: |
          import json
          import subprocess
          import sys
          import time
          import tomllib
          import urllib.error
          import urllib.request
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          url = f"https://pypi.org/pypi/swirengine/{version}/json"
          metadata = None
          for attempt in range(18):
              try:
                  with urllib.request.urlopen(url, timeout=20) as response:
                      metadata = json.load(response)
                  break
              except (urllib.error.URLError, urllib.error.HTTPError):
                  if attempt == 17:
                      raise
                  time.sleep(10)
          assert metadata is not None
          assert metadata["info"]["version"] == version
          requires_python = {part.strip() for part in metadata["info"]["requires_python"].split(",")}
          assert requires_python == {">=3.10", "<3.15"}, metadata["info"]["requires_python"]
          subprocess.check_call([sys.executable, "-m", "pip", "install", "--upgrade", "pip"])
          subprocess.check_call([
              sys.executable,
              "-m",
              "pip",
              "install",
              "--no-cache-dir",
              "--index-url",
              "https://pypi.org/simple",
              f"swirengine=={version}",
          ])
      - name: Verify published import and 1.4 public APIs
        shell: python
        run: |
          import tomllib
          from pathlib import Path
          import swirengine
          import swirengine.creator
          import swirengine.editor14
          import swirengine.gameplay
          import swirengine.large_world
          import swirengine.multiplayer14
          import swirengine.navigation

          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          assert version == "1.4.0"
          assert swirengine.__version__ == version
          for name in (
              "Game",
              "Scene",
              "HeightmapTerrain",
              "CharacterController3D",
              "GPUParticleEmitter3D",
              "SceneAcceleratedRenderer2",
          ):
              assert hasattr(swirengine, name), name
          print(swirengine.__version__, swirengine.__file__)
      - name: Run headless 1.4 showcase against public PyPI
        run: python demo_projects/showcase_1_4/run_game.py
      - name: Install Linux software OpenGL runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libgl-dev libegl-dev mesa-utils
      - name: Smoke SwirEngine 1.4 showcase against public PyPI
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          MESA_GL_VERSION_OVERRIDE: "3.3"
          SWIR_1_4_SHOWCASE_RENDER: "1"
          SWIR_1_4_SHOWCASE_FRAMES: "12"
        run: xvfb-run -a python demo_projects/showcase_1_4/run_game.py
      - name: Smoke Neon Frontier 1.3 compatibility game against public PyPI
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          SWIR_1_3_SMOKE_FRAMES: "12"
        run: xvfb-run -a python demo_projects/neon_frontier_1_3/run_game.py
      - name: Probe Neon Frontier 1.3 compatibility game on Windows 3.14
        if: runner.os == 'Windows'
        env:
          SWIR_DEMO_RUNTIME_PROBE: "1"
        run: python demo_projects/neon_frontier_1_3/run_game.py
