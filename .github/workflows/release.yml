# PyPI and GitHub release workflow for SwirEngine 1.5.0.
# Publication is hard-gated by the complete verified 10/10 1.5 contract.
# The finalize branch is a one-shot fallback because refs created with GITHUB_TOKEN do not recursively trigger workflows.
name: Release

on:
  push:
    tags:
      - "v1.5.0"
    branches:
      - "release/1.5.0-finalize"

jobs:
  build-release:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: "v1.5.0"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip build twine
      - name: Install release validation dependencies
        run: python -m pip install -e ".[dev]"
      - name: Enforce complete 1.5 release contract
        run: python tools/verify_1_5_release_candidate.py --require-complete
      - name: Re-check locked 1.3 compatibility contract
        run: python tools/verify_1_3_release_candidate.py
      - name: Re-check locked 1.4 compatibility contract
        run: python tools/verify_1_4_release_candidate.py --require-complete
      - name: Run full release tests
        run: pytest
      - name: Lint release tree
        run: ruff check src tests examples demo_projects tools
      - name: Compile release tree
        run: python -m compileall -q src examples demo_projects tools
      - name: Re-run all SwirEngine 1.5 workload contracts
        run: |
          python tools/benchmark_deterministic_replay_1_5.py
          python tools/benchmark_save_profile_2_1_5.py
          python tools/benchmark_audio_2_1_5.py
          python tools/benchmark_animation_graphs_2_1_5.py
          python tools/benchmark_navigation_2_1_5.py
          python tools/benchmark_world_streaming_2_1_5.py
          python tools/benchmark_ui_toolkit_2_1_5.py
          python tools/benchmark_editor_productivity_1_5.py
          python tools/benchmark_performance_diagnostics_2_1_5.py
      - name: Run source-only 2D release showcase headlessly
        env:
          SWIR_GAME_DEMO_HEADLESS: "1"
        run: python examples/2d_game_demo/run_game.py
      - name: Run source-only 3D release showcase headlessly
        env:
          SWIR_GAME_DEMO_HEADLESS: "1"
        run: python examples/3d_game_demo/run_game.py
      - name: Build portable distributions
        run: python -m build
      - name: Validate distribution metadata
        run: python -m twine check dist/*
      - name: Install portable wheel in a clean environment
        shell: bash
        run: |
          python -m venv .release15-venv
          .release15-venv/bin/python -m pip install --upgrade pip
          .release15-venv/bin/python -m pip install dist/*.whl
          .release15-venv/bin/python -c "import swirengine; assert swirengine.__version__ == '1.5.0'; print(swirengine.__version__, swirengine.__file__)"
          SWIR_GAME_DEMO_HEADLESS=1 .release15-venv/bin/python examples/2d_game_demo/run_game.py
          SWIR_GAME_DEMO_HEADLESS=1 .release15-venv/bin/python examples/3d_game_demo/run_game.py
      - name: Verify tag and package/runtime versions agree
        shell: python
        env:
          RELEASE_TAG: "v1.5.0"
        run: |
          import os
          import tomllib
          from pathlib import Path
          import swirengine

          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          expected = f"v{version}"
          actual = os.environ["RELEASE_TAG"]
          if version != "1.5.0" or swirengine.__version__ != version or actual != expected:
              raise SystemExit(
                  f"release identity mismatch: tag={actual!r}, project={version!r}, runtime={swirengine.__version__!r}"
              )
      - uses: actions/upload-artifact@v4
        with:
          name: swirengine-dist
          path: dist/*
          if-no-files-found: error

  runtime-opengl-smoke:
    name: Final real OpenGL 1.5 source-showcase gate
    needs: build-release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Install software OpenGL/Xvfb runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libgl-dev libegl-dev
      - name: Boot SwirEngine 2D Game Demo through the real renderer
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          MESA_GL_VERSION_OVERRIDE: "3.3"
          SWIR_GAME_DEMO_SMOKE_FRAMES: "24"
        run: xvfb-run -a python examples/2d_game_demo/run_game.py
      - name: Boot SwirEngine 3D Game Demo through the real renderer
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          MESA_GL_VERSION_OVERRIDE: "3.3"
          SWIR_GAME_DEMO_SMOKE_FRAMES: "24"
        run: xvfb-run -a python examples/3d_game_demo/run_game.py
      - name: Boot locked Neon Frontier 1.4 regression showcase
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          MESA_GL_VERSION_OVERRIDE: "3.3"
          SWIR_1_4_SMOKE_FRAMES: "12"
        run: xvfb-run -a python demo_projects/neon_frontier_1_4/run_game.py
      - name: Boot locked Neon Frontier 1.3 regression game
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          SWIR_1_3_SMOKE_FRAMES: "12"
        run: xvfb-run -a python demo_projects/neon_frontier_1_3/run_game.py

  packaged-demos-windows:
    name: Final packaged Windows 1.5 source-showcase probes
    needs: build-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pyinstaller
      - name: Build 2D source showcase one-file executable
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile
          --collect-all glfw --collect-all glcontext
          --paths examples/2d_game_demo
          --name SwirEngine2D15 examples/2d_game_demo/run_game.py
      - name: Probe packaged 2D source showcase
        shell: pwsh
        env:
          SWIR_GAME_DEMO_HEADLESS: "1"
        run: |
          & .\dist\SwirEngine2D15.exe
          if ($LASTEXITCODE -ne 0) { throw "SwirEngine 2D 1.5 packaged probe failed: $LASTEXITCODE" }
      - name: Build 3D source showcase one-file executable
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile
          --collect-all glfw --collect-all glcontext
          --paths examples/3d_game_demo
          --name SwirEngine3D15 examples/3d_game_demo/run_game.py
      - name: Probe packaged 3D source showcase
        shell: pwsh
        env:
          SWIR_GAME_DEMO_HEADLESS: "1"
        run: |
          & .\dist\SwirEngine3D15.exe
          if ($LASTEXITCODE -ne 0) { throw "SwirEngine 3D 1.5 packaged probe failed: $LASTEXITCODE" }

  build-windows-cp314:
    needs: build-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install native build tooling
        run: python -m pip install --upgrade pip setuptools wheel twine
      - name: Download base SwirEngine distributions
        uses: actions/download-artifact@v4
        with:
          name: swirengine-dist
          path: dist-base
      - name: Build native renderer dependencies
        run: |
          python -m pip wheel --no-deps --no-binary=:all: moderngl==5.12.0 -w native-wheels
          python -m pip wheel --no-deps --no-binary=:all: glcontext==3.0.0 -w native-wheels
      - name: Build CPython 3.14 Windows platform wheel
        shell: pwsh
        run: |
          $base = (Get-ChildItem dist-base\swirengine-1.5.0-py3-none-any.whl).FullName
          $moderngl = (Get-ChildItem native-wheels\moderngl-*.whl).FullName
          $glcontext = (Get-ChildItem native-wheels\glcontext-*.whl).FullName
          python tools/build_vendored_wheel.py --base $base --vendor $moderngl --vendor $glcontext --tag cp314-cp314-win_amd64 --output-dir dist-cp314
      - name: Check CPython 3.14 platform wheel
        run: python -m twine check dist-cp314/*.whl
      - name: Install CPython 3.14 wheel in a clean environment
        shell: pwsh
        run: |
          python -m venv .verify314
          .\.verify314\Scripts\python.exe -m pip install --upgrade pip
          .\.verify314\Scripts\python.exe -m pip install --find-links dist-cp314 "swirengine==1.5.0"
          .\.verify314\Scripts\python.exe -c "import sys, swirengine, moderngl, glcontext; assert sys.version_info[:2] == (3, 14); assert swirengine.__version__ == '1.5.0'; assert '_vendor_native' in moderngl.__file__; assert '_vendor_native' in glcontext.__file__; print(sys.version); print(moderngl.__file__); print(glcontext.__file__)"
          $env:SWIR_GAME_DEMO_HEADLESS = '1'
          .\.verify314\Scripts\python.exe examples/2d_game_demo/run_game.py
          .\.verify314\Scripts\python.exe examples/3d_game_demo/run_game.py
      - uses: actions/upload-artifact@v4
        with:
          name: swirengine-dist-cp314
          path: dist-cp314/*.whl
          if-no-files-found: error

  pypi-publish:
    name: Publish SwirEngine 1.5.0 to PyPI
    needs: [build-release, runtime-opengl-smoke, packaged-demos-windows, build-windows-cp314]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download portable distributions
        uses: actions/download-artifact@v4
        with:
          name: swirengine-dist
          path: dist
      - name: Download CPython 3.14 Windows distribution
        uses: actions/download-artifact@v4
        with:
          name: swirengine-dist-cp314
          path: dist
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  github-release:
    name: Create GitHub Release 1.5.0
    needs: [build-release, runtime-opengl-smoke, packaged-demos-windows, build-windows-cp314, pypi-publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Download portable distributions
        uses: actions/download-artifact@v4
        with:
          name: swirengine-dist
          path: dist
      - name: Download CPython 3.14 Windows distribution
        uses: actions/download-artifact@v4
        with:
          name: swirengine-dist-cp314
          path: dist
      - name: Refuse to replace an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v1.5.0" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release v1.5.0 already exists; refusing to replace it."
            exit 1
          fi
      - name: Create verified GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "v1.5.0" dist/*
          --verify-tag
          --title "SwirEngine 1.5.0"
          --notes-file RELEASE_NOTES_1_5.md
          --repo "${{ github.repository }}"

  post-release-public-pypi:
    name: Verify public package (${{ matrix.os }} / Python ${{ matrix.python-version }})
    needs: [pypi-publish, github-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.14"
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Wait for public PyPI and install only SwirEngine 1.5.0
        shell: python
        run: |
          import json
          import subprocess
          import sys
          import time
          import urllib.error
          import urllib.request

          url = "https://pypi.org/pypi/swirengine/1.5.0/json"
          metadata = None
          for attempt in range(18):
              try:
                  with urllib.request.urlopen(url, timeout=20) as response:
                      metadata = json.load(response)
                  break
              except (urllib.error.URLError, urllib.error.HTTPError):
                  if attempt == 17:
                      raise
                  time.sleep(10)
          assert metadata is not None
          assert metadata["info"]["version"] == "1.5.0"
          requires_python = {part.strip() for part in metadata["info"]["requires_python"].split(",")}
          assert requires_python == {">=3.10", "<3.15"}, metadata["info"]["requires_python"]
          subprocess.check_call([sys.executable, "-m", "pip", "install", "--upgrade", "pip"])
          subprocess.check_call([
              sys.executable,
              "-m",
              "pip",
              "install",
              "--no-cache-dir",
              "--index-url",
              "https://pypi.org/simple",
              "swirengine==1.5.0",
          ])
      - name: Verify public 1.5 runtime and additive namespaces
        shell: python
        run: |
          import swirengine
          import swirengine.animation15
          import swirengine.audio15
          import swirengine.editor15
          import swirengine.navigation15
          import swirengine.performance15
          import swirengine.simulation15
          import swirengine.storage15
          import swirengine.ui15
          import swirengine.world_streaming15

          assert swirengine.__version__ == "1.5.0"
          for name in ("Game", "Scene", "Renderer2", "GPUParticleEmitter3D", "SceneAccelerationRuntime3D"):
              assert hasattr(swirengine, name), name
          print(swirengine.__version__, swirengine.__file__)
      - name: Install Linux software OpenGL runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libgl-dev libegl-dev
      - name: Smoke 2D source showcase against public PyPI
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          MESA_GL_VERSION_OVERRIDE: "3.3"
          SWIR_GAME_DEMO_SMOKE_FRAMES: "12"
        run: xvfb-run -a python examples/2d_game_demo/run_game.py
      - name: Smoke 3D source showcase against public PyPI
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          MESA_GL_VERSION_OVERRIDE: "3.3"
          SWIR_GAME_DEMO_SMOKE_FRAMES: "12"
        run: xvfb-run -a python examples/3d_game_demo/run_game.py
      - name: Probe source showcases against public PyPI on Windows 3.14
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:SWIR_GAME_DEMO_HEADLESS = '1'
          python examples/2d_game_demo/run_game.py
          python examples/3d_game_demo/run_game.py
