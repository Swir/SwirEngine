# SwirEngine 2.2.1 guarded publication workflow.
# This filename is retained because the PyPI Trusted Publisher is bound to release.yml.
# The published v2.1.0 workflow is immutable in Git history and at its release tag.
name: Release

on:
  workflow_run:
    workflows:
      - "SwirEngine 2.2.1 Publication Gate"
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: swirengine-2.2.1-publication
  cancel-in-progress: false

env:
  RELEASE_VERSION: 2.2.1
  RELEASE_TAG: v2.2.1
  PUBLICATION_BRANCH: release/2.2.1-publication

jobs:
  publication-chain:
    name: Verify immutable publication chain and trigger
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      candidate_source_sha: ${{ steps.chain.outputs.candidate_source_sha }}
      candidate_marker_sha: ${{ steps.chain.outputs.candidate_marker_sha }}
      publication_sha: ${{ steps.chain.outputs.publication_sha }}
      workflow_manifest_sha256: ${{ steps.chain.outputs.workflow_manifest_sha256 }}
    steps:
      - name: Check out trusted verifier source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          path: trusted-verifier
      - name: Check out untrusted publication source for inspection
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
          path: publication-source
      - name: Require an exact successful same-repository push workflow
        env:
          EVENT_PATH: ${{ github.event_path }}
          EXPECTED_REPOSITORY: Swir/SwirEngine
          PUBLICATION_SHA: ${{ github.event.workflow_run.head_sha }}
          TRUSTED_WORKFLOW_REF: ${{ github.workflow_ref }}
          TRUSTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$GITHUB_EVENT_NAME" = "workflow_run"
          test "$TRUSTED_WORKFLOW_REF" = "$EXPECTED_REPOSITORY/.github/workflows/release.yml@refs/heads/main"
          test "$(jq -r '.repository.full_name' "$EVENT_PATH")" = "$EXPECTED_REPOSITORY"
          test "$(jq -r '.action' "$EVENT_PATH")" = "completed"
          test "$(jq -r '.workflow_run.name' "$EVENT_PATH")" = "SwirEngine 2.2.1 Publication Gate"
          test "$(jq -r '.workflow_run.path' "$EVENT_PATH")" = ".github/workflows/publication-gate-2.2.1.yml"
          test "$(jq -r '.workflow_run.event' "$EVENT_PATH")" = "push"
          test "$(jq -r '.workflow_run.status' "$EVENT_PATH")" = "completed"
          test "$(jq -r '.workflow_run.conclusion' "$EVENT_PATH")" = "success"
          test "$(jq -r '.workflow_run.head_repository.full_name' "$EVENT_PATH")" = "$EXPECTED_REPOSITORY"
          test "$(jq -r '.workflow_run.repository.full_name' "$EVENT_PATH")" = "$EXPECTED_REPOSITORY"
          test "$(jq -r '.workflow_run.head_branch' "$EVENT_PATH")" = "$PUBLICATION_BRANCH"
          test "$(jq -r '.workflow_run.head_sha' "$EVENT_PATH")" = "$PUBLICATION_SHA"
          test "$(git -C trusted-verifier rev-parse HEAD)" = "$TRUSTED_WORKFLOW_SHA"
          test "$(git -C publication-source rev-parse HEAD)" = "$PUBLICATION_SHA"
          remote_head="$(git -C publication-source ls-remote origin "refs/heads/$PUBLICATION_BRANCH" | awk '{print $1}')"
          test "$remote_head" = "$PUBLICATION_SHA"
          remote_tag="$(git -C publication-source ls-remote origin "refs/tags/$RELEASE_TAG" | awk '{print $1}')"
          if [ -n "$remote_tag" ]; then test "$remote_tag" = "$PUBLICATION_SHA"; fi
      - name: Verify C to M1 to P marker-only history
        id: chain
        run: >-
          python trusted-verifier/tools/verify_publication_chain_2_2_1.py
          --root publication-source
          --publication-sha "${{ github.event.workflow_run.head_sha }}"
          --tag-policy absent-or-publication
          --github-output "$GITHUB_OUTPUT"
      - name: Require one merged same-repository candidate pull request
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SOURCE_SHA: ${{ steps.chain.outputs.candidate_source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/commits/${CANDIDATE_SOURCE_SHA}/pulls" \
            > candidate-pulls.json
          git -C publication-source fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main"
          python trusted-verifier/tools/verify_candidate_merge_2_2.py \
            --pulls-json candidate-pulls.json \
            --candidate-sha "$CANDIDATE_SOURCE_SHA" \
            --root publication-source \
            --main-ref origin/main

  required-workflows:
    name: Require named exact-source pull-request workflows
    needs: publication-chain
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.publication-chain.outputs.candidate_source_sha }}
          persist-credentials: false
      - name: Wait for the explicit exact-SHA workflow manifest
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SOURCE_SHA: ${{ needs.publication-chain.outputs.candidate_source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            gh api --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${CANDIDATE_SOURCE_SHA}&event=pull_request&per_page=100" \
              > required-run-pages.json
            jq -e '
              length > 0 and
              ([.[].total_count] | unique | length == 1)
            ' required-run-pages.json > /dev/null
            jq '{
              total_count: .[0].total_count,
              workflow_runs: [.[].workflow_runs[]]
            }' required-run-pages.json > required-runs.json
            if python tools/verify_required_workflows_2_2.py \
              --runs-json required-runs.json \
              --sha "$CANDIDATE_SOURCE_SHA" \
              --manifest .github/release-gates/2.2.1-required-workflows.json \
              --mode pull-request; then
              exit 0
            fi
            echo "Required named workflows are not complete yet (attempt $attempt/90)."
            sleep 10
          done
          echo "Timed out waiting for the explicit exact-SHA workflow manifest."
          exit 1

  build-release:
    name: Build and compare exact candidate/publication source
    needs: [publication-chain, required-workflows]
    runs-on: ubuntu-24.04
    outputs:
      logical_sdist_sha256: ${{ steps.sdist.outputs.logical_sdist_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.publication-chain.outputs.publication_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Route Python caches outside the publication source tree
        shell: bash
        run: echo "PYTHONPYCACHEPREFIX=$RUNNER_TEMP/release-pycache" >> "$GITHUB_ENV"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Materialize exact candidate source outside the publication tree
        env:
          CANDIDATE_SOURCE_SHA: ${{ needs.publication-chain.outputs.candidate_source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          candidate_root="$RUNNER_TEMP/candidate-tree"
          git worktree add --detach "$candidate_root" "$CANDIDATE_SOURCE_SHA"
          test "$(git -C "$candidate_root" rev-parse HEAD)" = "$CANDIDATE_SOURCE_SHA"
      - name: Install release validation dependencies
        working-directory: ${{ runner.temp }}/candidate-tree
        run: >-
          python -m pip install --upgrade pip
          "build>=1.2,<2"
          "twine>=7,<8"
          ".[dev]"
      - name: Re-check publication chain and exact checkout
        env:
          PUBLICATION_SHA: ${{ needs.publication-chain.outputs.publication_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PUBLICATION_SHA"
          python tools/verify_publication_chain_2_2_1.py \
            --publication-sha "$PUBLICATION_SHA" \
            --tag-policy absent-or-publication
      - name: Build publication wheel and sdist
        shell: bash
        run: |
          set -euo pipefail
          git status --short --untracked-files=all
          test -z "$(git status --porcelain --untracked-files=all)"
          python -m build --wheel --sdist --outdir "$RUNNER_TEMP/publication-dist"
          git status --short --untracked-files=all
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Build candidate sdist from immutable C
        env:
          CANDIDATE_SOURCE_SHA: ${{ needs.publication-chain.outputs.candidate_source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          candidate_root="$RUNNER_TEMP/candidate-tree"
          test "$(git -C "$candidate_root" rev-parse HEAD)" = "$CANDIDATE_SOURCE_SHA"
          test -z "$(git -C "$candidate_root" status --porcelain --untracked-files=all)"
          python -m build --sdist --outdir "$RUNNER_TEMP/candidate-dist" "$candidate_root"
      - name: Run complete exact-source tests and static checks
        working-directory: ${{ runner.temp }}/candidate-tree
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/candidate-pycache
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -p no:cacheprovider
          python -m ruff check --no-cache src tests examples demo_projects tools
          python -m compileall -q src tests examples demo_projects tools
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Require logical candidate/publication sdist identity
        id: sdist
        run: >-
          python tools/verify_sdist_identity_2_2.py
          --candidate "$RUNNER_TEMP/candidate-dist/swirengine-2.2.1.tar.gz"
          --publication "$RUNNER_TEMP/publication-dist/swirengine-2.2.1.tar.gz"
          --github-output "$GITHUB_OUTPUT"
      - name: Validate exact publication distributions
        run: |
          python -m twine check "$RUNNER_TEMP/publication-dist"/*
          python tools/verify_distribution_audit_data_2_2.py --dist-dir "$RUNNER_TEMP/publication-dist"
      - name: Require exact portable artifact names
        shell: python
        run: |
          import os
          from pathlib import Path
          publication_dist = Path(os.environ["RUNNER_TEMP"]) / "publication-dist"
          paths = sorted(
              path.name for path in publication_dist.iterdir()
          )
          assert paths == [
              "swirengine-2.2.1-py3-none-any.whl",
              "swirengine-2.2.1.tar.gz",
          ], paths
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: swirengine-2.2.1-publication-portable
          path: ${{ runner.temp }}/publication-dist/*
          if-no-files-found: error
          retention-days: 7

  clean-install-matrix:
    name: Clean install ${{ matrix.os }} / CPython ${{ matrix.python-version }}
    needs: [publication-chain, required-workflows]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.publication-chain.outputs.publication_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Linux CPython 3.14 native build prerequisites
        if: runner.os == 'Linux' && matrix.python-version == '3.14'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libgl-dev libegl-dev
      - name: Install build tooling
        run: python -m pip install --upgrade pip setuptools wheel "build>=1.2,<2"
      - name: Build Windows CPython 3.14 renderer-native dependencies
        if: runner.os == 'Windows' && matrix.python-version == '3.14'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force native-wheels | Out-Null
          python -m pip wheel --no-deps --no-binary=:all: moderngl==5.12.0 -w native-wheels
          python -m pip wheel --no-deps --no-binary=:all: glcontext==3.0.0 -w native-wheels
          $native = Get-ChildItem native-wheels\*.whl | ForEach-Object { $_.FullName }
          python -m pip install $native
      - name: Build standard release wheel
        if: runner.os != 'Windows' || matrix.python-version != '3.14'
        run: python -m build --wheel --outdir dist
      - name: Build Windows CPython 3.14 vendored release wheel
        if: runner.os == 'Windows' && matrix.python-version == '3.14'
        shell: pwsh
        run: |
          python -m build --wheel --outdir dist-base
          $base = (Get-ChildItem dist-base\swirengine-2.2.1-*.whl).FullName
          $moderngl = (Get-ChildItem native-wheels\moderngl-*.whl).FullName
          $glcontext = (Get-ChildItem native-wheels\glcontext-*.whl).FullName
          python tools/build_vendored_wheel.py --base $base --vendor $moderngl --vendor $glcontext --tag cp314-cp314-win_amd64 --output-dir dist
      - name: Verify exact wheel in clean environment and CLI
        if: runner.os != 'Windows' || matrix.python-version != '3.14'
        run: >-
          python tools/verify_clean_wheel_2_0.py
          --wheel-dir dist
          --expected-system "${{ runner.os }}"
          --expected-python "${{ matrix.python-version }}"
          --expected-version 2.2.1
          --verify-cli21
      - name: Verify Windows CPython 3.14 vendored wheel and CLI
        if: runner.os == 'Windows' && matrix.python-version == '3.14'
        run: >-
          python tools/verify_clean_wheel_2_0.py
          --wheel-dir dist
          --expected-system Windows
          --expected-python 3.14
          --expected-version 2.2.1
          --require-vendored-native
          --verify-cli21
      - name: Preserve Windows CPython 3.14 release wheel
        if: runner.os == 'Windows' && matrix.python-version == '3.14'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: swirengine-2.2.1-publication-win-cp314
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7

  release-evidence:
    name: Generate provenance and take initial public-state snapshot
    needs: [publication-chain, build-release, clean-install-matrix]
    runs-on: ubuntu-24.04
    permissions:
      attestations: read
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.publication-chain.outputs.publication_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: swirengine-2.2.1-publication-portable
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: swirengine-2.2.1-publication-win-cp314
          path: dist
      - name: Generate and verify deterministic v2 release evidence
        env:
          CANDIDATE_SOURCE_SHA: ${{ needs.publication-chain.outputs.candidate_source_sha }}
          CANDIDATE_MARKER_SHA: ${{ needs.publication-chain.outputs.candidate_marker_sha }}
          PUBLICATION_SHA: ${{ needs.publication-chain.outputs.publication_sha }}
          WORKFLOW_MANIFEST_SHA256: ${{ needs.publication-chain.outputs.workflow_manifest_sha256 }}
          LOGICAL_SDIST_SHA256: ${{ needs.build-release.outputs.logical_sdist_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          for mode in generate verify; do
            python tools/release_evidence_2_2_1.py "$mode" \
              --dist-dir dist \
              --candidate-source-commit "$CANDIDATE_SOURCE_SHA" \
              --candidate-marker-commit "$CANDIDATE_MARKER_SHA" \
              --publication-commit "$PUBLICATION_SHA" \
              --workflow-manifest .github/release-gates/2.2.1-required-workflows.json \
              --expected-workflow-manifest-sha256 "$WORKFLOW_MANIFEST_SHA256" \
              --expected-logical-sdist-sha256 "$LOGICAL_SDIST_SHA256"
          done
      - name: Capture initial PyPI, tag and GitHub Release state
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SOURCE_SHA: ${{ needs.publication-chain.outputs.candidate_source_sha }}
          CANDIDATE_MARKER_SHA: ${{ needs.publication-chain.outputs.candidate_marker_sha }}
          PUBLICATION_SHA: ${{ needs.publication-chain.outputs.publication_sha }}
          WORKFLOW_MANIFEST_SHA256: ${{ needs.publication-chain.outputs.workflow_manifest_sha256 }}
          LOGICAL_SDIST_SHA256: ${{ needs.build-release.outputs.logical_sdist_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p initial-state
          snapshot() {
            local output="$1" url="$2" auth="${3:-0}" status
            args=(--silent --show-error --location --output "$output" --write-out '%{http_code}')
            if [ "$auth" = 1 ]; then
              args+=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")
            fi
            status="$(curl "${args[@]}" "$url")"
            case "$status" in
              200) ;;
              404) printf 'null\n' > "$output" ;;
              *) echo "Public-state read failed for $url (HTTP $status)"; exit 1 ;;
            esac
          }
          snapshot initial-state/pypi.json "https://pypi.org/pypi/swirengine/${RELEASE_VERSION}/json"
          snapshot initial-state/tag.json "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" 1
          snapshot initial-state/release.json "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" 1

          if python tools/reconcile_release_2_2_1.py \
              --dist-dir dist \
              --release-notes RELEASE_NOTES_2_2_1.md \
              --pypi-description PYPI_DESCRIPTION_2_2_1.md \
              --publication-commit "$PUBLICATION_SHA" \
              --pypi-json initial-state/pypi.json \
              --tag-json initial-state/tag.json \
              --release-json initial-state/release.json \
              > initial-state/plan.json; then
            echo "Freshly built release assets reconcile with the captured public state."
          else
            echo "Fresh assets differ from public state; requiring exact immutable release recovery."
            fallback_dir="$(mktemp -d "$RUNNER_TEMP/immutable-release-assets.XXXXXX")"
            release_assets=(
              swirengine-2.2.1-py3-none-any.whl
              swirengine-2.2.1-cp314-cp314-win_amd64.whl
              swirengine-2.2.1.tar.gz
              SHA256SUMS
              release-provenance.json
            )
            test "${#release_assets[@]}" -eq 5
            for asset in "${release_assets[@]}"; do
              gh release download "$RELEASE_TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --dir "$fallback_dir" \
                --pattern "$asset"
              test -f "$fallback_dir/$asset"
              test ! -L "$fallback_dir/$asset"
            done
            test "$(find "$fallback_dir" -mindepth 1 -maxdepth 1 | wc -l)" -eq 5
            test "$(find "$fallback_dir" -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 5

            gh release verify "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
            for asset in "${release_assets[@]}"; do
              gh release verify-asset "$RELEASE_TAG" "$fallback_dir/$asset" \
                --repo "$GITHUB_REPOSITORY"
            done

            python tools/release_evidence_2_2_1.py verify \
              --dist-dir "$fallback_dir" \
              --candidate-source-commit "$CANDIDATE_SOURCE_SHA" \
              --candidate-marker-commit "$CANDIDATE_MARKER_SHA" \
              --publication-commit "$PUBLICATION_SHA" \
              --workflow-manifest .github/release-gates/2.2.1-required-workflows.json \
              --expected-workflow-manifest-sha256 "$WORKFLOW_MANIFEST_SHA256" \
              --expected-logical-sdist-sha256 "$LOGICAL_SDIST_SHA256"

            mkdir -p recovery-state
            snapshot recovery-state/pypi.json "https://pypi.org/pypi/swirengine/${RELEASE_VERSION}/json"
            snapshot recovery-state/tag.json "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" 1
            snapshot recovery-state/release.json "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" 1
            python tools/reconcile_release_2_2_1.py \
              --dist-dir "$fallback_dir" \
              --release-notes RELEASE_NOTES_2_2_1.md \
              --pypi-description PYPI_DESCRIPTION_2_2_1.md \
              --publication-commit "$PUBLICATION_SHA" \
              --pypi-json recovery-state/pypi.json \
              --tag-json recovery-state/tag.json \
              --release-json recovery-state/release.json \
              --require-complete \
              > recovery-state/plan.json

            recovery_files=(pypi.json tag.json release.json plan.json)
            test "${#recovery_files[@]}" -eq 4
            test "$(find recovery-state -mindepth 1 -maxdepth 1 | wc -l)" -eq 4
            test "$(find recovery-state -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 4
            for state_file in "${recovery_files[@]}"; do
              cp -- "recovery-state/$state_file" "initial-state/$state_file"
              cmp -- "recovery-state/$state_file" "initial-state/$state_file"
            done

            for asset in "${release_assets[@]}"; do
              cp -- "$fallback_dir/$asset" "dist/$asset"
              cmp -- "$fallback_dir/$asset" "dist/$asset"
            done
            test "$(find dist -mindepth 1 -maxdepth 1 | wc -l)" -eq 5
            test "$(find dist -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 5
          fi
          jq . initial-state/plan.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: swirengine-2.2.1-publication-assets
          path: |
            dist/*
            initial-state/*.json
            RELEASE_NOTES_2_2_1.md
            PYPI_DESCRIPTION_2_2_1.md
          if-no-files-found: error
          retention-days: 7

  prepare-tag:
    name: Reconcile exact tag state without write permission
    needs: [publication-chain, release-evidence]
    runs-on: ubuntu-24.04
    outputs:
      create: ${{ steps.plan.outputs.create }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          path: trusted-verifier
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: swirengine-2.2.1-publication-assets
          path: release-input
      - name: Re-read and reconcile immediately before tag mutation
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLICATION_SHA: ${{ needs.publication-chain.outputs.publication_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${PUBLICATION_BRANCH}" --jq '.object.sha')" = "$PUBLICATION_SHA"
          mkdir -p fresh-state
          snapshot() {
            local output="$1" url="$2" auth="${3:-0}" status
            args=(--silent --show-error --location --output "$output" --write-out '%{http_code}')
            if [ "$auth" = 1 ]; then args+=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json"); fi
            status="$(curl "${args[@]}" "$url")"
            case "$status" in 200) ;; 404) printf 'null\n' > "$output" ;; *) exit 1 ;; esac
          }
          snapshot fresh-state/pypi.json "https://pypi.org/pypi/swirengine/${RELEASE_VERSION}/json"
          snapshot fresh-state/tag.json "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" 1
          snapshot fresh-state/release.json "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" 1
          python trusted-verifier/tools/reconcile_release_2_2_1.py \
            --dist-dir release-input/dist \
            --release-notes release-input/RELEASE_NOTES_2_2_1.md \
            --pypi-description release-input/PYPI_DESCRIPTION_2_2_1.md \
            --publication-commit "$PUBLICATION_SHA" \
            --initial-pypi-json release-input/initial-state/pypi.json \
            --initial-tag-json release-input/initial-state/tag.json \
            --initial-release-json release-input/initial-state/release.json \
            --pypi-json fresh-state/pypi.json \
            --tag-json fresh-state/tag.json \
            --release-json fresh-state/release.json > plan.json
          jq . plan.json
          echo "create=$(jq -r '.create_tag' plan.json)" >> "$GITHUB_OUTPUT"

  ensure-tag:
    name: Create only the pre-reconciled v2.2.1 tag
    needs: [publication-chain, prepare-tag]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Create the exact tag when absent and read it back
        env:
          CREATE_TAG: ${{ needs.prepare-tag.outputs.create }}
          GH_TOKEN: ${{ github.token }}
          PUBLICATION_SHA: ${{ needs.publication-chain.outputs.publication_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${PUBLICATION_BRANCH}" --jq '.object.sha')" = "$PUBLICATION_SHA"
          if [ "$CREATE_TAG" = true ]; then
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" > tag-before.json 2>/dev/null; then
              echo "Refusing to replace an unexpectedly existing release tag."
              exit 1
            fi
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${RELEASE_TAG}" \
              -f sha="$PUBLICATION_SHA" > tag-created.json
          else
            test "$CREATE_TAG" = false
          fi
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha')" = "$PUBLICATION_SHA"

  verify-tag:
    name: Verify exact tag and publication chain without write permission
    needs: [publication-chain, ensure-tag]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          path: trusted-verifier
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.publication-chain.outputs.publication_sha }}
          fetch-depth: 0
          persist-credentials: false
          path: publication-source
      - name: Verify immutable tag target and marker-only chain
        env:
          PUBLICATION_SHA: ${{ needs.publication-chain.outputs.publication_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git -C publication-source fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          python trusted-verifier/tools/verify_publication_chain_2_2_1.py \
            --root publication-source \
            --publication-sha "$PUBLICATION_SHA" \
            --tag-policy publication

  prepare-pypi:
    name: Reconcile and stage only missing PyPI files
    needs: [publication-chain, release-evidence, verify-github-release]
    if: >-
      always() &&
      needs.publication-chain.result == 'success' &&
      needs.release-evidence.result == 'success' &&
      needs.verify-github-release.result == 'success'
    runs-on: ubuntu-24.04
    outputs:
      upload: ${{ steps.plan.outputs.upload }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          path: trusted-verifier
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: swirengine-2.2.1-publication-assets
          path: release-input
      - name: Re-read and reconcile immediately before PyPI mutation
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLICATION_SHA: ${{ needs.publication-chain.outputs.publication_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${PUBLICATION_BRANCH}" --jq '.object.sha')" = "$PUBLICATION_SHA"
          mkdir -p fresh-state pypi-dist
          snapshot() {
            local output="$1" url="$2" auth="${3:-0}" status
            args=(--silent --show-error --location --output "$output" --write-out '%{http_code}')
            if [ "$auth" = 1 ]; then args+=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json"); fi
            status="$(curl "${args[@]}" "$url")"
            case "$status" in 200) ;; 404) printf 'null\n' > "$output" ;; *) exit 1 ;; esac
          }
          snapshot fresh-state/pypi.json "https://pypi.org/pypi/swirengine/${RELEASE_VERSION}/json"
          snapshot fresh-state/tag.json "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" 1
          snapshot fresh-state/release.json "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" 1
          python trusted-verifier/tools/reconcile_release_2_2_1.py \
            --dist-dir release-input/dist \
            --release-notes release-input/RELEASE_NOTES_2_2_1.md \
            --pypi-description release-input/PYPI_DESCRIPTION_2_2_1.md \
            --publication-commit "$PUBLICATION_SHA" \
            --initial-pypi-json release-input/initial-state/pypi.json \
            --initial-tag-json release-input/initial-state/tag.json \
            --initial-release-json release-input/initial-state/release.json \
            --pypi-json fresh-state/pypi.json \
            --tag-json fresh-state/tag.json \
            --release-json fresh-state/release.json > plan.json
          jq -e '.create_tag == false' plan.json
          jq -r '.pypi_uploads[]' plan.json | while IFS= read -r name; do
            cp "release-input/dist/$name" pypi-dist/
          done
          count="$(jq '.pypi_uploads | length' plan.json)"
          echo "upload=$([ "$count" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Preserve only reconciled missing PyPI distributions
        if: steps.plan.outputs.upload == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: swirengine-2.2.1-pypi-missing
          path: pypi-dist/*
          if-no-files-found: error
          retention-days: 1

  pypi-publish:
    name: Publish staged PyPI files through Trusted Publisher
    needs: prepare-pypi
    if: needs.prepare-pypi.outputs.upload == 'true'
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download only pre-reconciled distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: swirengine-2.2.1-pypi-missing
          path: pypi-dist
      - name: Publish only the staged distributions
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: pypi-dist/

  verify-pypi:
    name: Fresh-read and verify exact PyPI files
    needs: [publication-chain, release-evidence, prepare-pypi, pypi-publish]
    if: >-
      always() &&
      needs.publication-chain.result == 'success' &&
      needs.release-evidence.result == 'success' &&
      needs.prepare-pypi.result == 'success' &&
      (needs.pypi-publish.result == 'success' || needs.pypi-publish.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          path: trusted-verifier
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: swirengine-2.2.1-publication-assets
          path: release-input
      - name: Immediate PyPI read-back and reconciliation
        env:
          PUBLICATION_SHA: ${{ needs.publication-chain.outputs.publication_sha }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            status="$(curl --silent --show-error --location --output pypi-after.json --write-out '%{http_code}' \
              "https://pypi.org/pypi/swirengine/${RELEASE_VERSION}/json")"
            if [ "$status" = 200 ]; then
              tag_status="$(curl --silent --show-error --location \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                --output tag-after.json --write-out '%{http_code}' \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}")"
              release_status="$(curl --silent --show-error --location \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                --output release-after.json --write-out '%{http_code}' \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
              test "$tag_status" = 200
              case "$release_status" in 200) ;; 404) printf 'null\n' > release-after.json ;; *) exit 1 ;; esac
              if python trusted-verifier/tools/reconcile_release_2_2_1.py \
                --dist-dir release-input/dist \
                --release-notes release-input/RELEASE_NOTES_2_2_1.md \
                --pypi-description release-input/PYPI_DESCRIPTION_2_2_1.md \
                --publication-commit "$PUBLICATION_SHA" \
                --initial-pypi-json release-input/initial-state/pypi.json \
                --initial-tag-json release-input/initial-state/tag.json \
                --initial-release-json release-input/initial-state/release.json \
                --pypi-json pypi-after.json \
                --tag-json tag-after.json \
                --release-json release-after.json \
                --require-complete > after-plan.json; then
                exit 0
              fi
            fi
            sleep 10
          done
          echo "PyPI did not expose the exact reconciled files in time."
          exit 1

  prepare-github-release:
    name: Reconcile and stage exact GitHub Release assets
    needs: [publication-chain, release-evidence, verify-tag]
    runs-on: ubuntu-24.04
    outputs:
      create: ${{ steps.plan.outputs.create }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          path: trusted-verifier
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: swirengine-2.2.1-publication-assets
          path: release-input
      - name: Re-read and reconcile immediately before GitHub mutation
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLICATION_SHA: ${{ needs.publication-chain.outputs.publication_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${PUBLICATION_BRANCH}" --jq '.object.sha')" = "$PUBLICATION_SHA"
          mkdir -p fresh-state github-release-input
          snapshot() {
            local output="$1" url="$2" auth="${3:-0}" status
            args=(--silent --show-error --location --output "$output" --write-out '%{http_code}')
            if [ "$auth" = 1 ]; then args+=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json"); fi
            status="$(curl "${args[@]}" "$url")"
            case "$status" in 200) ;; 404) printf 'null\n' > "$output" ;; *) exit 1 ;; esac
          }
          snapshot fresh-state/pypi.json "https://pypi.org/pypi/swirengine/${RELEASE_VERSION}/json"
          snapshot fresh-state/tag.json "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" 1
          snapshot fresh-state/release.json "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" 1
          python trusted-verifier/tools/reconcile_release_2_2_1.py \
            --dist-dir release-input/dist \
            --release-notes release-input/RELEASE_NOTES_2_2_1.md \
            --pypi-description release-input/PYPI_DESCRIPTION_2_2_1.md \
            --publication-commit "$PUBLICATION_SHA" \
            --initial-pypi-json release-input/initial-state/pypi.json \
            --initial-tag-json release-input/initial-state/tag.json \
            --initial-release-json release-input/initial-state/release.json \
            --pypi-json fresh-state/pypi.json \
            --tag-json fresh-state/tag.json \
            --release-json fresh-state/release.json > plan.json
          jq -e '.create_tag == false' plan.json
          create="$(jq -r '.create_release' plan.json)"
          if [ "$create" = true ]; then
            jq -e '.github_uploads | length == 5' plan.json
            jq -r '.github_uploads[]' plan.json | while IFS= read -r name; do
              cp "release-input/dist/$name" github-release-input/
            done
            cp release-input/RELEASE_NOTES_2_2_1.md github-release-input/
          else
            test "$create" = false
            jq -e '.github_uploads | length == 0' plan.json
          fi
          echo "create=$create" >> "$GITHUB_OUTPUT"
      - name: Preserve exact assets and notes for the minimal write job
        if: steps.plan.outputs.create == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: swirengine-2.2.1-github-release-input
          path: github-release-input/*
          if-no-files-found: error
          retention-days: 1

  github-release:
    name: Publish the pre-reconciled immutable GitHub Release
    needs: [publication-chain, prepare-github-release]
    if: needs.prepare-github-release.outputs.create == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download only pre-reconciled release input
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: swirengine-2.2.1-github-release-input
          path: github-release-input
      - name: Create the exact release with all assets before immutable publication
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLICATION_SHA: ${{ needs.publication-chain.outputs.publication_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${PUBLICATION_BRANCH}" --jq '.object.sha')" = "$PUBLICATION_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha')" = "$PUBLICATION_SHA"
          gh release create "$RELEASE_TAG" \
            github-release-input/swirengine-2.2.1-py3-none-any.whl \
            github-release-input/swirengine-2.2.1-cp314-cp314-win_amd64.whl \
            github-release-input/swirengine-2.2.1.tar.gz \
            github-release-input/SHA256SUMS \
            github-release-input/release-provenance.json \
            --verify-tag \
            --title "SwirEngine 2.2.1" \
            --notes-file github-release-input/RELEASE_NOTES_2_2_1.md \
            --repo "$GITHUB_REPOSITORY"

  verify-github-release:
    name: Fresh-read and verify immutable GitHub Release
    needs: [publication-chain, release-evidence, prepare-github-release, github-release]
    if: >-
      always() &&
      needs.publication-chain.result == 'success' &&
      needs.release-evidence.result == 'success' &&
      needs.prepare-github-release.result == 'success' &&
      (needs.github-release.result == 'success' || needs.github-release.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      attestations: read
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          path: trusted-verifier
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: swirengine-2.2.1-publication-assets
          path: release-input
      - name: Immediate immutable GitHub Release read-back
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLICATION_SHA: ${{ needs.publication-chain.outputs.publication_sha }}
        shell: bash
        run: |
          set -euo pipefail
          pypi_status="$(curl --silent --show-error --location \
            --output pypi-after.json --write-out '%{http_code}' \
            "https://pypi.org/pypi/swirengine/${RELEASE_VERSION}/json")"
          case "$pypi_status" in 200) ;; 404) printf 'null\n' > pypi-after.json ;; *) exit 1 ;; esac
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" \
            > tag-after.json
          for attempt in $(seq 1 30); do
            status="$(curl --silent --show-error --location \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              --output release-after.json --write-out '%{http_code}' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
            if [ "$status" = 200 ] && python trusted-verifier/tools/reconcile_release_2_2_1.py \
              --dist-dir release-input/dist \
              --release-notes release-input/RELEASE_NOTES_2_2_1.md \
              --pypi-description release-input/PYPI_DESCRIPTION_2_2_1.md \
              --publication-commit "$PUBLICATION_SHA" \
              --pypi-json pypi-after.json \
              --tag-json tag-after.json \
              --release-json release-after.json > after-plan.json \
              && jq -e '
                .create_tag == false and
                .create_release == false and
                (.github_uploads | length == 0)
              ' after-plan.json; then
              if gh release verify "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"; then
                attestations_ok=true
                for asset in \
                  swirengine-2.2.1-py3-none-any.whl \
                  swirengine-2.2.1-cp314-cp314-win_amd64.whl \
                  swirengine-2.2.1.tar.gz \
                  SHA256SUMS \
                  release-provenance.json; do
                  if ! gh release verify-asset "$RELEASE_TAG" "release-input/dist/$asset" \
                    --repo "$GITHUB_REPOSITORY"; then
                    attestations_ok=false
                    break
                  fi
                done
                if [ "$attestations_ok" = true ]; then exit 0; fi
              fi
            fi
            sleep 10
          done
          echo "GitHub Release did not expose the exact reconciled assets in time."
          exit 1

  post-release-public-pypi:
    name: Public PyPI verify / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    needs: [publication-chain, verify-pypi]
    if: >-
      always() &&
      needs.publication-chain.result == 'success' &&
      needs.verify-pypi.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.14"
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.publication-chain.outputs.publication_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install only public SwirEngine 2.2.1
        run: >-
          python -m pip install --no-cache-dir
          --index-url https://pypi.org/simple
          swirengine==2.2.1
      - name: Verify public runtime identity outside the checkout
        shell: python
        run: |
          import os
          import subprocess
          import sys
          import tempfile

          with tempfile.TemporaryDirectory(prefix="swir-public-2.2-") as temp:
              env = dict(os.environ)
              env.pop("PYTHONPATH", None)
              env.pop("PYTHONHOME", None)
              subprocess.check_call(
                  [
                      sys.executable,
                      "-c",
                      "import swirengine; assert swirengine.__version__ == '2.2.1'; "
                      "print(swirengine.__version__, swirengine.__file__)",
                  ],
                  cwd=temp,
                  env=env,
              )

  final-public-state:
    name: Verify immutable tag, release, package and evidence
    needs: [publication-chain, release-evidence, post-release-public-pypi]
    if: >-
      always() &&
      needs.publication-chain.result == 'success' &&
      needs.release-evidence.result == 'success' &&
      needs.post-release-public-pypi.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.publication-chain.outputs.publication_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: swirengine-2.2.1-publication-assets
          path: release-input
      - name: Fresh-read and require a complete immutable public state
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLICATION_SHA: ${{ needs.publication-chain.outputs.publication_sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p final-state
          curl --fail --silent --show-error --location \
            "https://pypi.org/pypi/swirengine/${RELEASE_VERSION}/json" \
            > final-state/pypi.json
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" \
            > final-state/tag.json
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
            > final-state/release.json
          python tools/reconcile_release_2_2_1.py \
            --dist-dir release-input/dist \
            --release-notes release-input/RELEASE_NOTES_2_2_1.md \
            --pypi-description release-input/PYPI_DESCRIPTION_2_2_1.md \
            --publication-commit "$PUBLICATION_SHA" \
            --pypi-json final-state/pypi.json \
            --tag-json final-state/tag.json \
            --release-json final-state/release.json \
            --require-complete
          git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          python tools/verify_publication_chain_2_2_1.py \
            --publication-sha "$PUBLICATION_SHA" \
            --tag-policy publication
