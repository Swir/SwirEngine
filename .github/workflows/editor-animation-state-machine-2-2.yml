name: Editor Animation State Machine 2.2

on:
  pull_request:
    paths:
      - "src/swirengine/animation_state_machine22.py"
      - "src/swirengine/editor_animation_project_resources22.py"
      - "src/swirengine/editor_animation_resources22.py"
      - "src/swirengine/editor_animation_state_machine22.py"
      - "src/swirengine/editor_animation_state_machine_frontend22.py"
      - "src/swirengine/editor_animation_workspace22.py"
      - "src/swirengine/editor_animation_workspace_frontend22.py"
      - "src/swirengine/editor_asset_app21.py"
      - "tests/test_animation_project_resources_2_2.py"
      - "tests/test_animation_resource_bindings_2_2.py"
      - "tests/test_animation_state_machine_2_2.py"
      - "tests/test_animation_state_machine_frontend_2_2.py"
      - "tests/test_animation_workspace_2_2.py"
      - "tests/test_skeletal_animation.py"
      - "docs/ANIMATION_STATE_MACHINE_2_2.md"
      - "README.md"
      - "ROADMAP_2_2.md"
      - "assets/readme/**"
      - "tools/generate_progress_svg.py"
      - ".github/workflows/editor-animation-state-machine-2-2.yml"
  push:
    branches:
      - "feature/2.2-*"
    paths:
      - "src/swirengine/animation_state_machine22.py"
      - "src/swirengine/editor_animation_project_resources22.py"
      - "src/swirengine/editor_animation_resources22.py"
      - "src/swirengine/editor_animation_state_machine22.py"
      - "src/swirengine/editor_animation_state_machine_frontend22.py"
      - "src/swirengine/editor_animation_workspace22.py"
      - "src/swirengine/editor_animation_workspace_frontend22.py"
      - "src/swirengine/editor_asset_app21.py"
      - "tests/test_animation_project_resources_2_2.py"
      - "tests/test_animation_resource_bindings_2_2.py"
      - "tests/test_animation_state_machine_2_2.py"
      - "tests/test_animation_state_machine_frontend_2_2.py"
      - "tests/test_animation_workspace_2_2.py"
      - "tests/test_skeletal_animation.py"
      - "docs/ANIMATION_STATE_MACHINE_2_2.md"
      - "README.md"
      - "ROADMAP_2_2.md"
      - "assets/readme/**"
      - "tools/generate_progress_svg.py"
      - ".github/workflows/editor-animation-state-machine-2-2.yml"

permissions:
  contents: read

jobs:
  animation-state-machine:
    name: Animation state machine / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development dependencies
        run: python -m pip install --upgrade pip ".[dev]"
      - name: Verify runtime, creator tooling and PyPI progress contract
        run: >-
          python -m pytest -q
          tests/test_animation_project_resources_2_2.py
          tests/test_animation_resource_bindings_2_2.py
          tests/test_animation_state_machine_2_2.py
          tests/test_animation_state_machine_frontend_2_2.py
          tests/test_animation_workspace_2_2.py
          tests/test_skeletal_animation.py
          tests/test_progress_svg.py
          tests/test_progress_2_1.py
      - name: Verify deterministic active progress
        run: python tools/generate_progress_svg.py --check
      - name: Strict Ruff gate
        run: >-
          python -m ruff check
          src/swirengine/animation_state_machine22.py
          src/swirengine/editor_animation_project_resources22.py
          src/swirengine/editor_animation_resources22.py
          src/swirengine/editor_animation_state_machine22.py
          src/swirengine/editor_animation_state_machine_frontend22.py
          src/swirengine/editor_animation_workspace22.py
          src/swirengine/editor_animation_workspace_frontend22.py
          src/swirengine/editor_asset_app21.py
          tests/test_animation_project_resources_2_2.py
          tests/test_animation_resource_bindings_2_2.py
          tests/test_animation_state_machine_2_2.py
          tests/test_animation_state_machine_frontend_2_2.py
          tests/test_animation_workspace_2_2.py
      - name: Compile focused 2.2 tree
        run: >-
          python -m compileall -q
          src/swirengine/animation_state_machine22.py
          src/swirengine/editor_animation_project_resources22.py
          src/swirengine/editor_animation_resources22.py
          src/swirengine/editor_animation_state_machine22.py
          src/swirengine/editor_animation_state_machine_frontend22.py
          src/swirengine/editor_animation_workspace22.py
          src/swirengine/editor_animation_workspace_frontend22.py
          src/swirengine/editor_asset_app21.py
          tests/test_animation_project_resources_2_2.py
          tests/test_animation_resource_bindings_2_2.py
          tests/test_animation_state_machine_2_2.py
          tests/test_animation_state_machine_frontend_2_2.py
          tests/test_animation_workspace_2_2.py
