name: Prediction Reconciliation 1.6 Validation

on:
  pull_request:
    paths:
      - "src/swirengine/prediction16.py"
      - "tests/test_prediction_reconciliation_1_6.py"
      - "tests/test_multiplayer_2_1_4.py"
      - "tools/benchmark_prediction_reconciliation_1_6.py"
      - "examples/demo_prediction_reconciliation_1_6.py"
      - "docs/PREDICTION_RECONCILIATION_2_1_6.md"
      - "ROADMAP_1_6.md"
      - ".github/workflows/prediction-reconciliation-1-6.yml"
  push:
    branches:
      - "feat/1.6-prediction-reconciliation"
    paths:
      - "src/swirengine/prediction16.py"
      - "tests/test_prediction_reconciliation_1_6.py"
      - "tests/test_multiplayer_2_1_4.py"
      - "tools/benchmark_prediction_reconciliation_1_6.py"
      - "examples/demo_prediction_reconciliation_1_6.py"
      - "docs/PREDICTION_RECONCILIATION_2_1_6.md"
      - "ROADMAP_1_6.md"
      - ".github/workflows/prediction-reconciliation-1-6.yml"

concurrency:
  group: prediction-reconciliation-1-6-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Prediction Reconciliation / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install CPython 3.14 native build prerequisites
        if: matrix.python-version == '3.14'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run 1.6 prediction and locked 1.4 multiplayer contracts
        run: >-
          pytest
          tests/test_prediction_reconciliation_1_6.py
          tests/test_multiplayer_2_1_4.py

      - name: Lint prediction surface
        run: >-
          ruff check
          src/swirengine/prediction16.py
          tests/test_prediction_reconciliation_1_6.py
          tools/benchmark_prediction_reconciliation_1_6.py
          examples/demo_prediction_reconciliation_1_6.py

      - name: Compile prediction surface
        run: >-
          python -m compileall -q
          src/swirengine/prediction16.py
          tests/test_prediction_reconciliation_1_6.py
          tools/benchmark_prediction_reconciliation_1_6.py
          examples/demo_prediction_reconciliation_1_6.py

      - name: Enforce prediction/reconciliation workload budget
        if: matrix.python-version == '3.13'
        run: python tools/benchmark_prediction_reconciliation_1_6.py

      - name: Run creator prediction demo
        run: python examples/demo_prediction_reconciliation_1_6.py
