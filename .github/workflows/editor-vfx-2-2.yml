name: Editor Particle VFX 2.2

on:
  push:
    branches:
      - "feature/2.2-*"
    paths:
      - "src/swirengine/vfx_schema22.py"
      - "src/swirengine/vfx_authoring22.py"
      - "src/swirengine/editor_vfx22.py"
      - "src/swirengine/editor_vfx_frontend22.py"
      - "src/swirengine/editor_integrated_session21.py"
      - "src/swirengine/editor_asset_app21.py"
      - "tests/test_editor_vfx_2_2.py"
      - "ROADMAP_2_2.md"
      - "docs/PARTICLE_VFX_EDITOR_2_2.md"
      - ".github/workflows/editor-vfx-2-2.yml"
  pull_request:
    paths:
      - "src/swirengine/vfx_schema22.py"
      - "src/swirengine/vfx_authoring22.py"
      - "src/swirengine/editor_vfx22.py"
      - "src/swirengine/editor_vfx_frontend22.py"
      - "src/swirengine/editor_integrated_session21.py"
      - "src/swirengine/editor_asset_app21.py"
      - "tests/test_editor_vfx_2_2.py"
      - "ROADMAP_2_2.md"
      - "docs/PARTICLE_VFX_EDITOR_2_2.md"
      - ".github/workflows/editor-vfx-2-2.yml"

permissions:
  contents: read

jobs:
  vfx-authoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install --upgrade pip ".[dev]"
      - name: Test VFX editor slice
        run: python -m pytest -q tests/test_editor_vfx_2_2.py tests/test_editor_hub_2_1.py tests/test_progress_svg.py tests/test_progress_2_1.py
      - name: Check active progress
        run: python tools/generate_progress_svg.py --check
      - name: Lint VFX editor slice
        run: python -m ruff check src/swirengine/vfx_schema22.py src/swirengine/vfx_authoring22.py src/swirengine/editor_vfx22.py src/swirengine/editor_vfx_frontend22.py src/swirengine/editor_integrated_session21.py src/swirengine/editor_asset_app21.py tests/test_editor_vfx_2_2.py
      - name: Compile VFX editor slice
        run: python -m compileall -q src/swirengine/vfx_schema22.py src/swirengine/vfx_authoring22.py src/swirengine/editor_vfx22.py src/swirengine/editor_vfx_frontend22.py src/swirengine/editor_integrated_session21.py src/swirengine/editor_asset_app21.py tests/test_editor_vfx_2_2.py
