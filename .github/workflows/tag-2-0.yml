name: Create SwirEngine 2.0 Release Tag

on:
  push:
    branches:
      - "release/2.0.0-publish"
  workflow_run:
    workflows:
      - "Final Release Gate 2.0"
    branches:
      - "main"
    types:
      - completed

permissions:
  contents: read

jobs:
  create-tag:
    name: Verify final main, preserve v2.0.0 and dispatch publication
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Enforce complete 2.0 release contract before tagging or recovery
        run: python tools/verify_2_0_release_candidate.py --require-final
      - name: Prove orchestration source is the exact current main commit
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        shell: bash
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          checkout_sha="$(git rev-parse HEAD)"

          case "$GITHUB_EVENT_NAME" in
            push)
              test "$GITHUB_REF_NAME" = "release/2.0.0-publish"
              source_sha="$GITHUB_SHA"
              ;;
            workflow_run)
              test "$WORKFLOW_RUN_CONCLUSION" = "success"
              test "$WORKFLOW_RUN_HEAD_BRANCH" = "main"
              test "$WORKFLOW_RUN_HEAD_SHA" = "$main_sha"
              source_sha="$checkout_sha"
              ;;
            *)
              echo "Unsupported release orchestration event: $GITHUB_EVENT_NAME"
              exit 1
              ;;
          esac

          if [ "$source_sha" != "$main_sha" ] || [ "$checkout_sha" != "$main_sha" ]; then
            echo "Release orchestration source is not the exact current main commit: main=$main_sha source=$source_sha checkout=$checkout_sha"
            exit 1
          fi
      - name: Create or preserve immutable v2.0.0 tag
        id: release_tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v2.0.0" >/dev/null 2>&1; then
            echo "Tag v2.0.0 already exists; preserving it without moving or replacing history."
            git fetch --force origin refs/tags/v2.0.0:refs/tags/v2.0.0
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref='refs/tags/v2.0.0' \
              -f sha="$source_sha"
            git fetch --force origin refs/tags/v2.0.0:refs/tags/v2.0.0
          fi
          tag_commit="$(git rev-list -n 1 refs/tags/v2.0.0)"
          echo "tag_commit=$tag_commit" >> "$GITHUB_OUTPUT"
          echo "Immutable v2.0.0 source commit: $tag_commit"
      - name: Re-verify immutable tagged source and its successful final gate
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_COMMIT: ${{ steps.release_tag.outputs.tag_commit }}
        shell: bash
        run: |
          set -euo pipefail
          worktree="${RUNNER_TEMP}/swirengine-v2.0.0-tag"
          git worktree add --detach "$worktree" "$TAG_COMMIT"
          (
            cd "$worktree"
            python tools/verify_2_0_release_candidate.py --require-final
          )
          final_gate_success="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${TAG_COMMIT}&status=success&per_page=100" \
              --jq '[.workflow_runs[] | select(.name == "Final Release Gate 2.0")] | length'
          )"
          if [ "$final_gate_success" -lt 1 ]; then
            echo "No successful Final Release Gate 2.0 run exists for immutable tag source $TAG_COMMIT"
            exit 1
          fi
      - name: Verify public publication state before dispatch
        id: publication_state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          github_exists=0
          pypi_exists=0

          if gh release view "v2.0.0" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            github_exists=1
          fi
          if curl --fail --silent --show-error --location \
            "https://pypi.org/pypi/swirengine/2.0.0/json" >/dev/null 2>&1; then
            pypi_exists=1
          fi

          if [ "$github_exists" -eq 1 ] && [ "$pypi_exists" -eq 1 ]; then
            echo "SwirEngine 2.0 is already published on GitHub and PyPI; no dispatch is required."
            echo "dispatch=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$github_exists" -ne "$pypi_exists" ]; then
            echo "Inconsistent public 2.0 publication state: github_release=$github_exists pypi=$pypi_exists"
            exit 1
          fi

          echo "dispatch=true" >> "$GITHUB_OUTPUT"
      - name: Dispatch exact-tag SwirEngine 2.0 publication
        if: ${{ steps.publication_state.outputs.dispatch == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh workflow run release-2.0.yml --ref main
