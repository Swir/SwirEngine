name: Transport QoS 1.6

on:
  push:
    branches: ["feat/1.6-transport-qos"]
    paths:
      - "src/swirengine/transport16.py"
      - "tests/test_transport_qos_1_6.py"
      - "tests/test_networking.py"
      - "tests/test_multiplayer_2_1_4.py"
      - "tests/test_multiplayer_replication_1_6.py"
      - "tests/test_prediction_reconciliation_1_6.py"
      - "tests/test_session_lifecycle_1_6.py"
      - "tools/benchmark_transport_qos_1_6.py"
      - "examples/demo_transport_qos_1_6.py"
      - "docs/TRANSPORT_QOS_CHANNEL_POLICIES_1_6.md"
      - "ROADMAP_1_6.md"
      - ".github/workflows/transport-qos-1-6.yml"
  pull_request:
    paths:
      - "src/swirengine/transport16.py"
      - "tests/test_transport_qos_1_6.py"
      - "tests/test_networking.py"
      - "tests/test_multiplayer_2_1_4.py"
      - "tests/test_multiplayer_replication_1_6.py"
      - "tests/test_prediction_reconciliation_1_6.py"
      - "tests/test_session_lifecycle_1_6.py"
      - "tools/benchmark_transport_qos_1_6.py"
      - "examples/demo_transport_qos_1_6.py"
      - "docs/TRANSPORT_QOS_CHANNEL_POLICIES_1_6.md"
      - "ROADMAP_1_6.md"
      - ".github/workflows/transport-qos-1-6.yml"
  workflow_dispatch:

concurrency:
  group: transport-qos-1-6-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  transport-qos:
    name: Transport QoS / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install CPython 3.14 native build prerequisites
        if: matrix.python-version == '3.14'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run QoS and locked multiplayer contracts
        run: >-
          pytest
          tests/test_transport_qos_1_6.py
          tests/test_networking.py
          tests/test_multiplayer_2_1_4.py
          tests/test_multiplayer_replication_1_6.py
          tests/test_prediction_reconciliation_1_6.py
          tests/test_session_lifecycle_1_6.py

      - name: Lint transport QoS surface
        run: >-
          ruff check
          src/swirengine/transport16.py
          tests/test_transport_qos_1_6.py
          tools/benchmark_transport_qos_1_6.py
          examples/demo_transport_qos_1_6.py

      - name: Compile creator-facing QoS surfaces
        run: >-
          python -m compileall -q
          src/swirengine/transport16.py
          tests/test_transport_qos_1_6.py
          tools/benchmark_transport_qos_1_6.py
          examples/demo_transport_qos_1_6.py

      - name: Run deterministic transport QoS benchmark
        if: matrix.python-version == '3.13'
        run: python tools/benchmark_transport_qos_1_6.py

      - name: Run transport QoS creator demo
        run: python examples/demo_transport_qos_1_6.py
