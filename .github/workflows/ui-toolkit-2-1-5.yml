name: UI Toolkit 2 1.5 Validation

on:
  pull_request:
    paths:
      - "src/swirengine/ui15.py"
      - "tests/test_ui_toolkit_2_1_5.py"
      - "tools/benchmark_ui_toolkit_2_1_5.py"
      - "examples/demo_ui_toolkit_2_1_5.py"
      - "docs/UI_TOOLKIT_2_1_5.md"
      - "ROADMAP_1_5.md"
      - ".github/workflows/ui-toolkit-2-1-5.yml"
  push:
    branches:
      - "feat/1.5-ui-toolkit-2"
    paths:
      - "src/swirengine/ui15.py"
      - "tests/test_ui_toolkit_2_1_5.py"
      - "tools/benchmark_ui_toolkit_2_1_5.py"
      - "examples/demo_ui_toolkit_2_1_5.py"
      - "docs/UI_TOOLKIT_2_1_5.md"
      - "ROADMAP_1_5.md"
      - ".github/workflows/ui-toolkit-2-1-5.yml"

concurrency:
  group: ui-toolkit-2-1-5-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: UI Toolkit 2 / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install CPython 3.14 native build prerequisites
        if: matrix.python-version == '3.14'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run UI Toolkit 2.0 contract tests
        run: pytest tests/test_ui_toolkit_2_1_5.py tests/test_ui.py tests/test_ui_layout.py

      - name: Lint UI Toolkit 2.0 surface
        run: >-
          ruff check
          src/swirengine/ui15.py
          tests/test_ui_toolkit_2_1_5.py
          tools/benchmark_ui_toolkit_2_1_5.py
          examples/demo_ui_toolkit_2_1_5.py

      - name: Compile UI Toolkit 2.0 surface
        run: >-
          python -m compileall -q
          src/swirengine/ui15.py
          tests/test_ui_toolkit_2_1_5.py
          tools/benchmark_ui_toolkit_2_1_5.py
          examples/demo_ui_toolkit_2_1_5.py

      - name: Enforce UI Toolkit 2.0 workload budget
        if: matrix.python-version == '3.13'
        run: python tools/benchmark_ui_toolkit_2_1_5.py

      - name: Run UI Toolkit 2.0 creator demo
        run: python examples/demo_ui_toolkit_2_1_5.py
