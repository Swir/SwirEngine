name: Temporary Skeletal Ruff Autofix

on:
  push:
    branches:
      - "feat/1.3-skeletal-animation"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install "ruff==0.16.7"
      - name: Apply only Ruff-safe fixes to skeletal milestone files
        run: >-
          ruff check --fix
          examples/demo_skeletal_animation.py
          src/swirengine/graphics/gltf_skeletal.py
          src/swirengine/skeletal.py
          tests/test_skeletal_animation.py
          tools/verify_skeletal_opengl.py
      - name: Commit fixes if Ruff changed files
        shell: bash
        run: |
          git add \
            examples/demo_skeletal_animation.py \
            src/swirengine/graphics/gltf_skeletal.py \
            src/swirengine/skeletal.py \
            tests/test_skeletal_animation.py \
            tools/verify_skeletal_opengl.py
          if git diff --cached --quiet; then
            echo "No Ruff changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(lint): normalize skeletal animation imports"
          git push origin "HEAD:${{ github.ref_name }}"
