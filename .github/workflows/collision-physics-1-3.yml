name: Collision Physics 1.3 Validation

on:
  pull_request:
    paths:
      - "src/swirengine/physics/collision3d.py"
      - "src/swirengine/physics/rigidbody3d.py"
      - "src/swirengine/physics/__init__.py"
      - "src/swirengine/__init__.py"
      - "tests/test_collision3d.py"
      - "tests/test_rigidbody3d.py"
      - "examples/demo_collision3d_physics.py"
      - "tools/benchmark_collision3d.py"
      - "docs/COLLISION_PHYSICS_1_3.md"
      - "CHANGELOG.d/1.3.0-collision-physics-foundation.md"
      - "ROADMAP_1_3.md"
      - "README.md"
      - ".github/workflows/collision-physics-1-3.yml"
  push:
    branches: ["main"]
    paths:
      - "src/swirengine/physics/collision3d.py"
      - "src/swirengine/physics/rigidbody3d.py"
      - "src/swirengine/physics/__init__.py"
      - "src/swirengine/__init__.py"
      - "tests/test_collision3d.py"
      - "tests/test_rigidbody3d.py"
      - "examples/demo_collision3d_physics.py"
      - "tools/benchmark_collision3d.py"
      - "docs/COLLISION_PHYSICS_1_3.md"
      - "CHANGELOG.d/1.3.0-collision-physics-foundation.md"
      - "ROADMAP_1_3.md"
      - "README.md"
      - ".github/workflows/collision-physics-1-3.yml"

permissions:
  contents: read

jobs:
  collision-contract:
    name: 3D collision and physics contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest tests/test_collision3d.py tests/test_rigidbody3d.py
      - run: ruff check src/swirengine/physics/collision3d.py src/swirengine/physics/rigidbody3d.py tests/test_collision3d.py tests/test_rigidbody3d.py examples/demo_collision3d_physics.py tools/benchmark_collision3d.py
      - run: python -m compileall -q src/swirengine/physics examples/demo_collision3d_physics.py tools/benchmark_collision3d.py
      - run: python tools/benchmark_collision3d.py
      - run: python examples/demo_collision3d_physics.py
