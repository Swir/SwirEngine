name: Creator Editor 1.3 Validation

on:
  push:
    branches:
      - feat/1.3-creator-editor-integration
  pull_request:
    paths:
      - "src/swirengine/editor_systems.py"
      - "src/swirengine/editor*.py"
      - "tests/test_editor*.py"
      - "tools/benchmark_editor_systems_1_3.py"
      - "examples/demo_creator_editor_integration.py"
      - "docs/CREATOR_EDITOR_INTEGRATION_1_3.md"
      - ".github/workflows/creator-editor-1-3.yml"
      - "README.md"
      - "ROADMAP_1_3.md"

jobs:
  creator-editor-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Editor integration regression suite
        run: >-
          pytest
          tests/test_editor_systems_1_3.py
          tests/test_editor.py
          tests/test_editor_assets.py
          tests/test_editor_diagnostics.py
          tests/test_editor_frontend.py
          tests/test_editor_gizmo.py
          tests/test_editor_preview.py
          tests/test_editor_runtime.py
          tests/test_editor_state.py
          tests/test_editor_viewport.py
          tests/test_editor_workflow.py
          tests/test_editor_workspace.py
      - name: Strict Ruff gate
        run: >-
          ruff check
          src/swirengine/editor_systems.py
          tests/test_editor_systems_1_3.py
          tools/benchmark_editor_systems_1_3.py
          examples/demo_creator_editor_integration.py
      - name: Compile integration files
        run: >-
          python -m compileall -q
          src/swirengine/editor_systems.py
          tests/test_editor_systems_1_3.py
          tools/benchmark_editor_systems_1_3.py
          examples/demo_creator_editor_integration.py
      - name: Filtered diagnostics locality benchmark
        run: python tools/benchmark_editor_systems_1_3.py
      - name: Creator integration example
        run: python examples/demo_creator_editor_integration.py
