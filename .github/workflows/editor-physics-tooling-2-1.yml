name: Editor Physics Tooling 2.1 Validation

on:
  pull_request:
    paths:
      - "src/swirengine/editor_physics_tooling21.py"
      - "src/swirengine/editor_physics_frontend21.py"
      - "src/swirengine/editor_app21.py"
      - "src/swirengine/editor_animation_frontend21.py"
      - "src/swirengine/physics/**"
      - "tests/test_editor_physics_tooling_2_1.py"
      - "tests/test_editor_physics_frontend_2_1.py"
      - "tests/test_editor_animation_frontend_2_1.py"
      - "tests/test_physics2_1_4.py"
      - "tests/test_progress_svg.py"
      - "tools/generate_progress_svg.py"
      - ".github/workflows/editor-physics-tooling-2-1.yml"
      - "pyproject.toml"
  workflow_dispatch:

jobs:
  physics-authoring-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Physics authoring runtime regression suite
        run: >-
          pytest -q
          tests/test_editor_physics_tooling_2_1.py
          tests/test_editor_physics_frontend_2_1.py
          tests/test_editor_animation_frontend_2_1.py
          tests/test_physics2_1_4.py
      - name: Progress presentation contract
        run: >-
          pytest -q tests/test_progress_svg.py &&
          python tools/generate_progress_svg.py --check
      - name: Strict Ruff gate
        run: >-
          ruff check
          src/swirengine/editor_physics_tooling21.py
          src/swirengine/editor_physics_frontend21.py
          src/swirengine/editor_app21.py
          tests/test_editor_physics_tooling_2_1.py
          tests/test_editor_physics_frontend_2_1.py
      - name: Compile physics authoring files
        run: >-
          python -m compileall -q
          src/swirengine/editor_physics_tooling21.py
          src/swirengine/editor_physics_frontend21.py
          src/swirengine/editor_app21.py
          tests/test_editor_physics_tooling_2_1.py
          tests/test_editor_physics_frontend_2_1.py
