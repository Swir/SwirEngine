name: Project System 2.0 1.5 Validation

on:
  push:
    branches:
      - feat/1.5-project-system-2
  pull_request:
    paths:
      - "src/swirengine/project.py"
      - "src/swirengine/cli.py"
      - "tests/test_project_system_1_5.py"
      - "tests/test_cli.py"
      - "examples/demo_project_system_1_5.py"
      - "docs/PROJECT_SYSTEM_2_1_5.md"
      - "pyproject.toml"
      - "ROADMAP_1_5.md"
      - ".github/workflows/project-system-1-5.yml"

jobs:
  project-system-contract:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - name: Install CPython 3.14 native build prerequisites
        if: matrix.python-version == '3.14'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev
      - run: python -m pip install -e ".[dev]"
      - name: Project System and stable CLI regressions
        run: pytest tests/test_project_system_1_5.py tests/test_cli.py
      - name: Strict Ruff gate
        run: >-
          ruff check
          src/swirengine/project.py
          src/swirengine/cli.py
          tests/test_project_system_1_5.py
          examples/demo_project_system_1_5.py
      - name: Compile Project System files
        run: >-
          python -m compileall -q
          src/swirengine/project.py
          src/swirengine/cli.py
          tests/test_project_system_1_5.py
          examples/demo_project_system_1_5.py
      - name: Project System 2.0 integration demo
        run: python examples/demo_project_system_1_5.py
