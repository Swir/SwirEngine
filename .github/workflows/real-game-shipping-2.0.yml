name: Real-Game Shipping 2.0

on:
  push:
    branches: [main]
    paths:
      - "examples/2d_game_demo/**"
      - "examples/3d_game_demo/**"
      - "examples/multiplayer_game_demo/**"
      - "src/swirengine/diagnostics19.py"
      - "tools/verify_real_game_production_1_9.py"
      - "tools/verify_real_game_shipping_2_0.py"
      - "tests/test_real_game_shipping_2_0.py"
      - "docs/REAL_GAME_SHIPPING_2_0.md"
      - ".github/workflows/real-game-shipping-2.0.yml"
  pull_request:
    paths:
      - "examples/2d_game_demo/**"
      - "examples/3d_game_demo/**"
      - "examples/multiplayer_game_demo/**"
      - "src/swirengine/diagnostics19.py"
      - "tools/verify_real_game_production_1_9.py"
      - "tools/verify_real_game_shipping_2_0.py"
      - "tests/test_real_game_shipping_2_0.py"
      - "docs/REAL_GAME_SHIPPING_2_0.md"
      - ".github/workflows/real-game-shipping-2.0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-game-shipping:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CPython 3.14 native build prerequisites
        if: matrix.python-version == '3.14'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libgl-dev libegl-dev
      - name: Install engine and development tools
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Run focused staging regression
        run: python -m pytest -q tests/test_real_game_shipping_2_0.py
      - name: Run source-to-staged representative game gate
        run: python tools/verify_real_game_shipping_2_0.py
      - name: Strict Ruff gate
        run: >-
          python -m ruff check
          tools/verify_real_game_shipping_2_0.py
          tests/test_real_game_shipping_2_0.py
      - name: Compile verification surfaces
        run: >-
          python -m compileall -q
          tools/verify_real_game_shipping_2_0.py
          tests/test_real_game_shipping_2_0.py
