name: Navigation 1.3 Validation

on:
  pull_request:
    paths:
      - "src/swirengine/navigation.py"
      - "tests/test_navigation.py"
      - "examples/demo_navigation_pathfinding.py"
      - "tools/benchmark_navigation.py"
      - "docs/NAVIGATION_PATHFINDING_1_3.md"
      - "CHANGELOG.d/1.3.0-navigation-pathfinding.md"
      - "ROADMAP_1_3.md"
      - "README.md"
      - ".github/workflows/navigation-1-3.yml"
  push:
    branches: ["main"]
    paths:
      - "src/swirengine/navigation.py"
      - "tests/test_navigation.py"
      - "examples/demo_navigation_pathfinding.py"
      - "tools/benchmark_navigation.py"
      - "docs/NAVIGATION_PATHFINDING_1_3.md"
      - "CHANGELOG.d/1.3.0-navigation-pathfinding.md"
      - "ROADMAP_1_3.md"
      - "README.md"
      - ".github/workflows/navigation-1-3.yml"

permissions:
  contents: read

jobs:
  navigation-contract:
    name: Deterministic navigation contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest tests/test_navigation.py
      - run: ruff check src/swirengine/navigation.py tests/test_navigation.py examples/demo_navigation_pathfinding.py tools/benchmark_navigation.py
      - run: python -m compileall -q src/swirengine/navigation.py examples/demo_navigation_pathfinding.py tools/benchmark_navigation.py
      - run: python tools/benchmark_navigation.py
      - run: python examples/demo_navigation_pathfinding.py
