name: Creator Workflow 2.0

on:
  push:
    branches: [main]
    paths:
      - "src/swirengine/creator_workflow20.py"
      - "src/swirengine/cli.py"
      - "tests/test_creator_workflow_2_0.py"
      - "tests/test_cli.py"
      - "tools/verify_creator_workflow_2_0.py"
      - "tools/verify_real_game_production_1_9.py"
      - "docs/CREATOR_WORKFLOW_2_0.md"
      - ".github/workflows/creator-workflow-2.0.yml"
  pull_request:
    paths:
      - "src/swirengine/creator_workflow20.py"
      - "src/swirengine/cli.py"
      - "tests/test_creator_workflow_2_0.py"
      - "tests/test_cli.py"
      - "tools/verify_creator_workflow_2_0.py"
      - "tools/verify_real_game_production_1_9.py"
      - "docs/CREATOR_WORKFLOW_2_0.md"
      - ".github/workflows/creator-workflow-2.0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  creator-workflow:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CPython 3.14 native build prerequisites
        if: matrix.python-version == '3.14'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libgl-dev libegl-dev
      - name: Install engine and development tools
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Run focused creator workflow tests
        run: python -m pytest -q tests/test_creator_workflow_2_0.py tests/test_cli.py
      - name: Verify maintained 2D and 3D creator fixtures
        run: python tools/verify_creator_workflow_2_0.py
      - name: Strict Ruff gate
        run: python -m ruff check src/swirengine/creator_workflow20.py src/swirengine/cli.py tests/test_creator_workflow_2_0.py tools/verify_creator_workflow_2_0.py
      - name: Compile creator workflow surfaces
        run: python -m compileall -q src/swirengine/creator_workflow20.py src/swirengine/cli.py tests/test_creator_workflow_2_0.py tools/verify_creator_workflow_2_0.py
