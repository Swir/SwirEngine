name: Editor Real-Game Milestone 10

on:
  pull_request:
    paths:
      - "examples/2d_game_demo/**"
      - "examples/3d_game_demo/**"
      - "examples/multiplayer_game_demo/**"
      - "src/swirengine/editor_app21.py"
      - "src/swirengine/editor_integrated_session21.py"
      - "src/swirengine/editor_creator_frontend21.py"
      - "src/swirengine/editor_build_export_frontend21.py"
      - "src/swirengine/editor_build_export_tooling21.py"
      - "src/swirengine/editor_preview.py"
      - "src/swirengine/exporting.py"
      - "tools/verify_editor_real_game_gate_2_1.py"
      - "tools/verify_editor_build_export_2_1.py"
      - "tools/verify_real_game_production_1_9.py"
      - "tests/test_editor_real_game_gate_2_1.py"
      - "tests/test_progress_svg.py"
      - "tools/generate_progress_svg.py"
      - "README.md"
      - "ROADMAP_2_1.md"
      - ".github/workflows/editor-real-game-milestone-10.yml"
  push:
    branches:
      - "feature/2.1-milestone-10-real-game-editor-gate"

permissions:
  contents: read

jobs:
  acceptance:
    name: Milestone 10 editor gate / Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CPython 3.14 native prerequisites
        if: matrix.python-version == '3.14'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libgl-dev libegl-dev
      - name: Install engine and development tools
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Run real-game editor acceptance regression
        run: python -m pytest -q tests/test_editor_real_game_gate_2_1.py
      - name: Run representative real-game editor gate
        run: python tools/verify_editor_real_game_gate_2_1.py
      - name: Verify PyPI progress presentation contract
        run: >-
          python -m pytest -q tests/test_progress_svg.py &&
          python tools/generate_progress_svg.py --check
      - name: Strict Ruff gate
        run: >-
          python -m ruff check
          tools/verify_editor_real_game_gate_2_1.py
          tests/test_editor_real_game_gate_2_1.py
      - name: Compile Milestone 10 editor-gate surfaces
        run: >-
          python -m compileall -q
          tools/verify_editor_real_game_gate_2_1.py
          tests/test_editor_real_game_gate_2_1.py
