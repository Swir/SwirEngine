name: Runtime Scalability 2.0

on:
  push:
    branches: [main]
    paths:
      - "src/swirengine/asset_streaming.py"
      - "src/swirengine/render_resources18.py"
      - "src/swirengine/resource_budget17.py"
      - "tests/test_asset_streaming.py"
      - "tests/test_runtime_scalability_2_0.py"
      - "tests/test_render_resources_1_8.py"
      - "tests/test_render_resources_hardening_1_8.py"
      - "tests/test_resource_budget_1_7.py"
      - "tools/verify_runtime_scalability_2_0.py"
      - "docs/RUNTIME_SCALABILITY_2_0.md"
      - ".github/workflows/runtime-scalability-2.0.yml"
  pull_request:
    paths:
      - "src/swirengine/asset_streaming.py"
      - "src/swirengine/render_resources18.py"
      - "src/swirengine/resource_budget17.py"
      - "tests/test_asset_streaming.py"
      - "tests/test_runtime_scalability_2_0.py"
      - "tests/test_render_resources_1_8.py"
      - "tests/test_render_resources_hardening_1_8.py"
      - "tests/test_resource_budget_1_7.py"
      - "tools/verify_runtime_scalability_2_0.py"
      - "docs/RUNTIME_SCALABILITY_2_0.md"
      - ".github/workflows/runtime-scalability-2.0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-scalability:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CPython 3.14 native build prerequisites
        if: matrix.python-version == '3.14'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libgl-dev libegl-dev
      - name: Install engine and development tools
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Run focused resource lifecycle regression suite
        run: >-
          python -m pytest -q
          tests/test_asset_streaming.py
          tests/test_runtime_scalability_2_0.py
          tests/test_render_resources_1_8.py
          tests/test_render_resources_hardening_1_8.py
          tests/test_resource_budget_1_7.py
      - name: Run deterministic production workload
        run: python tools/verify_runtime_scalability_2_0.py
      - name: Strict Ruff gate
        run: >-
          python -m ruff check
          src/swirengine/asset_streaming.py
          tests/test_runtime_scalability_2_0.py
          tools/verify_runtime_scalability_2_0.py
      - name: Compile runtime scalability surfaces
        run: >-
          python -m compileall -q
          src/swirengine/asset_streaming.py
          tests/test_runtime_scalability_2_0.py
          tools/verify_runtime_scalability_2_0.py
