name: Temporary Ruff Autofix 1.7

on:
  push:
    branches: ["feat/1.7-background-jobs"]
    paths:
      - "src/swirengine/jobs17.py"
      - "tools/benchmark_background_jobs_1_7.py"
      - ".github/workflows/autofix-background-jobs-1-7.yml"

permissions:
  contents: write

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/1.7-background-jobs
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install Ruff
        run: python -m pip install "ruff>=0.16,<0.17"
      - name: Apply import formatting only
        run: ruff check --select I --fix src/swirengine/jobs17.py tools/benchmark_background_jobs_1_7.py
      - name: Verify import formatting
        run: ruff check --select I src/swirengine/jobs17.py tools/benchmark_background_jobs_1_7.py
      - name: Commit autofix if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No Ruff autofix changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/swirengine/jobs17.py tools/benchmark_background_jobs_1_7.py
          git commit -m "style: normalize SwirEngine 1.7 imports"
          git push origin HEAD:feat/1.7-background-jobs
