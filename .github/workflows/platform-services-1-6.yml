name: Platform Services 1.6

on:
  pull_request:
    paths:
      - "src/swirengine/platform16.py"
      - "tests/test_platform_services_1_6.py"
      - "tests/test_save_profile_2_1_5.py"
      - "tools/benchmark_platform_services_1_6.py"
      - "examples/demo_platform_services_1_6.py"
      - "docs/PLATFORM_SERVICES_1_6.md"
      - "ROADMAP_1_6.md"
      - ".github/workflows/platform-services-1-6.yml"
  workflow_dispatch:

concurrency:
  group: platform-services-1-6-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  platform-services:
    name: Platform services / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install CPython 3.14 native build prerequisites
        if: matrix.python-version == '3.14'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run platform-services and locked save contracts
        run: >-
          pytest
          tests/test_platform_services_1_6.py
          tests/test_save_profile_2_1_5.py

      - name: Lint platform-services surface
        run: >-
          ruff check
          src/swirengine/platform16.py
          tests/test_platform_services_1_6.py
          tools/benchmark_platform_services_1_6.py
          examples/demo_platform_services_1_6.py

      - name: Compile platform-services surfaces
        run: >-
          python -m compileall -q
          src/swirengine/platform16.py
          tests/test_platform_services_1_6.py
          tools/benchmark_platform_services_1_6.py
          examples/demo_platform_services_1_6.py

      - name: Run deterministic platform-services workload
        if: matrix.python-version == '3.13'
        run: python tools/benchmark_platform_services_1_6.py

      - name: Run creator demo
        run: python examples/demo_platform_services_1_6.py
