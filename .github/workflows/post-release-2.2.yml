name: Post-release 2.2 Public Verification

on:
  pull_request:
    branches: [main]
    paths:
      - "README.md"
      - "ROADMAP_2_2.md"
      - "CHANGELOG.md"
      - "RELEASE_NOTES_2_2.md"
      - "PYPI_DESCRIPTION_2_2.md"
      - "pyproject.toml"
      - "docs/MIGRATING_TO_2_2.md"
      - "docs/RELEASE_GATE_2_2.md"
      - "release-evidence/2.2.0/**"
      - "assets/readme/**"
      - ".github/release-gates/2.2-required-workflows.json"
      - ".github/workflows/release-candidate-2.2.yml"
      - ".github/workflows/post-release-2.2.yml"
      - ".github/workflows/publication-gate-2.2.yml"
      - ".github/workflows/release.yml"
      - "tools/**"
      - "tests/**"
      - "src/**"
      - "examples/**"
      - "demo_projects/**"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "ROADMAP_2_2.md"
      - "CHANGELOG.md"
      - "RELEASE_NOTES_2_2.md"
      - "PYPI_DESCRIPTION_2_2.md"
      - "pyproject.toml"
      - "docs/MIGRATING_TO_2_2.md"
      - "docs/RELEASE_GATE_2_2.md"
      - "release-evidence/2.2.0/**"
      - "assets/readme/**"
      - ".github/release-gates/2.2-required-workflows.json"
      - ".github/workflows/release-candidate-2.2.yml"
      - ".github/workflows/post-release-2.2.yml"
      - ".github/workflows/publication-gate-2.2.yml"
      - ".github/workflows/release.yml"
      - "tools/**"
      - "tests/**"
      - "src/**"
      - "examples/**"
      - "demo_projects/**"

permissions:
  actions: read
  contents: read

concurrency:
  group: swirengine-2.2-post-release-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  contract:
    name: Public-release verifier contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact checkout identity
        shell: pwsh
        run: |
          $actual = git rev-parse HEAD
          if ($actual -ne $env:EXPECTED_SOURCE_SHA) {
            throw "checkout mismatch: expected $env:EXPECTED_SOURCE_SHA, got $actual"
          }
      - name: Route Python caches outside the verified source tree
        shell: bash
        run: echo "PYTHONPYCACHEPREFIX=$RUNNER_TEMP/post-release-pycache" >> "$GITHUB_ENV"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install focused validation tooling
        run: >-
          python -m pip install --upgrade pip
          ".[dev]"
      - name: Run post-release and compatibility regressions
        run: >-
          python -m pytest -q -p no:cacheprovider
          tests/test_public_release_verifier_2_2.py
          tests/test_post_release_workflow_2_2.py
          tests/test_release_readiness_2_2.py
          tests/test_required_workflows_2_2.py
          tests/test_verify_2_2_release_candidate.py
          tests/test_release_candidate_workflow_2_2.py
          tests/test_release_workflow_2_2.py
          tests/test_verify_2_1_publication.py
          tests/test_release_readiness_2_1.py
          tests/test_release_candidate_contract.py
          tests/test_release_1_3_contract.py
          tests/test_release_1_4_contract.py
          tests/test_release_candidate_1_5.py
          tests/test_source_checkpoint_1_6.py
          tests/test_source_checkpoint_1_7.py
          tests/test_source_checkpoint_1_8.py
          tests/test_source_checkpoint_1_9.py
      - name: Lint post-release and compatibility contracts
        run: >-
          python -m ruff check --no-cache
          tools/verify_public_release_2_2.py
          tools/verify_2_2_release_readiness.py
          tools/verify_2_1_publication.py
          tools/verify_2_1_release_readiness.py
          tools/verify_1_3_release_candidate.py
          tools/verify_1_4_release_candidate.py
          tools/verify_1_5_release_candidate.py
          tools/verify_1_6_source_checkpoint.py
          tools/verify_1_7_source_checkpoint.py
          tools/verify_1_8_source_checkpoint.py
          tools/verify_1_9_source_checkpoint.py
          tests/test_public_release_verifier_2_2.py
          tests/test_post_release_workflow_2_2.py
          tests/test_release_readiness_2_2.py
          tests/test_required_workflows_2_2.py
          tests/test_verify_2_2_release_candidate.py
          tests/test_release_candidate_workflow_2_2.py
          tests/test_release_workflow_2_2.py
      - name: Compile post-release and compatibility contracts
        run: >-
          python -m compileall -q
          tools/verify_public_release_2_2.py
          tools/verify_2_2_release_readiness.py
          tools/verify_2_1_publication.py
          tools/verify_2_1_release_readiness.py
          tools/verify_1_3_release_candidate.py
          tools/verify_1_4_release_candidate.py
          tools/verify_1_5_release_candidate.py
          tools/verify_1_6_source_checkpoint.py
          tools/verify_1_7_source_checkpoint.py
          tools/verify_1_8_source_checkpoint.py
          tools/verify_1_9_source_checkpoint.py
          tests/test_public_release_verifier_2_2.py
          tests/test_post_release_workflow_2_2.py
          tests/test_release_readiness_2_2.py
          tests/test_required_workflows_2_2.py
          tests/test_verify_2_2_release_candidate.py
          tests/test_release_candidate_workflow_2_2.py
          tests/test_release_workflow_2_2.py
      - name: Verify exact immutable public state without reinstalling
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/verify_public_release_2_2.py --skip-install

  public-install:
    name: Public install ${{ matrix.os }} / CPython ${{ matrix.python-version }}
    needs: contract
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact checkout identity
        shell: pwsh
        run: |
          $actual = git rev-parse HEAD
          if ($actual -ne $env:EXPECTED_SOURCE_SHA) {
            throw "checkout mismatch: expected $env:EXPECTED_SOURCE_SHA, got $actual"
          }
      - name: Route Python caches outside the verified source tree
        shell: bash
        run: echo "PYTHONPYCACHEPREFIX=$RUNNER_TEMP/post-release-pycache" >> "$GITHUB_ENV"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify immutable public release and isolated installation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/verify_public_release_2_2.py
