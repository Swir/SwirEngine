name: Frame Budget 1.7

on:
  push:
    branches: ["feat/1.7-frame-budget-controller"]
    paths:
      - "src/swirengine/frame_budget17.py"
      - "tests/test_frame_budget_1_7.py"
      - "tools/benchmark_frame_budget_1_7.py"
      - "examples/demo_frame_budget_1_7.py"
      - "docs/FRAME_TIME_BUDGET_1_7.md"
      - "CHANGELOG.d/1.7-frame-budget-controller.md"
      - ".github/workflows/frame-budget-1-7.yml"
  pull_request:
    paths:
      - "src/swirengine/frame_budget17.py"
      - "tests/test_frame_budget_1_7.py"
      - "tools/benchmark_frame_budget_1_7.py"
      - "examples/demo_frame_budget_1_7.py"
      - "docs/FRAME_TIME_BUDGET_1_7.md"
      - "CHANGELOG.d/1.7-frame-budget-controller.md"
      - ".github/workflows/frame-budget-1-7.yml"
  workflow_dispatch:

concurrency:
  group: frame-budget-1-7-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frame-budget:
    name: Frame Budget / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install CPython 3.14 native build prerequisites
        if: matrix.python-version == '3.14'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run frame-budget and async-runtime regressions
        run: >-
          pytest
          tests/test_frame_budget_1_7.py
          tests/test_background_jobs_1_7.py
          tests/test_async_assets_1_7.py
          tests/test_work_graph_1_7.py
          tests/test_scene_staging_1_7.py
          tests/test_background_save_1_7.py
          tests/test_shader_cache_1_7.py
          tests/test_performance_diagnostics_1_5.py

      - name: Lint frame-budget surfaces
        run: >-
          ruff check
          src/swirengine/frame_budget17.py
          tests/test_frame_budget_1_7.py
          tools/benchmark_frame_budget_1_7.py
          examples/demo_frame_budget_1_7.py

      - name: Compile frame-budget surfaces
        run: >-
          python -m compileall -q
          src/swirengine/frame_budget17.py
          tests/test_frame_budget_1_7.py
          tools/benchmark_frame_budget_1_7.py
          examples/demo_frame_budget_1_7.py

      - name: Run deterministic frame-budget workload
        if: matrix.python-version == '3.13'
        run: python tools/benchmark_frame_budget_1_7.py

      - name: Run creator demo
        run: python examples/demo_frame_budget_1_7.py
