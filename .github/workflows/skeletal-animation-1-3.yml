name: Skeletal Animation 1.3 Validation

on:
  pull_request:
    paths:
      - "src/swirengine/skeletal.py"
      - "src/swirengine/graphics/skeletal.py"
      - "src/swirengine/graphics/gltf_skeletal.py"
      - "src/swirengine/graphics/shadow_renderer.py"
      - "src/swirengine/graphics/stats.py"
      - "tests/test_skeletal_animation.py"
      - "examples/demo_skeletal_animation.py"
      - "tools/verify_skeletal_opengl.py"
      - "docs/SKELETAL_ANIMATION_1_3.md"
      - "ROADMAP_1_3.md"
      - ".github/workflows/skeletal-animation-1-3.yml"
  push:
    branches: [main]
    paths:
      - "src/swirengine/skeletal.py"
      - "src/swirengine/graphics/skeletal.py"
      - "src/swirengine/graphics/gltf_skeletal.py"
      - "src/swirengine/graphics/shadow_renderer.py"
      - "src/swirengine/graphics/stats.py"
      - "tests/test_skeletal_animation.py"
      - "tools/verify_skeletal_opengl.py"
      - "ROADMAP_1_3.md"
      - ".github/workflows/skeletal-animation-1-3.yml"

permissions:
  contents: read

jobs:
  cpu-contract:
    name: Skeletal CPU/import contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest tests/test_skeletal_animation.py
      - run: >-
          ruff check src/swirengine/skeletal.py src/swirengine/graphics/skeletal.py
          src/swirengine/graphics/gltf_skeletal.py src/swirengine/graphics/shadow_renderer.py
          src/swirengine/graphics/stats.py tests/test_skeletal_animation.py
          examples/demo_skeletal_animation.py tools/verify_skeletal_opengl.py
      - run: >-
          python -m compileall -q src/swirengine/skeletal.py src/swirengine/graphics/skeletal.py
          src/swirengine/graphics/gltf_skeletal.py examples/demo_skeletal_animation.py
          tools/verify_skeletal_opengl.py

  opengl-smoke:
    name: Real OpenGL GPU skinning smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Install software OpenGL/Xvfb runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libgl-dev libegl-dev
      - name: Compile and execute production GPU skinning path
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a python tools/verify_skeletal_opengl.py
