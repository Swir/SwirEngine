name: Session Lifecycle 1.6

on:
  push:
    branches: ["feat/1.6-session-lifecycle"]
    paths:
      - "src/swirengine/session16.py"
      - "tests/test_session_lifecycle_1_6.py"
      - "tools/benchmark_session_lifecycle_1_6.py"
      - "examples/demo_session_lifecycle_1_6.py"
      - "docs/SESSION_LOBBY_MATCH_LIFECYCLE_1_6.md"
      - "ROADMAP_1_6.md"
      - ".github/workflows/session-lifecycle-1-6.yml"
  pull_request:
    paths:
      - "src/swirengine/session16.py"
      - "tests/test_session_lifecycle_1_6.py"
      - "tools/benchmark_session_lifecycle_1_6.py"
      - "examples/demo_session_lifecycle_1_6.py"
      - "docs/SESSION_LOBBY_MATCH_LIFECYCLE_1_6.md"
      - "ROADMAP_1_6.md"
      - ".github/workflows/session-lifecycle-1-6.yml"
  workflow_dispatch:

concurrency:
  group: session-lifecycle-1-6-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  session-lifecycle:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run session and locked multiplayer contracts
        run: >-
          python -m pytest -q
          tests/test_session_lifecycle_1_6.py
          tests/test_prediction_reconciliation_1_6.py
          tests/test_multiplayer_replication_1_6.py
          tests/test_multiplayer_1_4.py
      - name: Ruff
        run: >-
          python -m ruff check
          src/swirengine/session16.py
          tests/test_session_lifecycle_1_6.py
          tools/benchmark_session_lifecycle_1_6.py
          examples/demo_session_lifecycle_1_6.py
      - name: Compile creator-facing session surfaces
        run: >-
          python -m py_compile
          src/swirengine/session16.py
          tools/benchmark_session_lifecycle_1_6.py
          examples/demo_session_lifecycle_1_6.py
      - name: Run deterministic session lifecycle benchmark
        if: matrix.python-version == '3.13'
        run: python tools/benchmark_session_lifecycle_1_6.py
      - name: Run session lifecycle creator demo
        run: python examples/demo_session_lifecycle_1_6.py
