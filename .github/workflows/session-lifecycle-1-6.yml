name: Session Lifecycle 1.6

on:
  push:
    branches: ["feat/1.6-session-lifecycle"]
    paths:
      - "src/swirengine/session16.py"
      - "tests/test_session_lifecycle_1_6.py"
      - "tests/test_multiplayer_2_1_4.py"
      - "tests/test_prediction_reconciliation_1_6.py"
      - "tests/test_multiplayer_replication_1_6.py"
      - "tools/benchmark_session_lifecycle_1_6.py"
      - "examples/demo_session_lifecycle_1_6.py"
      - "docs/SESSION_LOBBY_MATCH_LIFECYCLE_1_6.md"
      - "ROADMAP_1_6.md"
      - ".github/workflows/session-lifecycle-1-6.yml"
  pull_request:
    paths:
      - "src/swirengine/session16.py"
      - "tests/test_session_lifecycle_1_6.py"
      - "tests/test_multiplayer_2_1_4.py"
      - "tests/test_prediction_reconciliation_1_6.py"
      - "tests/test_multiplayer_replication_1_6.py"
      - "tools/benchmark_session_lifecycle_1_6.py"
      - "examples/demo_session_lifecycle_1_6.py"
      - "docs/SESSION_LOBBY_MATCH_LIFECYCLE_1_6.md"
      - "ROADMAP_1_6.md"
      - ".github/workflows/session-lifecycle-1-6.yml"
  workflow_dispatch:

concurrency:
  group: session-lifecycle-1-6-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  session-lifecycle:
    name: Session Lifecycle / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install CPython 3.14 native build prerequisites
        if: matrix.python-version == '3.14'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run session and locked multiplayer contracts
        run: >-
          pytest
          tests/test_session_lifecycle_1_6.py
          tests/test_prediction_reconciliation_1_6.py
          tests/test_multiplayer_replication_1_6.py
          tests/test_multiplayer_2_1_4.py

      - name: Lint session lifecycle surface
        run: >-
          ruff check
          src/swirengine/session16.py
          tests/test_session_lifecycle_1_6.py
          tools/benchmark_session_lifecycle_1_6.py
          examples/demo_session_lifecycle_1_6.py

      - name: Compile creator-facing session surfaces
        run: >-
          python -m compileall -q
          src/swirengine/session16.py
          tests/test_session_lifecycle_1_6.py
          tools/benchmark_session_lifecycle_1_6.py
          examples/demo_session_lifecycle_1_6.py

      - name: Run deterministic session lifecycle benchmark
        if: matrix.python-version == '3.13'
        run: python tools/benchmark_session_lifecycle_1_6.py

      - name: Run session lifecycle creator demo
        run: python examples/demo_session_lifecycle_1_6.py
