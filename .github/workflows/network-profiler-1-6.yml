name: Network Profiler 1.6

on:
  pull_request:
    paths:
      - "src/swirengine/network_profiler16.py"
      - "src/swirengine/multiplayer16.py"
      - "src/swirengine/prediction16.py"
      - "src/swirengine/transport16.py"
      - "src/swirengine/session16.py"
      - "tests/test_network_profiler_1_6.py"
      - "tests/test_multiplayer_replication_1_6.py"
      - "tests/test_prediction_reconciliation_1_6.py"
      - "tests/test_transport_qos_1_6.py"
      - "tests/test_session_lifecycle_1_6.py"
      - "tools/benchmark_network_profiler_1_6.py"
      - "examples/demo_network_profiler_1_6.py"
      - "docs/MULTIPLAYER_NETWORK_PROFILER_1_6.md"
      - "ROADMAP_1_6.md"
      - ".github/workflows/network-profiler-1-6.yml"
  workflow_dispatch:

concurrency:
  group: network-profiler-1-6-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  network-profiler:
    name: Network profiler / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install CPython 3.14 native build prerequisites
        if: matrix.python-version == '3.14'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run profiler and locked multiplayer contracts
        run: >-
          pytest
          tests/test_network_profiler_1_6.py
          tests/test_multiplayer_replication_1_6.py
          tests/test_prediction_reconciliation_1_6.py
          tests/test_transport_qos_1_6.py
          tests/test_session_lifecycle_1_6.py

      - name: Lint profiler surface
        run: >-
          ruff check
          src/swirengine/network_profiler16.py
          tests/test_network_profiler_1_6.py
          tools/benchmark_network_profiler_1_6.py
          examples/demo_network_profiler_1_6.py

      - name: Compile profiler surfaces
        run: >-
          python -m compileall -q
          src/swirengine/network_profiler16.py
          tests/test_network_profiler_1_6.py
          tools/benchmark_network_profiler_1_6.py
          examples/demo_network_profiler_1_6.py

      - name: Run deterministic profiler workload
        if: matrix.python-version == '3.13'
        run: python tools/benchmark_network_profiler_1_6.py

      - name: Run creator demo
        run: python examples/demo_network_profiler_1_6.py
