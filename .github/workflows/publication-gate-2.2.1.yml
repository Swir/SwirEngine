name: SwirEngine 2.2.1 Publication Gate

on:
  push:
    branches:
      - "release/2.2.1-publication"
    paths:
      - ".release/publish-2.2.1/publication.json"

permissions:
  contents: read

concurrency:
  group: swirengine-2.2.1-publication-gate
  cancel-in-progress: false

jobs:
  publication-chain:
    name: Verify marker-only publication source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require an exact same-repository marker push
        env:
          EVENT_PATH: ${{ github.event_path }}
          EXPECTED_REPOSITORY: Swir/SwirEngine
          PUBLICATION_BRANCH: release/2.2.1-publication
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_REF" = "refs/heads/$PUBLICATION_BRANCH"
          test "$(jq -r '.repository.full_name' "$EVENT_PATH")" = "$EXPECTED_REPOSITORY"
          test "$(jq -r '.ref' "$EVENT_PATH")" = "refs/heads/$PUBLICATION_BRANCH"
          test "$(jq -r '.after' "$EVENT_PATH")" = "$GITHUB_SHA"
          test "$(jq -r '.head_commit.id' "$EVENT_PATH")" = "$GITHUB_SHA"
          test "$(jq -r '.deleted' "$EVENT_PATH")" = "false"
          test "$(jq -r '.forced' "$EVENT_PATH")" = "false"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote_head="$(git ls-remote origin "refs/heads/$PUBLICATION_BRANCH" | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install hashed YAML contract dependency
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            'PyYAML==6.0.3 --hash=sha256:0f29edc409a6392443abf94b9cf89ce99889a1dd5376d94316ae5145dfedd5d6' \
            > "$RUNNER_TEMP/publication-gate-requirements.txt"
          python -m pip install \
            --disable-pip-version-check \
            --no-deps \
            --only-binary=:all: \
            --require-hashes \
            -r "$RUNNER_TEMP/publication-gate-requirements.txt"
      - name: Verify deterministic C to M1 to P chain
        id: chain
        run: >-
          python tools/verify_publication_chain_2_2_1.py
          --publication-sha "$GITHUB_SHA"
          --tag-policy absent-or-publication
          --github-output "$GITHUB_OUTPUT"
      - name: Require the complete non-publishing candidate contract
        env:
          CANDIDATE_SOURCE_SHA: ${{ steps.chain.outputs.candidate_source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          candidate_root="$RUNNER_TEMP/candidate-source"
          git worktree add --detach "$candidate_root" "$CANDIDATE_SOURCE_SHA"
          test "$(git -C "$candidate_root" rev-parse HEAD)" = "$CANDIDATE_SOURCE_SHA"
          test -f "$candidate_root/RELEASE_NOTES_2_2_1.md"
          test -f "$candidate_root/tools/verify_2_2_1_release_candidate.py"
          python "$candidate_root/tools/verify_2_2_1_release_candidate.py"
