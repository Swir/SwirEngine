name: API Migration 2.0

on:
  push:
    branches:
      - main
      - "feat/2.0-*"
    paths:
      - "src/swirengine/**"
      - "tests/test_api_contract_2_0.py"
      - "tests/test_progress_svg.py"
      - "tools/verify_api_contract_2_0.py"
      - "tools/generate_progress_svg.py"
      - "docs/API_MIGRATION_2_0.md"
      - "docs/api-contracts/**"
      - "assets/readme/**"
      - "README.md"
      - "ROADMAP_1_9.md"
      - "ROADMAP_2_0.md"
      - "pyproject.toml"
      - ".github/workflows/api-migration-2-0.yml"
  pull_request:
    paths:
      - "src/swirengine/**"
      - "tests/test_api_contract_2_0.py"
      - "tests/test_progress_svg.py"
      - "tools/verify_api_contract_2_0.py"
      - "tools/generate_progress_svg.py"
      - "docs/API_MIGRATION_2_0.md"
      - "docs/api-contracts/**"
      - "assets/readme/**"
      - "README.md"
      - "ROADMAP_1_9.md"
      - "ROADMAP_2_0.md"
      - "pyproject.toml"
      - ".github/workflows/api-migration-2-0.yml"
  workflow_dispatch:

concurrency:
  group: api-migration-2-0-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    name: API contract / Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - name: Install CPython 3.14 native build prerequisites
        if: matrix.python-version == '3.14'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libgl-dev libegl-dev
      - run: python -m pip install -e ".[dev]"
      - name: Verify completed 1.9 checkpoint
        run: python tools/verify_1_9_source_checkpoint.py --require-complete
      - name: Verify 2.0 public API and migration contract
        run: python tools/verify_api_contract_2_0.py
      - name: Verify deterministic progress presentation
        run: python tools/generate_progress_svg.py --check
      - name: Focused 2.0 API and presentation tests
        run: pytest -q tests/test_api_contract_2_0.py tests/test_progress_svg.py
      - name: Full repository tests
        if: matrix.python-version == '3.13'
        run: pytest
      - name: Strict Ruff gate
        if: matrix.python-version == '3.13'
        run: ruff check src tests examples demo_projects tools
      - name: Compile repository surfaces
        if: matrix.python-version == '3.13'
        run: python -m compileall -q src tests examples demo_projects tools
