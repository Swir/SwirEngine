name: Renderer2 Bridge 1.8

on:
  push:
    branches: ["feat/1.8-renderer2-compat-bridge"]
    paths:
      - "src/swirengine/renderer2_bridge18.py"
      - "tests/test_renderer2_bridge_1_8.py"
      - "tools/benchmark_renderer2_bridge_1_8.py"
      - "examples/demo_renderer2_bridge_1_8.py"
      - "docs/RENDERER2_BRIDGE_1_8.md"
      - "ROADMAP_1_8.md"
      - "CHANGELOG.d/1.8-renderer2-compat-bridge.md"
      - ".github/workflows/renderer2-bridge-1-8.yml"
  pull_request:
    paths:
      - "src/swirengine/renderer2_bridge18.py"
      - "tests/test_renderer2_bridge_1_8.py"
      - "tools/benchmark_renderer2_bridge_1_8.py"
      - "examples/demo_renderer2_bridge_1_8.py"
      - "docs/RENDERER2_BRIDGE_1_8.md"
      - "ROADMAP_1_8.md"
      - "CHANGELOG.d/1.8-renderer2-compat-bridge.md"
      - ".github/workflows/renderer2-bridge-1-8.yml"
  workflow_dispatch:

concurrency:
  group: renderer2-bridge-1-8-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  renderer2-bridge:
    name: Renderer2 Bridge / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install CPython 3.14 native build prerequisites
        if: matrix.python-version == '3.14'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run Renderer2 bridge and compatibility regressions
        run: >-
          pytest
          tests/test_renderer2_bridge_1_8.py
          tests/test_renderer2_1_4.py
          tests/test_accelerated_renderer2_1_4.py
          tests/test_render_graph_1_8.py
          tests/test_render_quality_1_8.py
          tests/test_visibility_lod_1_8.py
          tests/test_render_submission_1_8.py

      - name: Lint Renderer2 bridge surfaces
        run: >-
          ruff check
          src/swirengine/renderer2_bridge18.py
          tests/test_renderer2_bridge_1_8.py
          tools/benchmark_renderer2_bridge_1_8.py
          examples/demo_renderer2_bridge_1_8.py

      - name: Compile Renderer2 bridge surfaces
        run: >-
          python -m compileall -q
          src/swirengine/renderer2_bridge18.py
          tests/test_renderer2_bridge_1_8.py
          tools/benchmark_renderer2_bridge_1_8.py
          examples/demo_renderer2_bridge_1_8.py

      - name: Run deterministic Renderer2 bridge workload
        if: matrix.python-version == '3.13'
        run: python tools/benchmark_renderer2_bridge_1_8.py

      - name: Run creator demo
        run: python examples/demo_renderer2_bridge_1_8.py
