name: Post-release 1.3 Verification

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/post-release-1.3-verify.yml"
  workflow_dispatch:

jobs:
  public-pypi:
    name: Public PyPI (${{ matrix.os }} / Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.14"
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify public PyPI metadata and install published 1.3.0 only
        shell: python
        run: |
          import json
          import subprocess
          import sys
          import time
          import urllib.error
          import urllib.request

          version = "1.3.0"
          url = f"https://pypi.org/pypi/swirengine/{version}/json"
          metadata = None
          for attempt in range(18):
              try:
                  with urllib.request.urlopen(url, timeout=20) as response:
                      metadata = json.load(response)
                  break
              except (urllib.error.URLError, urllib.error.HTTPError):
                  if attempt == 17:
                      raise
                  time.sleep(10)
          assert metadata is not None
          assert metadata["info"]["version"] == version
          requires_python = {part.strip() for part in metadata["info"]["requires_python"].split(",")}
          assert requires_python == {">=3.10", "<3.15"}, metadata["info"]["requires_python"]
          subprocess.check_call([sys.executable, "-m", "pip", "install", "--upgrade", "pip"])
          subprocess.check_call([
              sys.executable,
              "-m",
              "pip",
              "install",
              "--no-cache-dir",
              "--index-url",
              "https://pypi.org/simple",
              f"swirengine=={version}",
          ])
      - name: Verify published import, version and 1.3 API
        shell: python
        run: |
          import swirengine
          import swirengine.creator
          import swirengine.gameplay
          import swirengine.large_world
          import swirengine.navigation

          assert swirengine.__version__ == "1.3.0"
          for name in ("Game", "Scene", "InstancedCube3D", "ShaderMesh3D", "CollisionWorld3D"):
              assert hasattr(swirengine, name), name
          print(swirengine.__version__, swirengine.__file__)
      - name: Install Linux software OpenGL runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libgl-dev libegl-dev
      - name: Smoke Neon Frontier 1.3 against public PyPI
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          SWIR_1_3_SMOKE_FRAMES: "12"
        run: xvfb-run -a python demo_projects/neon_frontier_1_3/run_game.py
      - name: Probe Neon Frontier 1.3 against public PyPI on Windows 3.14
        if: runner.os == 'Windows'
        env:
          SWIR_DEMO_RUNTIME_PROBE: "1"
        run: python demo_projects/neon_frontier_1_3/run_game.py
