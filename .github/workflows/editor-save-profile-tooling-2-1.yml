name: Editor Save Profile Tooling 2.1

on:
  pull_request:
    paths:
      - "src/swirengine/game_state19.py"
      - "src/swirengine/storage15.py"
      - "src/swirengine/editor_asset_app21.py"
      - "src/swirengine/editor_integrated_session21.py"
      - "src/swirengine/editor_save_profile_frontend21.py"
      - "src/swirengine/editor_save_profile_tooling21.py"
      - "tests/test_editor_save_profile_tooling_2_1.py"
      - "tests/test_save_profile_2_1_5.py"
      - "tests/test_game_state_production_1_9.py"
      - "tests/test_progress_svg.py"
      - "tools/generate_progress_svg.py"
      - "README.md"
      - "ROADMAP_2_1.md"
      - ".github/workflows/editor-save-profile-tooling-2-1.yml"
  push:
    branches:
      - "feature/2.1-save-profile-creator-tooling"

permissions:
  contents: read

jobs:
  validate:
    name: Save Profile authoring / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install CPython 3.14 native build prerequisites
        if: matrix.python-version == '3.14'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run editor and shipping save/profile tests
        run: >-
          pytest -q
          tests/test_editor_save_profile_tooling_2_1.py
          tests/test_save_profile_2_1_5.py
          tests/test_game_state_production_1_9.py
      - name: Verify progress presentation contract
        run: >-
          pytest -q tests/test_progress_svg.py &&
          python tools/generate_progress_svg.py --check
      - name: Strict Ruff gate
        run: >-
          ruff check
          src/swirengine/editor_asset_app21.py
          src/swirengine/editor_integrated_session21.py
          src/swirengine/editor_save_profile_frontend21.py
          src/swirengine/editor_save_profile_tooling21.py
          tests/test_editor_save_profile_tooling_2_1.py
      - name: Compile save/profile authoring files
        run: >-
          python -m compileall -q
          src/swirengine/editor_asset_app21.py
          src/swirengine/editor_integrated_session21.py
          src/swirengine/editor_save_profile_frontend21.py
          src/swirengine/editor_save_profile_tooling21.py
          tests/test_editor_save_profile_tooling_2_1.py
