name: Shader Material Cache 1.7

on:
  push:
    branches: ["feat/1.7-shader-material-cache"]
    paths:
      - "src/swirengine/shader_cache17.py"
      - "tests/test_shader_cache_1_7.py"
      - "tools/benchmark_shader_cache_1_7.py"
      - "examples/demo_shader_cache_1_7.py"
      - "docs/SHADER_MATERIAL_CACHE_1_7.md"
      - "CHANGELOG.d/1.7-shader-material-cache.md"
      - ".github/workflows/shader-material-cache-1-7.yml"
  pull_request:
    paths:
      - "src/swirengine/shader_cache17.py"
      - "tests/test_shader_cache_1_7.py"
      - "tools/benchmark_shader_cache_1_7.py"
      - "examples/demo_shader_cache_1_7.py"
      - "docs/SHADER_MATERIAL_CACHE_1_7.md"
      - "CHANGELOG.d/1.7-shader-material-cache.md"
      - ".github/workflows/shader-material-cache-1-7.yml"
  workflow_dispatch:

concurrency:
  group: shader-material-cache-1-7-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shader-material-cache:
    name: Shader Material Cache / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install CPython 3.14 native build prerequisites
        if: matrix.python-version == '3.14'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run shader-cache and parallel-runtime regressions
        run: >-
          pytest
          tests/test_shader_cache_1_7.py
          tests/test_background_jobs_1_7.py
          tests/test_async_assets_1_7.py

      - name: Lint shader-cache surfaces
        run: >-
          ruff check
          src/swirengine/shader_cache17.py
          tests/test_shader_cache_1_7.py
          tools/benchmark_shader_cache_1_7.py
          examples/demo_shader_cache_1_7.py

      - name: Compile shader-cache surfaces
        run: >-
          python -m compileall -q
          src/swirengine/shader_cache17.py
          tests/test_shader_cache_1_7.py
          tools/benchmark_shader_cache_1_7.py
          examples/demo_shader_cache_1_7.py

      - name: Run deterministic shader-cache workload
        if: matrix.python-version == '3.13'
        run: python tools/benchmark_shader_cache_1_7.py

      - name: Run creator demo
        run: python examples/demo_shader_cache_1_7.py
