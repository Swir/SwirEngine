name: Async Assets 1.7

on:
  push:
    branches: ["feat/1.7-async-assets"]
    paths:
      - "src/swirengine/assets17.py"
      - "tests/test_async_assets_1_7.py"
      - "tools/benchmark_async_assets_1_7.py"
      - "examples/demo_async_assets_1_7.py"
      - "docs/ASYNC_ASSETS_1_7.md"
      - "ROADMAP_1_7.md"
      - "CHANGELOG.d/1.7-async-assets.md"
      - ".github/workflows/async-assets-1-7.yml"
  pull_request:
    paths:
      - "src/swirengine/assets17.py"
      - "tests/test_async_assets_1_7.py"
      - "tools/benchmark_async_assets_1_7.py"
      - "examples/demo_async_assets_1_7.py"
      - "docs/ASYNC_ASSETS_1_7.md"
      - "ROADMAP_1_7.md"
      - "CHANGELOG.d/1.7-async-assets.md"
      - ".github/workflows/async-assets-1-7.yml"
  workflow_dispatch:

concurrency:
  group: async-assets-1-7-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  async-assets:
    name: Async Assets / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install CPython 3.14 native build prerequisites
        if: matrix.python-version == '3.14'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run focused async-asset and compatibility contracts
        run: >-
          pytest
          tests/test_async_assets_1_7.py
          tests/test_background_jobs_1_7.py
          tests/test_asset_pipeline.py
          tests/test_asset_pipeline_1_4.py

      - name: Lint async-asset surfaces
        run: >-
          ruff check
          src/swirengine/assets17.py
          tests/test_async_assets_1_7.py
          tools/benchmark_async_assets_1_7.py
          examples/demo_async_assets_1_7.py

      - name: Compile async-asset surfaces
        run: >-
          python -m compileall -q
          src/swirengine/assets17.py
          tests/test_async_assets_1_7.py
          tools/benchmark_async_assets_1_7.py
          examples/demo_async_assets_1_7.py

      - name: Run async-asset workload benchmark
        if: matrix.python-version == '3.13'
        run: python tools/benchmark_async_assets_1_7.py

      - name: Run creator demo
        run: python examples/demo_async_assets_1_7.py
