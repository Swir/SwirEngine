name: Input UI Settings 1.9

on:
  push:
    branches:
      - main
      - "feat/1.9-input-ui-settings-shipping"
    paths:
      - "src/swirengine/shipping19.py"
      - "src/swirengine/ui_navigation.py"
      - "tests/test_input_ui_settings_1_9.py"
      - "examples/production_flow_1_9.py"
      - "tools/bench_input_ui_settings_1_9.py"
      - "docs/INPUT_UI_SETTINGS_1_9.md"
      - "ROADMAP_1_9.md"
      - ".github/workflows/input-ui-settings-1-9.yml"
  pull_request:
    paths:
      - "src/swirengine/shipping19.py"
      - "src/swirengine/ui_navigation.py"
      - "tests/test_input_ui_settings_1_9.py"
      - "examples/production_flow_1_9.py"
      - "tools/bench_input_ui_settings_1_9.py"
      - "docs/INPUT_UI_SETTINGS_1_9.md"
      - "ROADMAP_1_9.md"
      - ".github/workflows/input-ui-settings-1-9.yml"

permissions:
  contents: read

jobs:
  input-ui-settings:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Focused input/UI/settings tests
        run: pytest -q tests/test_input_ui_settings_1_9.py

      - name: Existing input/gamepad regressions
        run: pytest -q tests/test_input_actions.py tests/test_gamepad.py

      - name: Creator production flow
        run: python examples/production_flow_1_9.py

      - name: Deterministic configuration workload
        if: matrix.python-version == '3.13'
        run: python tools/bench_input_ui_settings_1_9.py

      - name: Ruff
        if: matrix.python-version == '3.13'
        run: |
          ruff check src/swirengine/shipping19.py src/swirengine/ui_navigation.py \
            tests/test_input_ui_settings_1_9.py examples/production_flow_1_9.py \
            tools/bench_input_ui_settings_1_9.py

      - name: Compile
        run: |
          python -m compileall -q src/swirengine/shipping19.py src/swirengine/ui_navigation.py \
            tests/test_input_ui_settings_1_9.py examples/production_flow_1_9.py \
            tools/bench_input_ui_settings_1_9.py
