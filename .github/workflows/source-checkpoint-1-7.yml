name: Source Checkpoint 1.7

on:
  push:
    branches:
      - main
      - "feat/1.7-*"
  pull_request:
    paths:
      - "src/swirengine/**"
      - "tests/**"
      - "examples/**"
      - "demo_projects/**"
      - "tools/**"
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
      - "CHANGELOG.d/**"
      - "ROADMAP_1_3.md"
      - "ROADMAP_1_4.md"
      - "ROADMAP_1_5.md"
      - "ROADMAP_1_6.md"
      - "ROADMAP_1_7.md"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"
      - ".github/workflows/source-checkpoint-1-6.yml"
      - ".github/workflows/source-checkpoint-1-7.yml"
  workflow_dispatch:

concurrency:
  group: source-checkpoint-1-7-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    name: 1.7 contracts / Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - name: Install CPython 3.14 native build prerequisites
        if: matrix.python-version == '3.14'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev
      - run: python -m pip install -e ".[dev]"
      - name: Audit source-checkpoint contract
        run: |
          python tools/verify_1_7_source_checkpoint.py
          python tools/verify_1_7_source_checkpoint.py --require-complete
          python tools/verify_1_6_source_checkpoint.py --require-complete
      - name: Run complete 1.7 parallel-runtime contract suite
        run: >-
          pytest
          tests/test_background_jobs_1_7.py
          tests/test_async_assets_1_7.py
          tests/test_resource_budget_1_7.py
          tests/test_work_graph_1_7.py
          tests/test_scene_staging_1_7.py
          tests/test_background_save_1_7.py
          tests/test_shader_cache_1_7.py
          tests/test_frame_budget_1_7.py
          tests/test_source_checkpoint_1_7.py
      - name: Verify locked compatibility auditors
        if: matrix.python-version == '3.13'
        run: |
          python tools/verify_1_3_release_candidate.py
          python tools/verify_1_4_release_candidate.py --require-complete
          python tools/verify_1_5_release_candidate.py --require-complete
          python tools/verify_1_6_source_checkpoint.py --require-complete
      - name: Full repository tests
        if: matrix.python-version == '3.13'
        run: pytest
      - name: Strict Ruff gate
        if: matrix.python-version == '3.13'
        run: ruff check src tests examples demo_projects tools
      - name: Compile repository surfaces
        if: matrix.python-version == '3.13'
        run: python -m compileall -q src tests examples demo_projects tools

  workloads:
    name: Integrated 1.7 workload + source showcase
    needs: contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Run aggregate deterministic 1.7 soak
        run: python tools/soak_parallel_runtime_1_7.py
      - name: Run integrated 1.7 source showcase
        run: python examples/demo_parallel_runtime_showcase_1_7.py
      - name: Run source-only 2D and 3D game demos headlessly
        env:
          SWIR_GAME_DEMO_HEADLESS: "1"
        run: |
          python examples/2d_game_demo/run_game.py
          python examples/3d_game_demo/run_game.py

  source-platform-smoke:
    name: Integrated 1.7 source showcase / ${{ matrix.os }}
    needs: contract
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python examples/demo_parallel_runtime_showcase_1_7.py

  clean-package:
    name: Build + clean wheel checkpoint
    needs: contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip build twine
      - name: Build local distributions
        run: python -m build
      - name: Check local distribution metadata
        run: python -m twine check dist/*
      - name: Install wheel in a clean environment
        shell: bash
        run: |
          python -m venv .checkpoint17-venv
          .checkpoint17-venv/bin/python -m pip install --upgrade pip
          .checkpoint17-venv/bin/python -m pip install dist/*.whl
          .checkpoint17-venv/bin/python - <<'PY'
          from pathlib import Path
          import tomllib

          import swirengine
          import swirengine.assets17
          import swirengine.background_save17
          import swirengine.frame_budget17
          import swirengine.jobs17
          import swirengine.resource_budget17
          import swirengine.scene_staging17
          import swirengine.shader_cache17
          import swirengine.work_graph17

          expected = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          assert swirengine.__version__ == expected
          print("clean checkpoint wheel:", swirengine.__version__)
          PY
      - name: Probe integrated source showcase against clean wheel
        shell: bash
        run: |
          .checkpoint17-venv/bin/python examples/demo_parallel_runtime_showcase_1_7.py
          SWIR_GAME_DEMO_HEADLESS=1 .checkpoint17-venv/bin/python examples/2d_game_demo/run_game.py
          SWIR_GAME_DEMO_HEADLESS=1 .checkpoint17-venv/bin/python examples/3d_game_demo/run_game.py
