name: Run Sessions + Progress 1.9

on:
  push:
    branches:
      - "feat/1.9-run-session*"
    paths:
      - "src/swirengine/project19.py"
      - "src/swirengine/run_sessions19.py"
      - "src/swirengine/cli.py"
      - "tests/test_project_manifest_1_9.py"
      - "tests/test_run_session_1_9.py"
      - "tests/test_progress_svg.py"
      - "tools/benchmark_run_session_1_9.py"
      - "tools/generate_progress_svg.py"
      - "docs/RUN_SESSIONS_1_9.md"
      - "ROADMAP_1_9.md"
      - "README.md"
      - "assets/readme/progress-*.svg"
      - "CHANGELOG.d/1.9-run-session.md"
      - ".github/workflows/run-session-1-9.yml"
  pull_request:
    paths:
      - "src/swirengine/project19.py"
      - "src/swirengine/run_sessions19.py"
      - "src/swirengine/cli.py"
      - "tests/test_project_manifest_1_9.py"
      - "tests/test_run_session_1_9.py"
      - "tests/test_progress_svg.py"
      - "tools/benchmark_run_session_1_9.py"
      - "tools/generate_progress_svg.py"
      - "docs/RUN_SESSIONS_1_9.md"
      - "ROADMAP_1_9.md"
      - "README.md"
      - "assets/readme/progress-*.svg"
      - "CHANGELOG.d/1.9-run-session.md"
      - ".github/workflows/run-session-1-9.yml"
  workflow_dispatch:

concurrency:
  group: run-session-1-9-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  run-session:
    name: Run Session / Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install CPython 3.14 native build prerequisites
        if: matrix.python-version == '3.14'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run run-session, project and export regressions
        run: >-
          pytest
          tests/test_project_manifest_1_9.py
          tests/test_run_session_1_9.py
          tests/test_cli.py
          tests/test_exporting.py
          tests/test_progress_svg.py

      - name: Verify deterministic progress SVGs
        run: python tools/generate_progress_svg.py --check

      - name: Lint run-session and progress surfaces
        run: >-
          ruff check
          src/swirengine/project19.py
          src/swirengine/run_sessions19.py
          src/swirengine/cli.py
          tests/test_run_session_1_9.py
          tests/test_progress_svg.py
          tools/benchmark_run_session_1_9.py
          tools/generate_progress_svg.py

      - name: Compile run-session and progress surfaces
        run: >-
          python -m compileall -q
          src/swirengine/project19.py
          src/swirengine/run_sessions19.py
          src/swirengine/cli.py
          tests/test_run_session_1_9.py
          tests/test_progress_svg.py
          tools/benchmark_run_session_1_9.py
          tools/generate_progress_svg.py

      - name: Run deterministic development-session workload
        if: matrix.python-version == '3.13'
        run: python tools/benchmark_run_session_1_9.py
