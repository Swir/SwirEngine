name: Background Save 1.7

on:
  push:
    branches: ["feat/1.7-background-save"]
    paths:
      - "src/swirengine/background_save17.py"
      - "tests/test_background_save_1_7.py"
      - "tools/benchmark_background_save_1_7.py"
      - "examples/demo_background_save_1_7.py"
      - "docs/BACKGROUND_SAVE_1_7.md"
      - "CHANGELOG.d/1.7-background-save.md"
      - ".github/workflows/background-save-1-7.yml"
  pull_request:
    paths:
      - "src/swirengine/background_save17.py"
      - "tests/test_background_save_1_7.py"
      - "tools/benchmark_background_save_1_7.py"
      - "examples/demo_background_save_1_7.py"
      - "docs/BACKGROUND_SAVE_1_7.md"
      - "CHANGELOG.d/1.7-background-save.md"
      - ".github/workflows/background-save-1-7.yml"
  workflow_dispatch:

concurrency:
  group: background-save-1-7-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  background-save:
    name: Background Save / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install CPython 3.14 native build prerequisites
        if: matrix.python-version == '3.14'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run background-save and stable storage/job regressions
        run: >-
          pytest
          tests/test_background_save_1_7.py
          tests/test_save_profile_2_1_5.py
          tests/test_storage.py
          tests/test_background_jobs_1_7.py

      - name: Lint background save surfaces
        run: >-
          ruff check
          src/swirengine/background_save17.py
          tests/test_background_save_1_7.py
          tools/benchmark_background_save_1_7.py
          examples/demo_background_save_1_7.py

      - name: Compile background save surfaces
        run: >-
          python -m compileall -q
          src/swirengine/background_save17.py
          tests/test_background_save_1_7.py
          tools/benchmark_background_save_1_7.py
          examples/demo_background_save_1_7.py

      - name: Run deterministic background-save workload
        if: matrix.python-version == '3.13'
        run: python tools/benchmark_background_save_1_7.py

      - name: Run creator demo
        run: python examples/demo_background_save_1_7.py
