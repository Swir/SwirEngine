name: Neon Snake 3D Validation & Release

on:
  pull_request:
    paths:
      - "src/**"
      - "pyproject.toml"
      - "demo_projects/neon_snake_3d/**"
      - "tests/test_neon_snake_3d_project.py"
      - ".github/workflows/neon-snake-3d.yml"
  push:
    branches: ["main"]
    paths:
      - "demo_projects/neon_snake_3d/**"
      - "tests/test_neon_snake_3d_project.py"
      - ".github/workflows/neon-snake-3d.yml"

permissions:
  contents: write

jobs:
  smoke:
    name: Real OpenGL Snake smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Unit-test Snake project
        run: pytest tests/test_neon_snake_3d_project.py
      - name: Lint and compile Snake project
        run: |
          ruff check demo_projects/neon_snake_3d tests/test_neon_snake_3d_project.py
          python -m compileall -q demo_projects/neon_snake_3d
      - name: Install software OpenGL/Xvfb runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libgl-dev libegl-dev
      - name: Boot and render real Snake 3D game
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          SWIR_DEMO_SMOKE_FRAMES: "12"
        run: xvfb-run -a python demo_projects/neon_snake_3d/run_game.py

  bundle:
    name: Bundle Snake (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pyinstaller
      - name: Build one-file Snake demo
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile
          --collect-all glfw --collect-all glcontext
          --name NeonSnake3D demo_projects/neon_snake_3d/run_game.py
      - name: Probe packaged Windows runtime
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SWIR_DEMO_RUNTIME_PROBE: "1"
        run: |
          & .\dist\NeonSnake3D.exe
          if ($LASTEXITCODE -ne 0) {
            throw "Packaged Windows runtime probe failed with exit code $LASTEXITCODE"
          }
      - name: Give binary an OS-specific release name
        shell: python
        run: |
          import platform
          from pathlib import Path

          system = platform.system()
          suffix = ".exe" if system == "Windows" else ""
          source = Path("dist") / f"NeonSnake3D{suffix}"
          destination = Path("dist") / f"NeonSnake3D-{system}{suffix}"
          source.rename(destination)
          print(destination)
      - uses: actions/upload-artifact@v4
        with:
          name: neon-snake-${{ runner.os }}
          path: dist/NeonSnake3D-*
          if-no-files-found: error

  release:
    name: Publish Neon Snake 3D Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [smoke, bundle]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: neon-snake-*
          path: release-assets/binaries
          merge-multiple: true
      - name: Package standalone source project
        shell: python
        run: |
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          root = Path("demo_projects/neon_snake_3d")
          destination = Path("release-assets/NeonSnake3D-project.zip")
          destination.parent.mkdir(parents=True, exist_ok=True)
          with ZipFile(destination, "w", ZIP_DEFLATED) as archive:
              for path in sorted(root.rglob("*")):
                  if path.is_file() and "__pycache__" not in path.parts:
                      archive.write(path, Path("NeonSnake3D") / path.relative_to(root))
          print(destination)
      - name: Create or refresh Snake release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="demo-neon-snake-3d-v1.0.0"
          ASSETS=$(find release-assets -type f -print)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $ASSETS --clobber
          else
            gh release create "$TAG" $ASSETS \
              --target "$GITHUB_SHA" \
              --title "Neon Snake 3D v1.0.0" \
              --notes "Official 3D Snake demo built with SwirEngine. Includes the complete source project and one-file Windows, Linux, and macOS builds."
          fi
