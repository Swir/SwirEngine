name: Source Checkpoint 1.9

on:
  push:
    branches:
      - main
      - "feat/1.9-*"
    paths:
      - "src/swirengine/**"
      - "tests/**"
      - "examples/**"
      - "demo_projects/**"
      - "tools/**"
      - "docs/**"
      - "assets/readme/**"
      - "README.md"
      - "CHANGELOG.md"
      - "CHANGELOG.d/**"
      - "ROADMAP_1_4.md"
      - "ROADMAP_1_5.md"
      - "ROADMAP_1_6.md"
      - "ROADMAP_1_7.md"
      - "ROADMAP_1_8.md"
      - "ROADMAP_1_9.md"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"
      - ".github/workflows/source-checkpoint-1-6.yml"
      - ".github/workflows/source-checkpoint-1-7.yml"
      - ".github/workflows/source-checkpoint-1-8.yml"
      - ".github/workflows/source-checkpoint-1-9.yml"
      - ".github/workflows/real-game-production-1-9.yml"
      - ".github/workflows/desktop-shipping-1-9.yml"
  pull_request:
    paths:
      - "src/swirengine/**"
      - "tests/**"
      - "examples/**"
      - "demo_projects/**"
      - "tools/**"
      - "docs/**"
      - "assets/readme/**"
      - "README.md"
      - "CHANGELOG.md"
      - "CHANGELOG.d/**"
      - "ROADMAP_1_4.md"
      - "ROADMAP_1_5.md"
      - "ROADMAP_1_6.md"
      - "ROADMAP_1_7.md"
      - "ROADMAP_1_8.md"
      - "ROADMAP_1_9.md"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"
      - ".github/workflows/source-checkpoint-1-6.yml"
      - ".github/workflows/source-checkpoint-1-7.yml"
      - ".github/workflows/source-checkpoint-1-8.yml"
      - ".github/workflows/source-checkpoint-1-9.yml"
      - ".github/workflows/real-game-production-1-9.yml"
      - ".github/workflows/desktop-shipping-1-9.yml"
  workflow_dispatch:

concurrency:
  group: source-checkpoint-1-9-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    name: 1.9 contracts / Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - name: Install CPython 3.14 native build prerequisites
        if: matrix.python-version == '3.14'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libgl-dev libegl-dev
      - run: python -m pip install -e ".[dev]"
      - name: Audit checkpoint and locked prior contracts
        shell: bash
        run: |
          python tools/verify_1_9_source_checkpoint.py
          python tools/verify_1_8_source_checkpoint.py --require-complete
          python tools/generate_progress_svg.py --check
          if grep -Fq "Current verified progress: 10/10 milestones = 100.0%." ROADMAP_1_9.md; then
            python tools/verify_1_9_source_checkpoint.py --require-complete
          fi
      - name: Run complete 1.9 contract suite
        run: pytest -q tests/test_*_1_9.py
      - name: Full repository tests
        if: matrix.python-version == '3.13'
        run: pytest
      - name: Strict Ruff gate
        if: matrix.python-version == '3.13'
        run: ruff check src tests examples demo_projects tools
      - name: Compile repository surfaces
        if: matrix.python-version == '3.13'
        run: python -m compileall -q src tests examples demo_projects tools

  cross-platform-shipping:
    name: 1.9 shipping / ${{ matrix.os }} / Python 3.13
    needs: contract
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install test and build dependencies
        run: python -m pip install --upgrade pip build pyinstaller ".[dev]"
      - name: Validate deterministic representative-game staging
        env:
          PYGAME_HIDE_SUPPORT_PROMPT: "1"
        run: python tools/verify_real_game_production_1_9.py --staging-only
      - name: Run desktop shipping and exporter regressions
        run: python -m pytest -q tests/test_shipping_1_9.py tests/test_exporting.py
      - name: Build source wheel
        run: python -m build --wheel --outdir wheelhouse
      - name: Verify clean wheel install, host-native build, manifest and runtime
        run: python tools/verify_clean_desktop_shipping_1_9.py --wheelhouse wheelhouse

  clean-package:
    name: Build + metadata + clean-wheel checkpoint
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip build twine pyinstaller
      - run: python -m pip install -e ".[dev]"
      - name: Build source distributions
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check dist/*
      - name: Create clean wheelhouse
        run: python -m build --wheel --outdir wheelhouse
      - name: Verify clean wheel install, host-native package manifest and runtime
        run: python tools/verify_clean_desktop_shipping_1_9.py --wheelhouse wheelhouse
      - name: Probe representative staging against a clean wheel
        shell: bash
        run: |
          python -m venv .checkpoint19-venv
          .checkpoint19-venv/bin/python -m pip install --upgrade pip
          .checkpoint19-venv/bin/python -m pip install wheelhouse/*.whl
          PYGAME_HIDE_SUPPORT_PROMPT=1 .checkpoint19-venv/bin/python tools/verify_real_game_production_1_9.py --staging-only
