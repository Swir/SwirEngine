name: Editor Productivity 2.0 Validation

on:
  push:
    branches:
      - feat/1.5-editor-productivity
  pull_request:
    paths:
      - "src/swirengine/editor15.py"
      - "tests/test_editor_productivity_1_5.py"
      - "tools/benchmark_editor_productivity_1_5.py"
      - "examples/demo_editor_productivity_1_5.py"
      - "docs/EDITOR_PRODUCTIVITY_2_1_5.md"
      - "CHANGELOG.d/1.5-editor-productivity.md"
      - "ROADMAP_1_5.md"
      - ".github/workflows/editor-productivity-1-5.yml"

concurrency:
  group: editor-productivity-1-5-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  editor-productivity-contract:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - name: Install CPython 3.14 native build prerequisites
        if: matrix.python-version == '3.14'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev
      - run: python -m pip install -e ".[dev]"
      - name: Editor productivity tests
        run: pytest tests/test_editor_productivity_1_5.py
      - name: Stable prefab/editor regression tests
        run: >-
          pytest
          tests/test_prefab.py
          tests/test_editor_workflow.py
          tests/test_editor_authoring_1_4.py
          tests/test_editor_authoring_workspace_1_4.py
      - name: Strict Ruff gate
        run: >-
          ruff check
          src/swirengine/editor15.py
          tests/test_editor_productivity_1_5.py
          tools/benchmark_editor_productivity_1_5.py
          examples/demo_editor_productivity_1_5.py
      - name: Compile editor productivity files
        run: >-
          python -m compileall -q
          src/swirengine/editor15.py
          tests/test_editor_productivity_1_5.py
          tools/benchmark_editor_productivity_1_5.py
          examples/demo_editor_productivity_1_5.py
      - name: Editor productivity workload benchmark
        if: matrix.python-version == '3.13'
        run: python tools/benchmark_editor_productivity_1_5.py
      - name: Editor productivity demo
        run: python examples/demo_editor_productivity_1_5.py
