name: Editor Visual Scripting 2.2

on:
  pull_request:
    paths:
      - "src/swirengine/visual_scripting22.py"
      - "src/swirengine/editor_visual_scripting22.py"
      - "src/swirengine/editor_visual_scripting_frontend22.py"
      - "src/swirengine/editor_integrated_session21.py"
      - "src/swirengine/editor_asset_app21.py"
      - "tests/test_visual_scripting_2_2.py"
      - "tests/test_editor_visual_scripting_frontend_2_2.py"
      - "tests/test_editor_hub_2_1.py"
      - "README.md"
      - "ROADMAP_2_2.md"
      - "assets/readme/**"
      - "tools/generate_progress_svg.py"
      - ".github/workflows/editor-visual-scripting-2-2.yml"
  push:
    branches:
      - "feature/2.2-*"
    paths:
      - "src/swirengine/visual_scripting22.py"
      - "src/swirengine/editor_visual_scripting22.py"
      - "src/swirengine/editor_visual_scripting_frontend22.py"
      - "src/swirengine/editor_integrated_session21.py"
      - "src/swirengine/editor_asset_app21.py"
      - "tests/test_visual_scripting_2_2.py"
      - "tests/test_editor_visual_scripting_frontend_2_2.py"
      - "tests/test_editor_hub_2_1.py"
      - "README.md"
      - "ROADMAP_2_2.md"
      - "assets/readme/**"
      - "tools/generate_progress_svg.py"
      - ".github/workflows/editor-visual-scripting-2-2.yml"

permissions:
  contents: read

jobs:
  visual-scripting:
    name: Visual scripting / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development dependencies
        run: python -m pip install --upgrade pip ".[dev]"
      - name: Verify node graph runtime, editor integration and progress contract
        run: >-
          python -m pytest -q
          tests/test_visual_scripting_2_2.py
          tests/test_editor_visual_scripting_frontend_2_2.py
          tests/test_editor_hub_2_1.py
          tests/test_progress_svg.py
          tests/test_progress_2_1.py
      - name: Verify deterministic active progress
        run: python tools/generate_progress_svg.py --check
      - name: Strict Ruff gate
        run: >-
          python -m ruff check
          src/swirengine/visual_scripting22.py
          src/swirengine/editor_visual_scripting22.py
          src/swirengine/editor_visual_scripting_frontend22.py
          src/swirengine/editor_integrated_session21.py
          src/swirengine/editor_asset_app21.py
          tests/test_visual_scripting_2_2.py
          tests/test_editor_visual_scripting_frontend_2_2.py
      - name: Compile focused 2.2 tree
        run: >-
          python -m compileall -q
          src/swirengine/visual_scripting22.py
          src/swirengine/editor_visual_scripting22.py
          src/swirengine/editor_visual_scripting_frontend22.py
          src/swirengine/editor_integrated_session21.py
          src/swirengine/editor_asset_app21.py
          tests/test_visual_scripting_2_2.py
          tests/test_editor_visual_scripting_frontend_2_2.py
