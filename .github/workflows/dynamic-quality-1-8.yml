name: Dynamic Quality 1.8

on:
  push:
    branches: ["feat/1.8-dynamic-quality-budget"]
    paths:
      - "src/swirengine/render_quality18.py"
      - "tests/test_render_quality_1_8.py"
      - "tests/test_render_quality_hardening_1_8.py"
      - "tools/benchmark_dynamic_quality_1_8.py"
      - "examples/demo_dynamic_quality_1_8.py"
      - "docs/DYNAMIC_QUALITY_BUDGET_1_8.md"
      - "ROADMAP_1_8.md"
      - "CHANGELOG.d/1.8-dynamic-quality-budget.md"
      - ".github/workflows/dynamic-quality-1-8.yml"
  pull_request:
    paths:
      - "src/swirengine/render_quality18.py"
      - "tests/test_render_quality_1_8.py"
      - "tests/test_render_quality_hardening_1_8.py"
      - "tools/benchmark_dynamic_quality_1_8.py"
      - "examples/demo_dynamic_quality_1_8.py"
      - "docs/DYNAMIC_QUALITY_BUDGET_1_8.md"
      - "ROADMAP_1_8.md"
      - "CHANGELOG.d/1.8-dynamic-quality-budget.md"
      - ".github/workflows/dynamic-quality-1-8.yml"
  workflow_dispatch:

concurrency:
  group: dynamic-quality-1-8-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dynamic-quality:
    name: Dynamic Quality / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install CPython 3.14 native build prerequisites
        if: matrix.python-version == '3.14'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run dynamic-quality and timing regressions
        run: >-
          pytest
          tests/test_render_quality_1_8.py
          tests/test_render_quality_hardening_1_8.py
          tests/test_render_timing_1_8.py
          tests/test_performance_diagnostics_1_5.py
          tests/test_frame_budget_1_7.py
          tests/test_visibility_lod_1_8.py
          tests/test_render_submission_1_8.py
          tests/test_accelerated_renderer2_1_4.py

      - name: Lint dynamic-quality surfaces
        run: >-
          ruff check
          src/swirengine/render_quality18.py
          tests/test_render_quality_1_8.py
          tests/test_render_quality_hardening_1_8.py
          tools/benchmark_dynamic_quality_1_8.py
          examples/demo_dynamic_quality_1_8.py

      - name: Compile dynamic-quality surfaces
        run: >-
          python -m compileall -q
          src/swirengine/render_quality18.py
          tests/test_render_quality_1_8.py
          tests/test_render_quality_hardening_1_8.py
          tools/benchmark_dynamic_quality_1_8.py
          examples/demo_dynamic_quality_1_8.py

      - name: Run deterministic dynamic-quality workload
        if: matrix.python-version == '3.13'
        run: python tools/benchmark_dynamic_quality_1_8.py

      - name: Run creator demo
        run: python examples/demo_dynamic_quality_1_8.py
