name: Deterministic Replay 1.5 Validation

on:
  push:
    branches:
      - feat/1.5-deterministic-replay
  pull_request:
    paths:
      - "src/swirengine/simulation15.py"
      - "tests/test_deterministic_replay_1_5.py"
      - "tools/benchmark_deterministic_replay_1_5.py"
      - "examples/demo_deterministic_replay_1_5.py"
      - "docs/DETERMINISTIC_REPLAY_1_5.md"
      - "ROADMAP_1_5.md"
      - ".github/workflows/deterministic-replay-1-5.yml"

jobs:
  deterministic-replay-contract:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - name: Install CPython 3.14 native build prerequisites
        if: matrix.python-version == '3.14'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev
      - run: python -m pip install -e ".[dev]"
      - name: Deterministic replay tests
        run: pytest tests/test_deterministic_replay_1_5.py
      - name: Strict Ruff gate
        run: >-
          ruff check
          src/swirengine/simulation15.py
          tests/test_deterministic_replay_1_5.py
          tools/benchmark_deterministic_replay_1_5.py
          examples/demo_deterministic_replay_1_5.py
      - name: Compile deterministic replay files
        run: >-
          python -m compileall -q
          src/swirengine/simulation15.py
          tests/test_deterministic_replay_1_5.py
          tools/benchmark_deterministic_replay_1_5.py
          examples/demo_deterministic_replay_1_5.py
      - name: Deterministic replay workload benchmark
        if: matrix.python-version == '3.13'
        run: python tools/benchmark_deterministic_replay_1_5.py
      - name: Deterministic replay demo
        run: python examples/demo_deterministic_replay_1_5.py
