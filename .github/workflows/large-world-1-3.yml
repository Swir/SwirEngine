name: Large World 1.3 Validation

on:
  pull_request:
    paths:
      - "src/swirengine/large_world.py"
      - "src/swirengine/asset_streaming.py"
      - "src/swirengine/core/scene.py"
      - "tests/test_large_world.py"
      - "tests/test_large_world_provider_cache.py"
      - "tests/test_asset_streaming.py"
      - "tests/test_scene_ecs_ergonomics.py"
      - "examples/demo_large_world_streaming.py"
      - "tools/benchmark_large_world.py"
      - "docs/LARGE_WORLD_STREAMING_1_3.md"
      - "CHANGELOG.d/1.3.0-large-world-streaming.md"
      - "ROADMAP_1_3.md"
      - "README.md"
      - ".github/workflows/large-world-1-3.yml"
  push:
    branches: ["main"]
    paths:
      - "src/swirengine/large_world.py"
      - "src/swirengine/asset_streaming.py"
      - "src/swirengine/core/scene.py"
      - "tests/test_large_world.py"
      - "tests/test_large_world_provider_cache.py"
      - "tests/test_asset_streaming.py"
      - "tests/test_scene_ecs_ergonomics.py"
      - "examples/demo_large_world_streaming.py"
      - "tools/benchmark_large_world.py"
      - "docs/LARGE_WORLD_STREAMING_1_3.md"
      - "CHANGELOG.d/1.3.0-large-world-streaming.md"
      - "ROADMAP_1_3.md"
      - "README.md"
      - ".github/workflows/large-world-1-3.yml"

permissions:
  contents: read

jobs:
  contract:
    name: Large-world runtime contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest tests/test_large_world.py tests/test_large_world_provider_cache.py tests/test_asset_streaming.py tests/test_scene_ecs_ergonomics.py
      - run: ruff check src/swirengine/large_world.py tests/test_large_world.py tests/test_large_world_provider_cache.py examples/demo_large_world_streaming.py tools/benchmark_large_world.py
      - run: python -m compileall -q src/swirengine/large_world.py tests/test_large_world_provider_cache.py examples/demo_large_world_streaming.py tools/benchmark_large_world.py
      - run: python tools/benchmark_large_world.py
      - run: python examples/demo_large_world_streaming.py
