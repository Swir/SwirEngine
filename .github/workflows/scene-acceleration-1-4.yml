name: Scene Acceleration 1.4 Validation

on:
  pull_request:
    paths:
      - "src/swirengine/__init__.py"
      - "src/swirengine/scene_visibility.py"
      - "src/swirengine/scene_acceleration.py"
      - "src/swirengine/graphics/accelerated_renderer2.py"
      - "src/swirengine/graphics/hiz.py"
      - "src/swirengine/graphics/hiz_gpu.py"
      - "src/swirengine/graphics/primitives.py"
      - "src/swirengine/graphics/mesh.py"
      - "tests/test_scene_visibility_1_4.py"
      - "tests/test_scene_acceleration_1_4.py"
      - "tests/test_accelerated_renderer2_1_4.py"
      - "tests/test_hiz_1_4.py"
      - "tools/benchmark_scene_visibility_1_4.py"
      - "tools/smoke_scene_acceleration_gl.py"
      - "examples/demo_scene_acceleration_1_4.py"
      - "docs/SCENE_ACCELERATION_OCCLUSION_1_4.md"
      - "ROADMAP_1_4.md"
      - ".github/workflows/scene-acceleration-1-4.yml"
  push:
    branches:
      - "feat/1.4-scene-acceleration-occlusion"
    paths:
      - "src/swirengine/__init__.py"
      - "src/swirengine/scene_visibility.py"
      - "src/swirengine/scene_acceleration.py"
      - "src/swirengine/graphics/accelerated_renderer2.py"
      - "src/swirengine/graphics/hiz.py"
      - "src/swirengine/graphics/hiz_gpu.py"
      - "src/swirengine/graphics/primitives.py"
      - "src/swirengine/graphics/mesh.py"
      - "tests/test_scene_visibility_1_4.py"
      - "tests/test_scene_acceleration_1_4.py"
      - "tests/test_accelerated_renderer2_1_4.py"
      - "tests/test_hiz_1_4.py"
      - "tools/benchmark_scene_visibility_1_4.py"
      - "tools/smoke_scene_acceleration_gl.py"
      - "examples/demo_scene_acceleration_1_4.py"
      - "docs/SCENE_ACCELERATION_OCCLUSION_1_4.md"
      - "ROADMAP_1_4.md"
      - ".github/workflows/scene-acceleration-1-4.yml"

jobs:
  scene-acceleration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install Mesa EGL runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1-mesa-dev libgl1-mesa-dri libglx-mesa0 mesa-utils
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Scene acceleration regressions
        run: >-
          pytest -q tests/test_scene_visibility_1_4.py
          tests/test_scene_acceleration_1_4.py
          tests/test_accelerated_renderer2_1_4.py
          tests/test_hiz_1_4.py
      - name: Deterministic 16k visibility-work gate
        run: >-
          python tools/benchmark_scene_visibility_1_4.py
          --side 128 --queries 150 --max-leaf-tests 256
      - name: Real EGL/OpenGL 3.3 Hi-Z smoke
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          MESA_GL_VERSION_OVERRIDE: "3.3"
        run: python tools/smoke_scene_acceleration_gl.py
      - name: Integration demo
        run: python examples/demo_scene_acceleration_1_4.py
      - name: Strict lint
        run: >-
          ruff check src/swirengine/__init__.py src/swirengine/scene_visibility.py
          src/swirengine/scene_acceleration.py src/swirengine/graphics/accelerated_renderer2.py
          src/swirengine/graphics/hiz.py src/swirengine/graphics/hiz_gpu.py
          src/swirengine/graphics/primitives.py src/swirengine/graphics/mesh.py
          tests/test_scene_visibility_1_4.py tests/test_scene_acceleration_1_4.py
          tests/test_accelerated_renderer2_1_4.py tests/test_hiz_1_4.py
          tools/benchmark_scene_visibility_1_4.py tools/smoke_scene_acceleration_gl.py
          examples/demo_scene_acceleration_1_4.py
      - name: Compile scene-acceleration path
        run: >-
          python -m compileall -q src/swirengine/__init__.py src/swirengine/scene_visibility.py
          src/swirengine/scene_acceleration.py src/swirengine/graphics/accelerated_renderer2.py
          src/swirengine/graphics/hiz.py src/swirengine/graphics/hiz_gpu.py
          src/swirengine/graphics/primitives.py src/swirengine/graphics/mesh.py
          tests/test_scene_visibility_1_4.py tests/test_scene_acceleration_1_4.py
          tests/test_accelerated_renderer2_1_4.py tests/test_hiz_1_4.py
          tools/benchmark_scene_visibility_1_4.py tools/smoke_scene_acceleration_gl.py
          examples/demo_scene_acceleration_1_4.py
