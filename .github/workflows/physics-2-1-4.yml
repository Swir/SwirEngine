name: Physics 2.0 1.4 Validation

on:
  push:
    branches:
      - "feat/1.4-physics-2"
    paths:
      - "src/swirengine/physics/**"
      - "tests/test_physics2_1_4.py"
      - "tests/test_collision3d.py"
      - "tests/test_rigidbody3d.py"
      - "tools/benchmark_physics2_1_4.py"
      - "examples/demo_physics2_contacts.py"
      - "docs/PHYSICS_2_1_4.md"
      - "ROADMAP_1_4.md"
      - ".github/workflows/physics-2-1-4.yml"
  pull_request:
    paths:
      - "src/swirengine/physics/**"
      - "tests/test_physics2_1_4.py"
      - "tests/test_collision3d.py"
      - "tests/test_rigidbody3d.py"
      - "tools/benchmark_physics2_1_4.py"
      - "examples/demo_physics2_contacts.py"
      - "docs/PHYSICS_2_1_4.md"
      - "ROADMAP_1_4.md"
      - ".github/workflows/physics-2-1-4.yml"

jobs:
  physics-2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Physics 2.0 and compatibility regressions
        run: pytest -q tests/test_physics2_1_4.py tests/test_collision3d.py tests/test_rigidbody3d.py
      - name: Deterministic broadphase and CCD gate
        run: python tools/benchmark_physics2_1_4.py --static-bodies 2000 --frames 120
      - name: Physics 2.0 integration demo
        run: python examples/demo_physics2_contacts.py
      - name: Strict lint
        run: >-
          ruff check src/swirengine/physics/dynamics3d.py src/swirengine/physics/__init__.py
          tests/test_physics2_1_4.py tools/benchmark_physics2_1_4.py examples/demo_physics2_contacts.py
      - name: Compile Physics 2.0 path
        run: >-
          python -m compileall -q src/swirengine/physics tests/test_physics2_1_4.py
          tools/benchmark_physics2_1_4.py examples/demo_physics2_contacts.py
