name: SwirEngine 2.1 Release Candidate Gate

on:
  push:
    branches:
      - "release/**"
      - "!release/2.1.0-publication"
    paths:
      - "pyproject.toml"
      - "README.md"
      - "ROADMAP_2_1.md"
      - "RELEASE_NOTES_2_1.md"
      - "docs/RELEASE_GATE_2_1.md"
      - "tools/verify_2_1_release_candidate.py"
      - "tools/verify_2_1_release_readiness.py"
      - "tools/verify_clean_wheel_2_0.py"
      - "tools/build_vendored_wheel.py"
      - "tools/release_evidence_2_1.py"
      - "tests/test_verify_2_1_release_candidate.py"
      - "tests/test_release_evidence_2_1.py"
      - ".github/workflows/release-candidate-2.1.yml"
      - "src/**"
      - "demo_projects/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-contract:
    name: Candidate contract and source readiness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install verification dependencies
        run: python -m pip install --upgrade pip "pytest>=8,<10" "ruff>=0.16,<0.17" "build>=1.2,<2"
      - name: Verify candidate publication contract
        run: python tools/verify_2_1_release_candidate.py
      - name: Verify accepted 2.1 source readiness
        run: python tools/verify_2_1_release_readiness.py
      - name: Test candidate and release-evidence regressions
        run: >-
          python -m pytest -q
          tests/test_verify_2_1_release_candidate.py
          tests/test_release_evidence_2_1.py
      - name: Lint candidate verifier, evidence tooling and tests
        run: >-
          python -m ruff check
          tools/verify_2_1_release_candidate.py
          tools/release_evidence_2_1.py
          tests/test_verify_2_1_release_candidate.py
          tests/test_release_evidence_2_1.py
      - name: Build exact-source wheel and sdist
        run: python -m build
      - name: Verify artifact set
        run: >-
          python -c "from pathlib import Path; files=list(Path('dist').iterdir());
          assert len(list(Path('dist').glob('*.whl'))) == 1;
          assert len(list(Path('dist').glob('*.tar.gz'))) == 1;
          print('\n'.join(str(p) for p in sorted(files)))"
      - name: Preserve candidate artifacts for inspection
        uses: actions/upload-artifact@v4
        with:
          name: swirengine-2.1.0-candidate
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  clean-install-matrix:
    name: Clean install ${{ matrix.os }} / CPython ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Linux CPython 3.14 native build prerequisites
        if: runner.os == 'Linux' && matrix.python-version == '3.14'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libgl-dev libegl-dev
      - name: Install candidate build tooling
        run: python -m pip install --upgrade pip setuptools wheel "build>=1.2,<2"
      - name: Build Windows CPython 3.14 renderer-native dependencies
        if: runner.os == 'Windows' && matrix.python-version == '3.14'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force native-wheels | Out-Null
          python -m pip wheel --no-deps --no-binary=:all: moderngl==5.12.0 -w native-wheels
          python -m pip wheel --no-deps --no-binary=:all: glcontext==3.0.0 -w native-wheels
          $native = Get-ChildItem native-wheels\*.whl | ForEach-Object { $_.FullName }
          python -m pip install $native
      - name: Build standard candidate wheel
        if: runner.os != 'Windows' || matrix.python-version != '3.14'
        run: python -m build --wheel --outdir dist
      - name: Build Windows CPython 3.14 vendored candidate wheel
        if: runner.os == 'Windows' && matrix.python-version == '3.14'
        shell: pwsh
        run: |
          python -m build --wheel --outdir dist-base
          $base = (Get-ChildItem dist-base\swirengine-*.whl).FullName
          $moderngl = (Get-ChildItem native-wheels\moderngl-*.whl).FullName
          $glcontext = (Get-ChildItem native-wheels\glcontext-*.whl).FullName
          python tools/build_vendored_wheel.py --base $base --vendor $moderngl --vendor $glcontext --tag cp314-cp314-win_amd64 --output-dir dist
      - name: Verify exact wheel in clean environment and CLI
        if: runner.os != 'Windows' || matrix.python-version != '3.14'
        run: >-
          python tools/verify_clean_wheel_2_0.py
          --wheel-dir dist
          --expected-system "${{ runner.os }}"
          --expected-python "${{ matrix.python-version }}"
          --verify-cli21
      - name: Verify Windows CPython 3.14 vendored candidate wheel and CLI
        if: runner.os == 'Windows' && matrix.python-version == '3.14'
        run: >-
          python tools/verify_clean_wheel_2_0.py
          --wheel-dir dist
          --expected-system Windows
          --expected-python 3.14
          --require-vendored-native
          --verify-cli21
      - name: Preserve Windows CPython 3.14 candidate wheel
        if: runner.os == 'Windows' && matrix.python-version == '3.14'
        uses: actions/upload-artifact@v4
        with:
          name: swirengine-2.1.0-candidate-win-cp314
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7

  non-publishing-safety:
    name: Non-publishing safety lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Confirm candidate workflow cannot publish
        run: python tools/verify_2_1_release_candidate.py

  release-evidence:
    name: Deterministic checksums and candidate provenance
    needs: [candidate-contract, clean-install-matrix, non-publishing-safety]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Download portable candidate wheel and sdist
        uses: actions/download-artifact@v4
        with:
          name: swirengine-2.1.0-candidate
          path: dist
      - name: Download Windows CPython 3.14 candidate wheel
        uses: actions/download-artifact@v4
        with:
          name: swirengine-2.1.0-candidate-win-cp314
          path: dist
      - name: Generate deterministic SHA256SUMS and release-provenance.json
        run: >-
          python tools/release_evidence_2_1.py generate
          --dist-dir dist
          --source-sha "${GITHUB_SHA}"
          --require-windows-cp314
      - name: Verify exact-head release evidence
        run: >-
          python tools/release_evidence_2_1.py verify
          --dist-dir dist
          --source-sha "${GITHUB_SHA}"
          --require-windows-cp314
      - name: Preserve exact-head candidate release evidence
        uses: actions/upload-artifact@v4
        with:
          name: swirengine-2.1.0-release-evidence
          path: dist/*
          if-no-files-found: error
          retention-days: 7
