name: Gameplay Framework 1.3 Validation

on:
  pull_request:
    paths:
      - "src/swirengine/gameplay.py"
      - "tests/test_gameplay_framework.py"
      - "examples/demo_gameplay_framework.py"
      - "tools/benchmark_gameplay_framework.py"
      - "docs/ADVANCED_GAMEPLAY_FRAMEWORK_1_3.md"
      - "CHANGELOG.d/1.3.0-advanced-gameplay-framework.md"
      - "ROADMAP_1_3.md"
      - "README.md"
      - ".github/workflows/gameplay-framework-1-3.yml"
  push:
    branches: ["main"]
    paths:
      - "src/swirengine/gameplay.py"
      - "tests/test_gameplay_framework.py"
      - "examples/demo_gameplay_framework.py"
      - "tools/benchmark_gameplay_framework.py"
      - "docs/ADVANCED_GAMEPLAY_FRAMEWORK_1_3.md"
      - "CHANGELOG.d/1.3.0-advanced-gameplay-framework.md"
      - "ROADMAP_1_3.md"
      - "README.md"
      - ".github/workflows/gameplay-framework-1-3.yml"

permissions:
  contents: read

jobs:
  contract:
    name: Gameplay scheduler/pool contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest tests/test_gameplay_framework.py
      - run: ruff check src/swirengine/gameplay.py tests/test_gameplay_framework.py examples/demo_gameplay_framework.py tools/benchmark_gameplay_framework.py
      - run: python -m compileall -q src/swirengine/gameplay.py tests/test_gameplay_framework.py examples/demo_gameplay_framework.py tools/benchmark_gameplay_framework.py
      - run: python tools/benchmark_gameplay_framework.py
      - run: python examples/demo_gameplay_framework.py
