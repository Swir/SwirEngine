name: Editor Gameplay Milestone 8 Acceptance

on:
  pull_request:
    paths:
      - "src/swirengine/editor_gameplay_tooling21.py"
      - "src/swirengine/editor_animation_tooling21.py"
      - "src/swirengine/editor_physics_tooling21.py"
      - "src/swirengine/editor_navigation_tooling21.py"
      - "src/swirengine/editor_audio_tooling21.py"
      - "src/swirengine/editor_ui_tooling21.py"
      - "src/swirengine/editor_save_profile_tooling21.py"
      - "src/swirengine/editor_integrated_session21.py"
      - "tests/test_editor_milestone_8_acceptance_2_1.py"
      - "tests/test_editor_gameplay_tooling_2_1.py"
      - "tests/test_editor_animation_tooling_2_1.py"
      - "tests/test_editor_physics_tooling_2_1.py"
      - "tests/test_editor_navigation_tooling_2_1.py"
      - "tests/test_editor_audio_tooling_2_1.py"
      - "tests/test_editor_ui_hud_tooling_2_1.py"
      - "tests/test_editor_save_profile_tooling_2_1.py"
      - "tests/test_progress_svg.py"
      - "tools/generate_progress_svg.py"
      - "README.md"
      - "ROADMAP_2_1.md"
      - ".github/workflows/editor-gameplay-milestone-8-acceptance.yml"
  push:
    branches:
      - "feature/2.1-milestone-8-acceptance"

permissions:
  contents: read

jobs:
  acceptance:
    name: Milestone 8 acceptance / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install CPython 3.14 native build prerequisites
        if: matrix.python-version == '3.14'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run composed Milestone 8 acceptance witness
        run: pytest -q tests/test_editor_milestone_8_acceptance_2_1.py
      - name: Run gameplay tooling regression families
        run: >-
          pytest -q
          tests/test_editor_gameplay_tooling_2_1.py
          tests/test_editor_animation_tooling_2_1.py
          tests/test_editor_physics_tooling_2_1.py
          tests/test_editor_navigation_tooling_2_1.py
          tests/test_editor_audio_tooling_2_1.py
          tests/test_editor_ui_hud_tooling_2_1.py
          tests/test_editor_save_profile_tooling_2_1.py
      - name: Verify PyPI progress presentation contract
        run: >-
          pytest -q tests/test_progress_svg.py &&
          python tools/generate_progress_svg.py --check
      - name: Strict Ruff gate
        run: ruff check tests/test_editor_milestone_8_acceptance_2_1.py
      - name: Compile acceptance witness
        run: python -m compileall -q tests/test_editor_milestone_8_acceptance_2_1.py
