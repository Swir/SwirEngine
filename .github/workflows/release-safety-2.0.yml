name: Release Safety 2.0

on:
  push:
    branches: [main]
    paths:
      - "src/swirengine/release_safety20.py"
      - "src/swirengine/diagnostics19.py"
      - "src/swirengine/exporting.py"
      - "src/swirengine/content_build19.py"
      - "src/swirengine/scene_packages19.py"
      - "tests/test_release_safety_2_0.py"
      - "tests/test_runtime_diagnostics_1_9.py"
      - "tests/test_exporting.py"
      - "tools/verify_release_safety_2_0.py"
      - "docs/RELEASE_SAFETY_2_0.md"
      - ".github/workflows/release-safety-2.0.yml"
  pull_request:
    paths:
      - "src/swirengine/release_safety20.py"
      - "src/swirengine/diagnostics19.py"
      - "src/swirengine/exporting.py"
      - "src/swirengine/content_build19.py"
      - "src/swirengine/scene_packages19.py"
      - "tests/test_release_safety_2_0.py"
      - "tests/test_runtime_diagnostics_1_9.py"
      - "tests/test_exporting.py"
      - "tools/verify_release_safety_2_0.py"
      - "docs/RELEASE_SAFETY_2_0.md"
      - ".github/workflows/release-safety-2.0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-safety:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CPython 3.14 native build prerequisites
        if: matrix.python-version == '3.14'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libgl-dev libegl-dev
      - name: Install engine and development tools
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Run release-safety regression suite
        run: >-
          python -m pytest -q
          tests/test_release_safety_2_0.py
          tests/test_runtime_diagnostics_1_9.py
          tests/test_exporting.py
      - name: Run deterministic release-safety verifier
        run: python tools/verify_release_safety_2_0.py
      - name: Strict Ruff gate
        run: >-
          python -m ruff check
          src/swirengine/release_safety20.py
          tests/test_release_safety_2_0.py
          tools/verify_release_safety_2_0.py
      - name: Compile release-safety surfaces
        run: >-
          python -m compileall -q
          src/swirengine/release_safety20.py
          tests/test_release_safety_2_0.py
          tools/verify_release_safety_2_0.py
