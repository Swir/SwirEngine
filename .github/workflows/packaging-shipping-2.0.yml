name: Packaging Shipping 2.0

on:
  push:
    branches: [main]
    paths:
      - "ROADMAP_2_0.md"
      - "README.md"
      - "assets/readme/progress-*.svg"
      - "pyproject.toml"
      - "src/swirengine/desktop_shipping19.py"
      - "src/swirengine/exporting.py"
      - "tools/generate_progress_svg.py"
      - "tools/verify_clean_desktop_shipping_1_9.py"
      - "tools/verify_packaging_shipping_2_0.py"
      - "tests/test_packaging_shipping_2_0.py"
      - "tests/test_progress_svg.py"
      - "docs/PACKAGING_SHIPPING_2_0.md"
      - ".github/workflows/packaging-shipping-2.0.yml"
  pull_request:
    paths:
      - "ROADMAP_2_0.md"
      - "README.md"
      - "assets/readme/progress-*.svg"
      - "pyproject.toml"
      - "src/swirengine/desktop_shipping19.py"
      - "src/swirengine/exporting.py"
      - "tools/generate_progress_svg.py"
      - "tools/verify_clean_desktop_shipping_1_9.py"
      - "tools/verify_packaging_shipping_2_0.py"
      - "tests/test_packaging_shipping_2_0.py"
      - "tests/test_progress_svg.py"
      - "docs/PACKAGING_SHIPPING_2_0.md"
      - ".github/workflows/packaging-shipping-2.0.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packaging-shipping-2.0-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  clean-artifacts-and-native-shipping:
    name: ${{ matrix.os }} / Python 3.13
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install source verification tooling
        run: python -m pip install --upgrade pip build twine ".[dev]"

      - name: Run focused packaging and progress contract tests
        run: >-
          python -m pytest -q
          tests/test_packaging_shipping_2_0.py
          tests/test_progress_svg.py

      - name: Verify generated progress assets
        run: python tools/generate_progress_svg.py --check

      - name: Build exact-source wheel and sdist
        run: python -m build --wheel --sdist --outdir dist

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Verify isolated wheel and sdist installs
        run: >-
          python tools/verify_packaging_shipping_2_0.py
          --dist-dir dist
          --expected-system "${{ runner.os }}"
          --expected-python 3.13

      - name: Build and execute a host-native package from the clean wheel
        run: python tools/verify_clean_desktop_shipping_1_9.py --wheelhouse dist

      - name: Strict Ruff gate
        run: >-
          python -m ruff check
          tools/verify_packaging_shipping_2_0.py
          tests/test_packaging_shipping_2_0.py
          tools/generate_progress_svg.py
          tests/test_progress_svg.py

      - name: Compile packaging verification surfaces
        run: >-
          python -m compileall -q
          tools/verify_packaging_shipping_2_0.py
          tests/test_packaging_shipping_2_0.py
          tools/generate_progress_svg.py
          tests/test_progress_svg.py
