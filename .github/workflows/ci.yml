name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest
      - run: ruff check src tests examples demo_projects tools
      - run: python -m compileall -q src examples demo_projects tools
      - name: Verify locked 1.3 compatibility contract
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: python tools/verify_1_3_release_candidate.py
      - name: Verify locked 1.4 compatibility contract
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: python tools/verify_1_4_release_candidate.py --require-complete
      - name: Verify complete 1.5 release contract
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: python tools/verify_1_5_release_candidate.py --require-complete
      - name: Run complete 1.4 headless integration probe
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        env:
          SWIR_1_4_HEADLESS_PROBE: "1"
        run: python demo_projects/neon_frontier_1_4/run_game.py
      - name: Enforce 1.4 integrated showcase performance budget
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: python tools/benchmark_showcase_1_4.py --rounds 3 --budget-ms 2500
      - name: Verify static 3D batching CPU frame-preparation win
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: python tools/benchmark_static_3d_batch.py --cubes 1000 --rounds 9 --frames 30 --assert-win
      - name: Verify async asset preload wait reduction
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: python tools/benchmark_asset_preload.py --assets 16 --delay-ms 10 --workers 4 --assert-win

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Install built wheel in clean virtual environment
        shell: bash
        run: |
          python -m venv .release-venv
          .release-venv/bin/python -m pip install --upgrade pip
          .release-venv/bin/python -m pip install dist/*.whl
          .release-venv/bin/python -c "import tomllib, swirengine; expected=tomllib.load(open('pyproject.toml','rb'))['project']['version']; assert swirengine.__version__ == expected; print(swirengine.__version__)"
      - name: Run locked 1.4 showcase against the clean installed wheel
        shell: bash
        run: SWIR_1_4_HEADLESS_PROBE=1 .release-venv/bin/python demo_projects/neon_frontier_1_4/run_game.py
      - name: Run 1.5 source showcases against the clean installed wheel
        shell: bash
        run: |
          SWIR_GAME_DEMO_HEADLESS=1 .release-venv/bin/python examples/2d_game_demo/run_game.py
          SWIR_GAME_DEMO_HEADLESS=1 .release-venv/bin/python examples/3d_game_demo/run_game.py

  package-windows-cp314:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install build tooling
        run: python -m pip install --upgrade pip setuptools wheel build twine
      - name: Build base SwirEngine wheel
        run: python -m build --wheel --outdir dist-base
      - name: Build native renderer dependencies
        run: |
          python -m pip wheel --no-deps --no-binary=:all: moderngl==5.12.0 -w native-wheels
          python -m pip wheel --no-deps --no-binary=:all: glcontext==3.0.0 -w native-wheels
      - name: Build CPython 3.14 Windows platform wheel
        shell: pwsh
        run: |
          $base = (Get-ChildItem dist-base\swirengine-*.whl).FullName
          $moderngl = (Get-ChildItem native-wheels\moderngl-*.whl).FullName
          $glcontext = (Get-ChildItem native-wheels\glcontext-*.whl).FullName
          python tools/build_vendored_wheel.py --base $base --vendor $moderngl --vendor $glcontext --tag cp314-cp314-win_amd64 --output-dir dist
          Copy-Item $base dist\
      - name: Check both candidate wheel metadata files
        run: python -m twine check dist/*.whl
      - name: Prove pip selects the native wheel from normal candidates
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          python -m venv .verify314
          .\.verify314\Scripts\python.exe -m pip install --upgrade pip
          .\.verify314\Scripts\python.exe -m pip install --find-links dist "swirengine==$version"
          .\.verify314\Scripts\python.exe -c "import sys, swirengine, moderngl, glcontext; assert sys.version_info[:2] == (3, 14); assert swirengine.__version__ == '$version'; assert '_vendor_native' in moderngl.__file__; assert '_vendor_native' in glcontext.__file__; print(sys.version); print(moderngl.__file__); print(glcontext.__file__)"
          $env:SWIR_GAME_DEMO_HEADLESS = '1'
          .\.verify314\Scripts\python.exe examples/2d_game_demo/run_game.py
          .\.verify314\Scripts\python.exe examples/3d_game_demo/run_game.py
      - uses: actions/upload-artifact@v4
        with:
          name: swirengine-cp314-windows-wheel
          path: dist/*cp314*.whl
          if-no-files-found: error
