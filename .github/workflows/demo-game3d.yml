name: Demo Game 3D Validation & Release

on:
  pull_request:
    paths:
      - "src/**"
      - "pyproject.toml"
      - "demo_projects/neon_cube_hunt_3d/**"
      - "tests/test_demo_game3d_project.py"
      - ".github/workflows/demo-game3d.yml"
  push:
    branches: ["main"]
    paths:
      - "demo_projects/neon_cube_hunt_3d/**"
      - "tests/test_demo_game3d_project.py"
      - ".github/workflows/demo-game3d.yml"

permissions:
  contents: write

jobs:
  smoke:
    name: Real OpenGL demo smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Unit-test demo project
        run: pytest tests/test_demo_game3d_project.py
      - name: Lint and compile demo project
        run: |
          ruff check demo_projects/neon_cube_hunt_3d tests/test_demo_game3d_project.py
          python -m compileall -q demo_projects/neon_cube_hunt_3d
      - name: Install software OpenGL/Xvfb runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libgl-dev libegl-dev
      - name: Boot and render real 3D game
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          SWIR_DEMO_SMOKE_FRAMES: "12"
        run: xvfb-run -a python demo_projects/neon_cube_hunt_3d/run_game.py

  bundle:
    name: Bundle demo (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pyinstaller
      - name: Build one-file demo
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile
          --name NeonCubeHunt3D demo_projects/neon_cube_hunt_3d/run_game.py
      - name: Give binary an OS-specific release name
        shell: python
        run: |
          import platform
          from pathlib import Path

          system = platform.system()
          suffix = ".exe" if system == "Windows" else ""
          source = Path("dist") / f"NeonCubeHunt3D{suffix}"
          destination = Path("dist") / f"NeonCubeHunt3D-{system}{suffix}"
          source.rename(destination)
          print(destination)
      - uses: actions/upload-artifact@v4
        with:
          name: neon-cube-hunt-${{ runner.os }}
          path: dist/NeonCubeHunt3D-*
          if-no-files-found: error

  engine-release:
    name: Publish SwirEngine 1.0 GitHub Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Create or refresh engine release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          TAG="v${VERSION}"
          ENGINE_COMMIT=$(git log --grep="^release: SwirEngine ${VERSION}$" -1 --format=%H)
          if [ -z "$ENGINE_COMMIT" ]; then
            echo "Could not find the stable release commit for ${VERSION}" >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --target "$ENGINE_COMMIT" \
              --title "SwirEngine ${VERSION}" \
              --notes "Stable SwirEngine ${VERSION} release. Includes verified wheel and source distribution."
          fi

  demo-release:
    name: Publish Neon Cube Hunt 3D Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [smoke, bundle]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: neon-cube-hunt-*
          path: release-assets/binaries
          merge-multiple: true
      - name: Package standalone source project
        shell: python
        run: |
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          root = Path("demo_projects/neon_cube_hunt_3d")
          destination = Path("release-assets/NeonCubeHunt3D-project.zip")
          destination.parent.mkdir(parents=True, exist_ok=True)
          with ZipFile(destination, "w", ZIP_DEFLATED) as archive:
              for path in sorted(root.rglob("*")):
                  if path.is_file() and "__pycache__" not in path.parts:
                      archive.write(path, Path("NeonCubeHunt3D") / path.relative_to(root))
          print(destination)
      - name: Create or refresh demo release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="demo-neon-cube-hunt-3d-v1.0.0"
          ASSETS=$(find release-assets -type f -print)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $ASSETS --clobber
          else
            gh release create "$TAG" $ASSETS \
              --target "$GITHUB_SHA" \
              --title "Neon Cube Hunt 3D v1.0.0" \
              --notes "Official SwirEngine 1.0 validation game. Includes the complete source project and one-file Windows, Linux, and macOS builds."
          fi
