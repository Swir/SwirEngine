name: Demo Game 3D Validation

on:
  pull_request:
    paths:
      - "src/**"
      - "pyproject.toml"
      - "ROADMAP_1_1.md"
      - "demo_projects/neon_cube_hunt_3d/**"
      - "tests/test_demo_game3d_project.py"
      - ".github/workflows/demo-game3d.yml"
      - "tools/verify_1_1_release_candidate.py"
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "pyproject.toml"
      - "ROADMAP_1_1.md"
      - "demo_projects/neon_cube_hunt_3d/**"
      - "tests/test_demo_game3d_project.py"
      - ".github/workflows/demo-game3d.yml"
      - "tools/verify_1_1_release_candidate.py"

permissions:
  contents: read

jobs:
  smoke:
    name: Real OpenGL demo smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Unit-test demo project
        run: pytest tests/test_demo_game3d_project.py
      - name: Lint and compile demo project
        run: |
          ruff check demo_projects/neon_cube_hunt_3d tests/test_demo_game3d_project.py
          python -m compileall -q demo_projects/neon_cube_hunt_3d
      - name: Install software OpenGL/Xvfb runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libgl-dev libegl-dev
      - name: Boot and render real 3D game
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          SWIR_DEMO_SMOKE_FRAMES: "12"
        run: xvfb-run -a python demo_projects/neon_cube_hunt_3d/run_game.py

  bundle:
    name: Bundle demo (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pyinstaller
      - name: Build one-file demo
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile
          --collect-all glfw --collect-all glcontext
          --name NeonCubeHunt3D demo_projects/neon_cube_hunt_3d/run_game.py
      - name: Probe packaged Windows runtime
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SWIR_DEMO_RUNTIME_PROBE: "1"
        run: |
          & .\dist\NeonCubeHunt3D.exe
          if ($LASTEXITCODE -ne 0) {
            throw "Packaged Windows runtime probe failed with exit code $LASTEXITCODE"
          }
      - name: Give binary an OS-specific validation name
        shell: python
        run: |
          import platform
          from pathlib import Path

          system = platform.system()
          suffix = ".exe" if system == "Windows" else ""
          source = Path("dist") / f"NeonCubeHunt3D{suffix}"
          destination = Path("dist") / f"NeonCubeHunt3D-{system}{suffix}"
          source.rename(destination)
          print(destination)
      - uses: actions/upload-artifact@v4
        with:
          name: neon-cube-hunt-${{ runner.os }}
          path: dist/NeonCubeHunt3D-*
          if-no-files-found: error
