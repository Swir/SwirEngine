name: Runtime Diagnostics 1.9

on:
  push:
    branches:
      - main
      - "feat/1.9-runtime-diagnostics-support"
    paths:
      - "src/swirengine/diagnostics19.py"
      - "tests/test_runtime_diagnostics_1_9.py"
      - "examples/demo_runtime_diagnostics_1_9.py"
      - "tools/benchmark_runtime_diagnostics_1_9.py"
      - "docs/RUNTIME_DIAGNOSTICS_1_9.md"
      - "ROADMAP_1_9.md"
      - "assets/readme/progress-card.svg"
      - "assets/readme/progress-mini.svg"
      - "tools/generate_progress_svg.py"
      - ".github/workflows/runtime-diagnostics-1-9.yml"
  pull_request:
    paths:
      - "src/swirengine/diagnostics19.py"
      - "tests/test_runtime_diagnostics_1_9.py"
      - "examples/demo_runtime_diagnostics_1_9.py"
      - "tools/benchmark_runtime_diagnostics_1_9.py"
      - "docs/RUNTIME_DIAGNOSTICS_1_9.md"
      - "ROADMAP_1_9.md"
      - "assets/readme/progress-card.svg"
      - "assets/readme/progress-mini.svg"
      - "tools/generate_progress_svg.py"
      - ".github/workflows/runtime-diagnostics-1-9.yml"

permissions:
  contents: read

jobs:
  runtime-diagnostics:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install CPython 3.14 native build prerequisites
        if: matrix.python-version == '3.14'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Focused runtime diagnostics tests
        run: >-
          pytest -q
          tests/test_runtime_diagnostics_1_9.py

      - name: Creator support-bundle flow
        run: python examples/demo_runtime_diagnostics_1_9.py

      - name: Bounded report workload
        if: matrix.python-version == '3.13'
        run: >-
          python tools/benchmark_runtime_diagnostics_1_9.py
          --iterations 1000
          --max-seconds 8

      - name: Ruff
        if: matrix.python-version == '3.13'
        run: |
          ruff check src/swirengine/diagnostics19.py \
            tests/test_runtime_diagnostics_1_9.py \
            examples/demo_runtime_diagnostics_1_9.py \
            tools/benchmark_runtime_diagnostics_1_9.py

      - name: Compile
        run: |
          python -m compileall -q src/swirengine/diagnostics19.py \
            tests/test_runtime_diagnostics_1_9.py \
            examples/demo_runtime_diagnostics_1_9.py \
            tools/benchmark_runtime_diagnostics_1_9.py
