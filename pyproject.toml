[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "swirengine"
version = "0.3.3"
description = "Modern Python-first 2D/3D game engine with a unified API."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "SwirEngine contributors"}]
keywords = ["game-engine", "2d", "3d", "opengl", "moderngl", "python", "games"]
dependencies = [
  "numpy>=2.0",
  "moderngl>=5.12,<6",
  "glfw>=2.10,<3",
  "Pillow>=10,<13",
]

[project.optional-dependencies]
audio = ["pygame>=2.6,<3"]
dev = ["pytest>=8,<10", "ruff>=0.16,<0.17"]

[project.scripts]
swirengine = "swirengine.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/swirengine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
