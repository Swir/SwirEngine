[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "swirengine"
version = "2.0.0"
description = "Modern Python-first 2D/3D game engine with a unified API."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = {text = "MIT"}
authors = [{name = "SwirEngine contributors"}]
keywords = ["game-engine", "2d", "3d", "opengl", "moderngl", "python", "games", "gamepad", "controller"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Games/Entertainment",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
  "numpy>=2.0",
  "moderngl>=5.12,<6; python_version < '3.14' or sys_platform != 'win32' or platform_machine != 'AMD64'",
  "glfw>=2.10,<3",
  "Pillow>=10,<13",
  "typing-extensions>=4.12,<5",
  "tomli>=2,<3; python_version < '3.11'",
]

[project.optional-dependencies]
audio = ["pygame>=2.6,<3"]
dev = ["pytest>=8,<10", "ruff>=0.16,<0.17"]

[project.scripts]
swirengine = "swirengine.cli:main"
swireditor = "swirengine.editor_app21:main"

[project.urls]
Homepage = "https://github.com/Swir/SwirEngine"
Repository = "https://github.com/Swir/SwirEngine"
Changelog = "https://github.com/Swir/SwirEngine/blob/main/CHANGELOG.md"
Roadmap = "https://github.com/Swir/SwirEngine/blob/main/ROADMAP_2_0.md"
"1.0 Roadmap" = "https://github.com/Swir/SwirEngine/blob/main/ROADMAP.md"
"1.1 Roadmap" = "https://github.com/Swir/SwirEngine/blob/main/ROADMAP_1_1.md"
"1.2 Roadmap" = "https://github.com/Swir/SwirEngine/blob/main/ROADMAP_1_2.md"
"1.3 Roadmap" = "https://github.com/Swir/SwirEngine/blob/main/ROADMAP_1_3.md"
"1.4 Roadmap" = "https://github.com/Swir/SwirEngine/blob/main/ROADMAP_1_4.md"
"1.5 Roadmap" = "https://github.com/Swir/SwirEngine/blob/main/ROADMAP_1_5.md"

[tool.hatch.build.targets.wheel]
packages = ["src/swirengine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
# UITheme defaults are frozen Color value objects; sharing them is intentional and safe.
"src/swirengine/ui15.py" = ["RUF009"]
# Platform provider capabilities are intentionally runtime-registered duck types.
"src/swirengine/platform16.py" = ["B009"]
# Runtime diagnostics accepts ProjectManifest-like adapters and keeps scalar guards explicit.
"src/swirengine/diagnostics19.py" = ["B009", "SIM101"]
# GPU timing providers are third-party/backend boundaries; failures are deliberately contained.
"src/swirengine/render_timing18.py" = ["BLE001"]